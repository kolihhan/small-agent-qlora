name: PRO original GAIA100 paired stop reason audit (no model calls)

on:
  push:
    branches: [research/gaia100-rootcause-buckets-20261117]
    paths:
      - scripts/audit_gaia100_failure_buckets.py
      - tests/test_audit_gaia100_failure_buckets.py
      - .github/workflows/pro-gaia100-failure-buckets-cpu.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-original-100:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_audit_gaia100_failure_buckets.py
      - name: Recover 20 immutable original GAIA100 five-case paired shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 43865621132
          github-token: ${{ github.token }}
          pattern: gaia100-v7-format-shard-*
          path: original-20-shards
          merge-multiple: true
      - name: Verify all 100 original hash-paired states and bucket outcome causes
        run: |
          set -euo pipefail
          python -m scripts.audit_gaia100_failure_buckets \
            --inputs original-20-shards/gaia100-v7-format-*.json \
            --output evidence/gaia100-paired-failure-buckets.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gaia100-original-paired-failure-buckets-pro-evidence
          path: evidence/gaia100-paired-failure-buckets.json
          if-no-files-found: error
          retention-days: 30
