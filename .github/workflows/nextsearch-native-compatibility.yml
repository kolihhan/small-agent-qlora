name: PRO native GAIA source-action compatibility gate (CPU, no training)
on:
  push:
    branches: [experiment/native-gaia-action-source-gate-20261116]
    paths: [.github/workflows/nextsearch-native-compatibility.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check-source-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Test source/native tool schema invariants
        run: |
          python -m unittest discover -s tests -p 'test_nextsearch_native_compatibility.py' -v
      - name: Recover original physically frozen 48 NextSearch TRAIN states
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43726123262
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: nextsearch-full-context-balanced-source-4k-sft-v0
          path: inputs
      - name: Physical source-only compatibility audit, no model inference
        run: |
          python -m scripts.audit_nextsearch_native_compatibility \
            --source inputs/nextsearch-balanced-source-states-4k.jsonl \
            --output native-gaia-source-compatibility.json
          python -c "import json; r=json.load(open('native-gaia-source-compatibility.json')); assert r['native_qlora_training_examples_certified']==0 and r['new_gaia_score'] is None"
      - name: Preserve only aggregate tool contract and source checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-nextsearch-48-native-gaia-compatibility
          path: native-gaia-source-compatibility.json
          retention-days: 30
          if-no-files-found: error
