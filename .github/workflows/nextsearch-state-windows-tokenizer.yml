name: PRO Qwen9B full context check on genuine evidence-state SFT windows
on:
  push:
    branches: [experiment/nextsearch-gold-grounded-search-traces-20261115]
    paths: [.github/workflows/nextsearch-state-windows-tokenizer.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tokenize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m pip install 'transformers>=5.15,<6' 'jinja2>=3.1'
      - name: Recover precisely 173 original-source missing/present evidence state windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43724022656
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: nextsearch-source-evidence-state-causal-pilot
          path: inputs
      - name: Audit each source window against actual pinned Qwen9B chat template and token length
        run: |
          python -m scripts.preflight_nextsearch_9b_tokenization \
            --data inputs/nextsearch-source-causal-windows.jsonl \
            --output nextsearch-state-windows-qwen9b-lengths.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nextsearch-state-windows-9b-tokenizer-proof
          path: nextsearch-state-windows-qwen9b-lengths.json
          if-no-files-found: warn
