name: QLoRA v7 source-balanced whole-task SFT data + independent holdout CPU gate
on:
  workflow_dispatch:
  push:
    branches: [experiment/qlora-v7-source-balanced-sft-20261113]
    paths: [.github/QLORA_V7_CURRICULUM_START]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training-data prerequisites
        run: |
          python -m pip install -e ".[dev,eval,files]"
          python -m pip install 'transformers>=5.15,<6' 'jinja2>=3.1' 'sentencepiece>=0.2'
      - name: Test whole-parent source-disjoint curriculum
        run: python -m pytest -q tests/test_prepare_qlora_v7_curriculum.py tests/test_prepare_real_2048_complete_tasks.py tests/test_teacher_curation.py
      - name: Retrieve previously verified 55-task untruncated 2048-token TRAIN source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43391541760
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: qlora-v6-observed-multisource-2048
          path: runs/v6-source
      - name: Recreate genuine protected GAIA question identities from pinned source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || exit 42
          python - <<'PY'
          from gaia_small_agent.benchmark.gaia100 import load_validation
          from gaia_small_agent.training.protection import build_protected_question_hashes
          h=build_protected_question_hashes(load_validation(token=None), "runs/gaia-protected-hashes.json")
          assert len(h)>=100
          print("PROTECTED_GAIA_SET",len(h))
          PY
      - name: Source-stratified parent holdout and 9B tokenizer exact full-context audit
        run: |
          set -euo pipefail
          python -m scripts.prepare_qlora_v7_curriculum \
            --real runs/v6-source/real-v6-untruncated-training.jsonl \
            --protected runs/gaia-protected-hashes.json \
            --output runs/qlora-v7-train.jsonl \
            --validation runs/qlora-v7-heldout.jsonl \
            --report runs/qlora-v7-audit.json \
            --model Qwen/Qwen3.5-9B \
            --max-length 2048
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("runs/qlora-v7-audit.json").read_text())
          assert x["source_train_real_tasks"]>=40
          assert x["source_holdout_real_tasks"]>=10
          assert x["synthetic_capabilities_covered"]>=8
          assert 0.30 <= x["train_real_action_fraction"] <= 0.40
          assert x["no_tool_stop_tasks"]>=10
          assert x["training_ran"] is False
          print("QLORA_V7_NO_OVERFIT_DATA_GATE",json.dumps(x,sort_keys=True))
          PY
      - name: Export only TRAIN and source-disjoint validation + audit (not protected hashes)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qlora-v7-unique-balanced-train-validation
          path: |
            runs/qlora-v7-train.jsonl
            runs/qlora-v7-heldout.jsonl
            runs/qlora-v7-audit.json
          if-no-files-found: warn
          retention-days: 30
