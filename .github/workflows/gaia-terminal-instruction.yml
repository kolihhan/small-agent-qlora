name: GAIA same-prefix terminal suffix retry
on:
  workflow_dispatch:
  push:
    branches: [experiment/gaia-terminal-suffix-20261114]
    paths: [.github/workflows/gaia-terminal-instruction.yml]
permissions:
  contents: read
  actions: read

env:
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_SHA: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  V7_SHA: 475f5fb59a553390a0dde9425d36b42ff85a0345bdd31b8465c22fd4d2bc02e2

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 205
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[dev,eval,search,files]'
          python -m pytest -q tests/test_gaia_terminal_instruction.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43434228699
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: qlora-v7-converted-f16-gguf
          path: adapters
      - name: Prepare the checksum-pinned historical runtime and models
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 "$MODEL_URL" -o base.gguf
          curl -fsSL --retry 5 "$LLAMA_URL" -o llama.tar.gz
          echo "$MODEL_SHA  base.gguf" | sha256sum -c -
          echo "$LLAMA_SHA  llama.tar.gz" | sha256sum -c -
          echo "$V7_SHA  adapters/qlora-v7-adapter-f16.gguf" | sha256sum -c -
          mkdir -p llama
          tar -xzf llama.tar.gz -C llama
          server=$(find "$PWD/llama" -type f -name llama-server -print -quit)
          test -x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
      - name: Evaluate matched final requests with the original prefix intact
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          for arm in base v7; do
            extra=()
            if [ "$arm" = v7 ]; then
              extra=(--lora adapters/qlora-v7-adapter-f16.gguf)
            fi
            "$LLAMA_SERVER" -m base.gguf "${extra[@]}" --alias qwen3.5-9b \
              --host 127.0.0.1 --port 8080 --ctx-size 16384 --threads 4 \
              --parallel 1 --jinja --reasoning-budget 0 --temperature 0 \
              > "$RUNNER_TEMP/terminal-${arm}.log" 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            for i in {1..180}; do
              if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:8080/health >/dev/null
            python -m scripts.gaia_terminal_instruction --shard "$SHARD" --arm "$arm" \
              --output "${arm}-${SHARD}.json"
            kill "$pid"
            wait "$pid" || true
            trap - EXIT
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gaia-terminal-shard-${{ matrix.shard }}
          path: |
            base-${{ matrix.shard }}.json
            v7-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gaia-terminal-shard-*
          path: shards
          merge-multiple: true
      - name: Check exact pairing and publish aggregate metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.gaia_terminal_instruction import aggregate

          paired = [{**json.loads(Path(f"shards/base-{i}.json").read_text()),
                     **json.loads(Path(f"shards/v7-{i}.json").read_text())}
                    for i in range(5)]
          result = aggregate(paired)
          Path("gaia-terminal-summary.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gaia-terminal-summary
          path: gaia-terminal-summary.json
          if-no-files-found: error
          retention-days: 30
