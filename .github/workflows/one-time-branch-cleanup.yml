name: One-time branch consolidation cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  consolidate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge active QLoRA branch into main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/qlora/gaia-9b-v2:refs/remotes/origin/qlora/gaia-9b-v2"
          git merge --no-ff -X theirs origin/qlora/gaia-9b-v2 -m "chore: consolidate active QLoRA/GAIA work into main"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --quiet -e '.[dev,files,search]'

      - name: Verify consolidated main
        run: |
          python -m pytest -q
          python -m compileall -q src

      - name: Push consolidated main
        run: git push origin HEAD:main

      - name: Delete every remote branch except main
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });
            for (const branch of branches) {
              if (branch.name === 'main') continue;
              core.info(`Deleting branch: ${branch.name}`);
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`,
              });
            }
