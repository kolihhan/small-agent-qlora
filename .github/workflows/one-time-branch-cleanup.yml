name: One-time clean up archived research branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-branch-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  delete_archived:
    name: Preserve git ancestry, verify branch heads, remove only archived refs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full archived main history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove every old commit remains reachable from main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m = json.loads(Path("docs/archive/branch-heads-2026-11-23.json").read_text())
          rows = m["branches"]
          assert len(rows) == 143, f"Expected 143 original refs, got {len(rows)}"
          assert len({r["name"] for r in rows}) == 143
          assert all(r["name"] != "main" and len(r["sha"]) == 40 for r in rows)
          for r in rows:
              sha = r["sha"]
              result = subprocess.run(["git", "merge-base", "--is-ancestor", sha, "HEAD"], check=False)
              if result.returncode != 0:
                  raise SystemExit(f"UNREACHABLE_ARCHIVED_HEAD:{r['name']}:{sha}")
          for name in [
            "archive/2026-11-23/gaia_same_task.py",
            "archive/2026-11-23/gaia_v8_stability.py",
            "archive/2026-11-23/colab_v8_stage70_remote.py",
            "archive/2026-11-23/prepare_qlora_v8_multisource.py",
            "docs/reproduce.md", "docs/gaia-2026-11-23.md",
          ]:
              assert Path(name).is_file(), f"missing permanent on-main source: {name}"
          print("ALL_143_RESEARCH_BRANCH_HEADS_REACHABLE_FROM_MAIN", flush=True)
          PY
      - name: Remove archived branch refs using ephemeral scoped GitHub Actions token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          assert repository == "kolihhan/small-agent-qlora", "repository mismatch"
          assert os.environ["GITHUB_REF_NAME"] == "main", "only main workflow may clean up branches"
          token = os.environ["GH_TOKEN"]
          root = f"https://api.github.com/repos/{repository}"
          manifest = json.loads(Path("docs/archive/branch-heads-2026-11-23.json").read_text())
          expected = {row["name"]: row["sha"] for row in manifest["branches"]}
          assert len(expected) == 143

          def api(method, route, body=None):
              url = root + route
              data = None if body is None else json.dumps(body).encode()
              req = Request(url, data=data, method=method, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "small-agent-branch-archive-once",
                  **({"Content-Type": "application/json"} if data else {}),
              })
              for attempt in range(5):
                  try:
                      with urlopen(req, timeout=40) as response:
                          body = response.read()
                          return json.loads(body) if body else {}
                  except HTTPError as e:
                      message = e.read().decode("utf-8", errors="replace")[:400]
                      if e.code in (403, 429, 502, 503, 504) and attempt < 4:
                          time.sleep(min(60, 3 * 2**attempt))
                          continue
                      raise RuntimeError(f"{method} {route}: HTTP {e.code}: {message}") from None
                  except (URLError, TimeoutError):
                      if attempt < 4:
                          time.sleep(3 * 2**attempt)
                          continue
                      raise
              raise RuntimeError("Retry budget exhausted")

          def branches():
              result = {}
              page = 1
              while True:
                  chunk = api("GET", f"/branches?per_page=100&page={page}")
                  if not chunk:
                      break
                  for row in chunk:
                      result[row["name"]] = row["commit"]["sha"]
                  if len(chunk) < 100:
                      break
                  page += 1
              return result

          live = branches()
          assert "main" in live, "main is missing"
          remaining = {k: v for k, v in live.items() if k != "main"}
          assert remaining == expected, (
              "Branch manifest mismatch: no deletion performed; "
              f"missing={sorted(set(expected)-set(remaining))[:8]}, "
              f"new={sorted(set(remaining)-set(expected))[:8]}, "
              f"changed={sorted(k for k in expected.keys() & remaining.keys() if expected[k] != remaining[k])[:8]}"
          )

          # Fail closed before deleting ANY actual branch if token is read-only.
          tag = f"one-time-cleanup-write-test-{os.environ['GITHUB_RUN_ID']}"
          api("POST", "/git/refs", {"ref": "refs/tags/" + tag, "sha": live["main"]})
          api("DELETE", "/git/refs/tags/" + tag)
          print("SCOPED_GITHUB_TOKEN_WRITE_TEST_PASSED", flush=True)

          deleted = []
          failures = []
          for name in sorted(expected):
              path = "/git/refs/heads/" + quote(name, safe="/")
              try:
                  api("DELETE", path)
                  deleted.append(name)
                  if len(deleted) % 20 == 0:
                      print(f"ARCHIVED_REFS_DELETED={len(deleted)}/{len(expected)}", flush=True)
                  time.sleep(0.35)
              except Exception as e:
                  failures.append({"branch": name, "error": str(e)})
                  print(f"DELETE_FAILED {name}: {e}", file=sys.stderr, flush=True)

          after = branches()
          audit = {
              "schema": "small-agent-one-branch-cleanup/v1",
              "original_branches": len(expected),
              "archive_verified_in_main_ancestry": True,
              "deleted": deleted,
              "errors": failures,
              "remaining": sorted(after),
              "only_main_remains": set(after) == {"main"},
          }
          Path("branch-cleanup-audit.json").write_text(json.dumps(audit, indent=2)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Archived branch cleanup\n\n")
              out.write(f"- Archived original heads: **{len(expected)}** (verified reachable from main)\n")
              out.write(f"- Branch refs deleted: **{len(deleted)}**\n")
              out.write(f"- Remaining branches: **{', '.join(sorted(after))}**\n")
              if failures:
                  out.write(f"- Failures: **{len(failures)}**; see job logs\n")
          print("ONLY_MAIN_REMAINS="+str(audit["only_main_remains"]), flush=True)
          print("DELETED_COUNT="+str(len(deleted)), flush=True)
          if not audit["only_main_remains"] or len(deleted) != len(expected) or failures:
              raise SystemExit("CLEANUP_INCOMPLETE; see job logs")
          PY
      - name: Save cleanup evidence (if output exists)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: one-branch-cleanup-audit
          path: branch-cleanup-audit.json
          if-no-files-found: warn
          retention-days: 30
