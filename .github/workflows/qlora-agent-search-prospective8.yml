name: Qwen9B native vs content-search on novel 2Wiki VALIDATION8
on:
  push:
    branches: [experiment/qlora-v3b-novel2wiki-val8-20261116]
    paths: [scripts/eval_2wiki_content8.py, scripts/run_2wiki_content_pair.sh, .github/workflows/qlora-agent-search-prospective8.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[eval,dev]'
      - run: python -m scripts.eval_2wiki_v3b_novel8 --freeze --output frozen.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-2wiki-body8
          path: frozen.json
          if-no-files-found: error
  paired:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: source-2wiki-body8
      - run: bash scripts/run_2wiki_content_pair.sh ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2wiki-qwen-body-pair-${{ matrix.shard }}
          path: paired/case-*.json
          if-no-files-found: warn
  aggregate:
    needs: paired
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 2wiki-qwen-body-pair-*
          path: result-shards
          merge-multiple: true
      - run: python -m scripts.eval_2wiki_content8 --inputs result-shards/case-*.json --output result-2wiki-body8.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen9b-2wiki-body-search-prospective8-result
          path: result-2wiki-body8.json
          if-no-files-found: warn
