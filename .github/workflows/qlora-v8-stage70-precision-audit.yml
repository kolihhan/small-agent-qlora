name: V8 stage70 original precision read-only audit
on:
  push:
    branches: [research/v8-stage100-resume-20261121]
    paths: [.github/V8_STAGE70_PRECISION_AUDIT_START]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Download previous physical step70 reference
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 44861054303
          github-token: ${{ github.token }}
          name: qlora-v8-stage70-full-state-if-trained
          path: physical
      - name: Compare original step70 precision metadata (read only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,zipfile,hashlib
          from pathlib import Path
          path=Path('physical/qlora-v8-stage70-checkpoint.zip')
          assert path.is_file() and path.stat().st_size==539885434
          with zipfile.ZipFile(path) as z:
              names=set(z.namelist())
              assert {'checkpoint-70/trainer_state.json','checkpoint-70/optimizer.pt','checkpoint-70/scheduler.pt','checkpoint-70/rng_state.pth','run_config.json','stage70-verified-report.json'} <= names
              cfg=json.loads(z.read('run_config.json'))
              report=json.loads(z.read('stage70-verified-report.json'))
              state=json.loads(z.read('checkpoint-70/trainer_state.json'))
              print('STAGE70_DTYPE',repr(cfg.get('compute_dtype')))
              print('STAGE70_LOAD_DTYPE',repr(cfg.get('load_dtype')))
              print('STAGE70_MODEL',repr(cfg.get('model')))
              print('STAGE70_STEP',state.get('global_step'))
              print('STAGE70_MAX_STEPS',state.get('max_steps'))
              print('STAGE70_SAVE_STEPS',cfg.get('save_steps'))
              print('STAGE70_EXPECTED_SOURCE', report.get('original_training_code_sha')=='3eac23cca117a41855f4998399f79a5d9d5f4369')
              for name,field in (('adapter_model.safetensors','adapter_sha256'),('optimizer.pt','optimizer_sha256'),('scheduler.pt','scheduler_sha256'),('rng_state.pth','rng_sha256')):
                  h=hashlib.sha256()
                  with z.open('checkpoint-70/'+name) as f:
                      for part in iter(lambda:f.read(4*1024*1024),b''):h.update(part)
                  print('STAGE70_SHA',name,'MATCH' if h.hexdigest()==report.get(field) else 'MISMATCH')
          print('STAGE70_AUDIT_COMPLETE_NO_MODEL_PROMOTION')
          PY
