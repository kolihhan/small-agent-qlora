name: CPU ONLY frozen MuSiQue DEV48 failure triage (safe artifacts)
on:
  push:
    branches: [research/gaia-step100-dev48-failure-census-20261123]
    paths: [.github/workflows/dev48-safe-failure-triage.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check safe aggregation on synthetic cases only
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_diagnose_dev48_safe_metadata.py
      - name: Download original frozen DEV24A safe paired outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 45100549744
          pattern: MUDEV24-STEP100-WORKSPACE-FIND-SAFE-SHARD-*
          merge-multiple: true
          github-token: ${{ github.token }}
          path: safe-data/dev24a
      - name: Download original DEV24B safe paired outcomes (shards 0,1,3)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 45104088600
          pattern: MUDEV24B-STEP100-EVIDENCE-STATE-SAFE-SHARD-*
          merge-multiple: true
          github-token: ${{ github.token }}
          path: safe-data/dev24b
      - name: Download verified HTTP1 recovered DEV24B shard 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 45104501119
          name: MUDEV24B-STEP100-EVIDENCE-STATE-SAFE-SHARD-2-DOWNLOAD-RECOVERED
          github-token: ${{ github.token }}
          path: safe-data/dev24b
      - name: Validate 16 safe cases files, report aggregates only
        run: |
          set -euo pipefail
          test "$(find safe-data/dev24a -type f -name 'shard-*-*.json' | wc -l)" -eq 8
          test "$(find safe-data/dev24b -type f -name 'shard-*-*.json' | wc -l)" -eq 8
          python -m scripts.diagnose_dev48_safe_metadata \
            --dev24a safe-data/dev24a --dev24b safe-data/dev24b \
            --output safe/DEV48-SAFE-FAILURE-TRIAGE.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEV48-STEP100-FAILURE-TRIAGE-AGGREGATES-ONLY
          path: safe/DEV48-SAFE-FAILURE-TRIAGE.json
          if-no-files-found: error
          retention-days: 21
