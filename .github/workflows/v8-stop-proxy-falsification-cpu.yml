name: QLoRA v8 stop-sufficiency proxy falsification on frozen TRAIN304
on:
  push:
    branches: [research/agent-protocol-recovery-v1-20261122]
    paths:
      - scripts/audit_v8_stop_proxy_train.py
      - tests/test_audit_v8_stop_proxy_train.py
      - .github/workflows/v8-stop-proxy-falsification-cpu.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Synthetic tests
        run: |
          python -m pip install -q -e '.[dev]'
          python -m pytest -q tests/test_audit_v8_stop_proxy_train.py
      - uses: actions/download-artifact@v4
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 43619541894
          github-token: ${{ github.token }}
          name: qlora-v8-protected-source-balanced-token-checked
          path: .train
      - name: Test stop-condition proxy on exact frozen TRAIN304 without GAIA or model
        run: |
          python scripts/audit_v8_stop_proxy_train.py \
            --train .train/qlora-v8-train.jsonl \
            --output .report/train304-stop-proxy-falsification.json
      - uses: actions/upload-artifact@v4
        with:
          name: qlora-v8-train304-stop-proxy-gold-safe-aggregates
          path: .report/train304-stop-proxy-falsification.json
          if-no-files-found: error
          retention-days: 14
