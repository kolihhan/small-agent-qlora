name: CPU NextSearch 48 vs GAIA 465 + BIRD 1534 decontamination
on:
  push:
    paths:
      - ".github/workflows/nextsearch-decontam-gated-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install metadata only dependencies
        run: python -m pip install --quiet 'huggingface_hub>=0.30,<1' 'pyarrow>=18,<24'
      - name: Download SHA-pinned original BIRD DEV metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-cross-audit/gaia
          curl -fL --retry 3 "https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true" -o .tmp-cross-audit/bird_dev.json
          echo "ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  .tmp-cross-audit/bird_dev.json" | sha256sum -c -
      - name: Read pinned GAIA validation and test question metadata only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          import pyarrow.parquet as pq
          repo="gaia-benchmark/GAIA"
          revision="682dd723ee1e1697e00360edccf2366dc8418dd9"
          paths={"validation":"2023/validation/metadata.parquet","test":"2023/test/metadata.parquet"}
          for split,filename in paths.items():
              raw=Path(hf_hub_download(repo_id=repo,repo_type="dataset",filename=filename,revision=revision,token=os.environ["HF_TOKEN"]))
              rows=pq.read_table(raw).to_pylist()
              if not rows or any("Question" not in row or "task_id" not in row for row in rows):
                  raise RuntimeError("invalid pinned GAIA question metadata schema")
              out=Path(f".tmp-cross-audit/gaia/{split}.jsonl")
              # Do not download attached files or export reference answers.
              out.write_text("".join(json.dumps({"task_id":r["task_id"],"Question":r["Question"]})+"\n" for r in rows),encoding="utf-8")
              print(json.dumps({"split":split,"count":len(rows),"pinned_parquet_sha256":hashlib.sha256(raw.read_bytes()).hexdigest(),"reference_revision":revision}))
          PY
      - name: Download immutable source TRAIN48 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 43726123262
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          name: nextsearch-full-context-balanced-source-4k-sft-v0
          path: .tmp-cross-audit/train
      - name: Run 28-parent exact and near question contamination screen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_nextsearch_vs_gaia_bird.py \
            --train .tmp-cross-audit/train/nextsearch-balanced-source-states-4k.jsonl \
            --bird .tmp-cross-audit/bird_dev.json \
            --gaia-validation .tmp-cross-audit/gaia/validation.jsonl \
            --gaia-test .tmp-cross-audit/gaia/test.jsonl \
            --output .tmp-cross-audit/nextsearch-vs-gaia-bird-report.json || true
          test -s .tmp-cross-audit/nextsearch-vs-gaia-bird-report.json
      - name: Full training transcript exact-subspan screen (BIRD SQL included)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_nextsearch_span_overlap.py \
            --train .tmp-cross-audit/train/nextsearch-balanced-source-states-4k.jsonl \
            --bird .tmp-cross-audit/bird_dev.json \
            --gaia-validation .tmp-cross-audit/gaia/validation.jsonl \
            --gaia-test .tmp-cross-audit/gaia/test.jsonl \
            --output .tmp-cross-audit/nextsearch-all-messages-span-report.json || true
          test -s .tmp-cross-audit/nextsearch-all-messages-span-report.json
      - name: Upload ONLY sanitized hash/count evidence
        uses: actions/upload-artifact@v4
        with:
          name: nextsearch-source48-cross-contamination-hashed-report
          path: |
            .tmp-cross-audit/nextsearch-vs-gaia-bird-report.json
            .tmp-cross-audit/nextsearch-all-messages-span-report.json
          if-no-files-found: error
      - name: Require no near or exact flags; never silently pass
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path(".tmp-cross-audit/nextsearch-vs-gaia-bird-report.json").read_text())
          print("CROSS_CORPUS_AUDIT_STATUS",row["status"],"FLAGGED",row.get("total_flag_count","BLOCKED"))
          span=json.loads(Path(".tmp-cross-audit/nextsearch-all-messages-span-report.json").read_text())
          print("FULL_TRANSCRIPT_SPAN_STATUS",span["status"],"FLAGGED",span.get("flag_total","BLOCKED"))
          if row["status"]!="PASS_LEXICAL_SCREEN_ONLY" or span["status"]!="PASS_EXACT_SPAN_SCREEN_ONLY":
              raise SystemExit("Fail-closed; training source requires manual review")
          PY
