name: Native thinking protocol RED

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/native-thinking-budget
    paths:
      - "tests/test_reasoning_content_protocol.py"
      - ".github/workflows/native-thinking-protocol-red.yml"

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --quiet -e '.[test]'
      - name: Verify reasoning protocol tests are RED before implementation
        run: |
          set +e
          python -m pytest -q tests/test_reasoning_content_protocol.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED tests to fail before implementation, but they passed."
            exit 1
          fi
          echo "RED confirmed: reasoning_content protocol is not implemented yet."
