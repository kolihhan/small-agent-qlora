name: Native thinking protocol

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/native-thinking-budget
    paths:
      - "src/gaia_small_agent/agent/types.py"
      - "src/gaia_small_agent/agent/loop.py"
      - "src/gaia_small_agent/model/openai_compat.py"
      - "tests/test_reasoning_content_protocol.py"
      - ".github/workflows/native-thinking-protocol-red.yml"

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --quiet -e '.[dev]'
      - name: Verify reasoning-content protocol
        run: python -m pytest -q tests/test_reasoning_content_protocol.py
