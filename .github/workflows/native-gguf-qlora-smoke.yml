name: Native GGUF QLoRA CPU smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/NATIVE_GGUF_QLORA_TRIGGER"

permissions:
  contents: read

env:
  POLICY_SEED: tinyagent-policy-v1
  QVAC_COMMIT: 2633d8d8cab160906601eeb9e3d29a4a12da88cc
  MODEL_URL: https://huggingface.co/bartowski/Qwen_Qwen3.5-4B-GGUF/resolve/main/Qwen_Qwen3.5-4B-Q4_K_M.gguf?download=true
  MODEL_FILE: Qwen_Qwen3.5-4B-Q4_K_M.gguf

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Small Agent generator only
        run: python -m pip install -e .

      - name: Build four-row assistant-only smoke dataset
        run: |
          set -euo pipefail
          small-agent generate-oracle-policy --output-dir runs/oracle --seed "$POLICY_SEED"
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("runs/oracle/train.jsonl")
          rows = [json.loads(line) for line in source.read_text(encoding="utf-8").splitlines() if line.strip()]
          selected = [row for row in rows if row["capability"] == "no_tool_stop"][:4]
          assert len(selected) == 4
          output = Path("runs/native-smoke.jsonl")
          with output.open("w", encoding="utf-8") as handle:
              for row in selected:
                  messages = [
                      {"role": str(message["role"]), "content": str(message.get("content") or "")}
                      for message in row["messages"]
                      if message.get("role") in {"system", "user", "assistant"}
                  ]
                  assert [m["role"] for m in messages] == ["system", "user", "assistant"]
                  handle.write(json.dumps({"messages": messages}, ensure_ascii=False) + "\n")
          print(f"native_smoke_rows={len(selected)}")
          PY

      - name: Clone pinned qvac llama.cpp fork
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/tetherto/qvac-fabric-llm.cpp.git /tmp/qvac-llama
          git -C /tmp/qvac-llama checkout "$QVAC_COMMIT"
          test "$(git -C /tmp/qvac-llama rev-parse HEAD)" = "$QVAC_COMMIT"

      - name: Build native LoRA trainer and CLI
        run: |
          set -euo pipefail
          cmake -S /tmp/qvac-llama -B /tmp/qvac-llama/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON
          cmake --build /tmp/qvac-llama/build --config Release -j 4 --target llama-finetune-lora llama-cli
          /tmp/qvac-llama/build/bin/llama-finetune-lora --help | head -n 80

      - name: Download Qwen3.5 4B Q4_K_M
        run: |
          set -euo pipefail
          mkdir -p /tmp/model
          curl -fL --retry 3 --retry-delay 5 "$MODEL_URL" -o "/tmp/model/$MODEL_FILE"
          ls -lh "/tmp/model/$MODEL_FILE"
          sha256sum "/tmp/model/$MODEL_FILE" | tee runs/native-model.sha256

      - name: Train native Q4 LoRA smoke
        run: |
          set -euo pipefail
          /usr/bin/time -v /tmp/qvac-llama/build/bin/llama-finetune-lora \
            -m "/tmp/model/$MODEL_FILE" \
            -f runs/native-smoke.jsonl \
            -c 256 \
            -b 64 \
            -ub 64 \
            --assistant-loss-only \
            --lora-rank 2 \
            --lora-alpha 4 \
            --lora-modules "attn_q" \
            --lora-seed 42 \
            --learning-rate 1e-4 \
            --checkpoint-save-steps 1 \
            --checkpoint-save-dir runs/native-checkpoints \
            --output-adapter runs/native-smoke-adapter.gguf \
            -fa off \
            -t 4 -tb 4 \
            2>&1 | tee runs/native-train.log
          test -s runs/native-smoke-adapter.gguf
          ls -lh runs/native-smoke-adapter.gguf

      - name: Verify adapter reload with native inference
        run: |
          set -euo pipefail
          /tmp/qvac-llama/build/bin/llama-cli \
            -m "/tmp/model/$MODEL_FILE" \
            --lora runs/native-smoke-adapter.gguf \
            -p "The answer token is DIRECT-123456. Return only that token." \
            -n 16 \
            -t 4 \
            --no-display-prompt \
            > runs/native-adapter-inference.txt
          test -s runs/native-adapter-inference.txt
          cat runs/native-adapter-inference.txt

      - name: Write smoke verdict
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "schema_version": "native-gguf-qlora-smoke/v1",
              "success": True,
              "base_model": "bartowski/Qwen_Qwen3.5-4B-GGUF:Q4_K_M",
              "training_engine": "tetherto/qvac-fabric-llm.cpp",
              "training_engine_commit": "2633d8d8cab160906601eeb9e3d29a4a12da88cc",
              "rows": 4,
              "context": 256,
              "lora_rank": 2,
              "lora_alpha": 4,
              "lora_modules": ["attn_q"],
              "assistant_loss_only": True,
              "flash_attention": False,
              "cpu_threads": 4,
          }
          Path("runs/native-smoke-verdict.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gguf-qlora-smoke
          path: |
            runs/native-model.sha256
            runs/native-train.log
            runs/native-smoke-verdict.json
            runs/native-adapter-inference.txt
            runs/native-smoke-adapter.gguf
            runs/native-checkpoints/
          if-no-files-found: warn
          retention-days: 14
