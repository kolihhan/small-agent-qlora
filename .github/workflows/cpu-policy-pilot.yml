name: CPU Policy Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pilot dependencies
        run: python -m pip install -e ".[train,files]"

      - name: Run frozen Base-vs-LoRA pilot
        shell: bash
        run: |
          set +e
          python -m gaia_small_agent.training.cpu_policy_pilot > pilot-run.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Pilot failed; showing final diagnostic lines"
            tail -n 200 pilot-run.log
            exit "$status"
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("runs/cpu-policy-pilot-v1/result.json").read_text(encoding="utf-8"))
          compact = {
              "schema_version": result["schema_version"],
              "scope": result["scope"],
              "not_gaia": result["not_gaia"],
              "not_4b": result["not_4b"],
              "model": result["model"],
              "protocol": result["protocol"],
              "environment": result["environment"],
              "base": result["base"],
              "lora": result["lora"],
              "transitions": result["transitions"],
              "verdict": result["verdict"],
              "tasks": [
                  {
                      "task_id": row["task_id"],
                      "category": row["category"],
                      "base": {
                          "answer": row["base"]["answer"],
                          "correct": row["base"]["correct"],
                          "completed": row["base"]["completed"],
                          "required_tool_used": row["base"]["required_tool_used"],
                          "called_tools": row["base"]["called_tools"],
                      },
                      "lora": {
                          "answer": row["lora"]["answer"],
                          "correct": row["lora"]["correct"],
                          "completed": row["lora"]["completed"],
                          "required_tool_used": row["lora"]["required_tool_used"],
                          "called_tools": row["lora"]["called_tools"],
                      },
                  }
                  for row in result["tasks"]
              ],
          }
          print("CPU_POLICY_PILOT_SUMMARY_JSON=" + json.dumps(compact, ensure_ascii=False, separators=(",", ":")))
          Path("pilot-summary.json").write_text(json.dumps(compact, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Show result summary
        if: success()
        shell: bash
        run: |
          cat pilot-summary.json
          cat pilot-summary.json >> "$GITHUB_STEP_SUMMARY"
