name: v7 FinQA20 real numerical multi-tool transfer
on:
  workflow_dispatch:
  push:
    branches: [experiment/v7-finqa-numeric20-20261114]
    paths: [.github/workflows/qlora-v7-finqa-numeric20.yml]
permissions:
  contents: read
  actions: read

env:
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_SHA: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  V7_SHA: 475f5fb59a553390a0dde9425d36b42ff85a0345bdd31b8465c22fd4d2bc02e2

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install project and test numeric-source pairing; no external benchmark framework
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'git+https://github.com/akgitrepos/toolmisusebench@b6ee3412f98d2058ee487e182a72b26c58046d51'
          python -m pytest -q tests/test_finqa_numeric_v7_transfer20.py
      - name: Pin official FinQA DEV financial reports; require 20 internally coherent numeric labels
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 'https://raw.githubusercontent.com/czyssrs/FinQA/0f16e2867befa6840783e58be38c9efb9229d742/dataset/dev.json' -o finqa-dev.json
          python - <<'PY'
          from pathlib import Path
          from scripts.finqa_numeric_v7_transfer20 import select_cases
          rows, digest = select_cases(Path('finqa-dev.json'))
          assert len(rows)==20 and len({r['filename'] for r in rows})==20
          print('FROZEN_FINQA_DEV', digest, 'n=',len(rows),flush=True)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43434228699
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: qlora-v7-converted-f16-gguf
          path: adapters
      - name: Pull checksum-pinned historical Base and v7 GGUF
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 "$MODEL_URL" -o base.gguf
          curl -fsSL --retry 5 "$LLAMA_URL" -o llama.tar.gz
          echo "$MODEL_SHA  base.gguf" | sha256sum -c -
          echo "$LLAMA_SHA  llama.tar.gz" | sha256sum -c -
          echo "$V7_SHA  adapters/qlora-v7-adapter-f16.gguf" | sha256sum -c -
          mkdir -p llama
          tar -xzf llama.tar.gz -C llama
          server=$(find "$PWD/llama" -type f -name llama-server -print -quit)
          test -x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
      - name: Paired Base/v7 evaluation with native GAIA four-tool runtime on real numeric reports
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          for arm in base v7; do
            extra=()
            if [ "$arm" = v7 ]; then
              extra=(--lora adapters/qlora-v7-adapter-f16.gguf)
            fi
            "$LLAMA_SERVER" -m base.gguf "${extra[@]}" \
              --alias qwen3.5-9b --host 127.0.0.1 --port 8080 \
              --ctx-size 8192 --threads 4 --parallel 1 --jinja \
              --reasoning-budget 0 --temperature 0 \
              > "$RUNNER_TEMP/finqa-${arm}.log" 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            for i in {1..180}; do
              if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:8080/health >/dev/null
            python -m scripts.finqa_numeric_v7_transfer20 \
              --source finqa-dev.json --shard "$SHARD" --arm "$arm" \
              --output "${arm}-${SHARD}.json"
            kill "$pid"
            wait "$pid" || true
            trap - EXIT
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finqa-numeric-shard-${{ matrix.shard }}
          path: |
            base-${{ matrix.shard }}.json
            v7-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: finqa-numeric-shard-*
          path: shards
          merge-multiple: true
      - run: |
          python -m scripts.finqa_numeric_v7_transfer20 \
            --inputs shards/base-*.json shards/v7-*.json \
            --output finqa-numeric20-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finqa-numeric20-measured
          path: finqa-numeric20-final.json
          if-no-files-found: error
          retention-days: 30
