name: Matched Transformers QLoRA policy experiment

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_MODEL: Qwen/Qwen3.5-4B
  HF_REVISION: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  POLICY_SEED: tinyagent-policy-v1
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

jobs:
  matched-qlora:
    # Deliberately Linux GPU only. The intended runner is a WSL2/Ubuntu
    # self-hosted runner on the RTX machine, labelled `gpu`.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    steps:
      - name: Checkout exact experiment commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: GPU preflight
        run: |
          nvidia-smi
          python3 - <<'PY'
          import subprocess
          out = subprocess.check_output([
              "nvidia-smi",
              "--query-gpu=name,memory.total,driver_version",
              "--format=csv,noheader,nounits",
          ], text=True).strip()
          print(out)
          if not out:
              raise SystemExit("No NVIDIA GPU visible")
          first = out.splitlines()[0].split(",")
          memory_mib = int(first[1].strip())
          if memory_mib < 7000:
              raise SystemExit(f"Need >= 7000 MiB VRAM for this frozen QLoRA attempt; got {memory_mib}")
          PY

      - name: Set up isolated Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[train,files]"

      - name: Verify CUDA runtime
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import torch
          print({
              "torch": torch.__version__,
              "cuda_available": torch.cuda.is_available(),
              "cuda_version": torch.version.cuda,
              "device": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
              "vram_gib": round(torch.cuda.get_device_properties(0).total_memory / 1024**3, 2) if torch.cuda.is_available() else 0,
          })
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is not available to PyTorch")
          PY

      - name: Download frozen Transformers snapshot
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id=os.environ["HF_MODEL"],
              revision=os.environ["HF_REVISION"],
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"HF_MODEL_PATH={path}\n")
          print(path)
          PY

      - name: Generate frozen TinyAgent-style curriculum
        run: |
          . .venv/bin/activate
          small-agent generate-oracle-policy --output-dir runs/oracle --seed "$POLICY_SEED"
          python - <<'PY'
          import json
          from pathlib import Path
          Path("runs/empty-protected.json").write_text(
              json.dumps({"algorithm": "sha256-normalized-question-v1", "hashes": []}) + "\n",
              encoding="utf-8",
          )
          counts = {}
          for split in ("train", "dev", "test"):
              counts[split] = sum(1 for line in Path(f"runs/oracle/{split}.jsonl").read_text(encoding="utf-8").splitlines() if line.strip())
          assert counts == {"train": 1600, "dev": 200, "test": 200}, counts
          print(counts)
          PY

      - name: Evaluate matched Transformers Base
        run: |
          . .venv/bin/activate
          small-agent eval-policy \
            --tasks runs/oracle/test.jsonl \
            --work-root runs/matched-base-work \
            --output runs/matched-base.json \
            --backend transformers \
            --hf-model "$HF_MODEL_PATH" \
            --max-steps 12 \
            --max-new-tokens 512

      - name: Train frozen QLoRA v1
        run: |
          . .venv/bin/activate
          small-agent train-qlora \
            --data runs/oracle/train.jsonl \
            --output runs/qlora-adapter \
            --hf-model "$HF_MODEL_PATH" \
            --max-length 1536 \
            --epochs 2.0 \
            --protected-questions runs/empty-protected.json

      - name: Evaluate matched Transformers plus QLoRA
        run: |
          . .venv/bin/activate
          small-agent eval-policy \
            --tasks runs/oracle/test.jsonl \
            --work-root runs/matched-adapter-work \
            --output runs/matched-adapter.json \
            --backend transformers \
            --hf-model "$HF_MODEL_PATH" \
            --adapter runs/qlora-adapter \
            --max-steps 12 \
            --max-new-tokens 512

      - name: Build matched verdict
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import json, os
          from pathlib import Path
          from gaia_small_agent.training.policy_promotion import evaluate_policy_promotion

          base = json.loads(Path("runs/matched-base.json").read_text(encoding="utf-8"))
          adapter = json.loads(Path("runs/matched-adapter.json").read_text(encoding="utf-8"))
          verdict = evaluate_policy_promotion(base, adapter, min_exact_pp=10.0)
          payload = {
              "schema_version": "matched-transformers-qlora/v1",
              "commit_sha": os.environ["COMMIT_SHA"],
              "model": os.environ["HF_MODEL"],
              "model_revision": os.environ["HF_REVISION"],
              "backend": "transformers",
              "quantize_4bit": True,
              "policy_seed": os.environ["POLICY_SEED"],
              "training": {
                  "rows": 1600,
                  "epochs": 2.0,
                  "max_length": 1536,
                  "adapter_config": json.loads(Path("runs/qlora-adapter/run_config.json").read_text(encoding="utf-8")),
              },
              "baseline": base,
              "candidate": adapter,
              "promotion": verdict,
          }
          Path("runs/matched-verdict.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "base_correct": base["correct"],
              "base_total": base["total"],
              "adapter_correct": adapter["correct"],
              "adapter_total": adapter["total"],
              "exact_pp_delta": verdict["exact_pp_delta"],
              "promote": verdict["promote"],
              "reasons": verdict["reasons"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload aggregate verdict and adapter
        uses: actions/upload-artifact@v4
        with:
          name: matched-transformers-qlora-v1
          path: |
            runs/matched-verdict.json
            runs/qlora-adapter/
          if-no-files-found: error
          retention-days: 30
