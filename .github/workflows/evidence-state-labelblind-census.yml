name: LABELBLIND GAIA100 evidence acquisition CPU census
on:
  push:
    branches: [research/gaia-step100-evidence-state-prereg-20261123]
    paths: [.github/workflows/evidence-state-labelblind-census.yml]
permissions:
  contents: read
  actions: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - name: Run both synthetic safety and unchanged Agent tests
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_evidence_state_prereg.py tests/test_multihop_trace_access_labelblind.py tests/test_gaia_evidence_stop_contract20.py
      - name: Download frozen original GAIA100 trace artifacts - never upload raw files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 44980055775
          pattern: gaia-v8-paired-shard-*
          github-token: ${{ github.token }}
          path: original-private
      - name: Compute LABEL-BLIND aggregate (do not open task labels)
        run: |
          set -euo pipefail
          python -m scripts.diagnose_multihop_trace_access \
            --root original-private \
            --output safe/gaia100-labelblind-evidence-structure.json
          test -s safe/gaia100-labelblind-evidence-structure.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GAIA100-LABELBLIND-TOOL-EVIDENCE-AGGREGATES-ONLY
          path: safe/gaia100-labelblind-evidence-structure.json
          if-no-files-found: error
          retention-days: 21
