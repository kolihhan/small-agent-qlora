name: PRO verify real Qwen9B tokenizer accepts bounded NextSearch SFT contexts
on:
  push:
    branches: [experiment/nextsearch-gold-grounded-search-traces-20261115]
    paths: [.github/workflows/nextsearch-9b-tokenizer-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tokenizer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install original project loader and actual Qwen tokenizer without model weights
        run: |
          python -m pip install -e .
          python -m pip install 'transformers>=5.15,<6' 'huggingface-hub>=0.34' 'jinja2>=3.1'
      - name: Recover immutable verified original TRAIN source parent artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43723143610
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: nextsearch-source-bounded-sft-pilot-candidates
          path: inputs
      - name: Check real source tool-calls and full Qwen9B prompt token budgets before any GPU
        run: |
          python -m scripts.preflight_nextsearch_9b_tokenization \
            --data inputs/nextsearch-source-bounded-sft-parents.jsonl \
            --output nextsearch-9b-real-tokenizer-preflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nextsearch-9b-genuine-tokenizer-preflight
          path: nextsearch-9b-real-tokenizer-preflight.json
          retention-days: 30
          if-no-files-found: warn
