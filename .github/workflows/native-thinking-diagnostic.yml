name: Bounded native thinking diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/native-thinking-256
    paths:
      - ".github/workflows/native-thinking-diagnostic.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA256: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_RELEASE_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_RELEASE_SHA256: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  MODEL_ALIAS: qwen3.5-9b

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip

      - name: Install evaluation dependencies
        run: python -m pip install --quiet -e '.[search,files,eval]'

      - name: Verify GAIA credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_TOKEN_NOT_CONFIGURED"; exit 42; }

      - name: Download and verify Base 9B + llama-server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model /tmp/llama-bin
          curl -fL --retry 5 --retry-delay 3 "$MODEL_URL" -o model/Qwen3.5-9B-Q4_K_M.gguf
          echo "$MODEL_SHA256  model/Qwen3.5-9B-Q4_K_M.gguf" | sha256sum -c -
          curl -fL --retry 5 --retry-delay 3 "$LLAMA_RELEASE_URL" -o /tmp/llama.tar.gz
          echo "$LLAMA_RELEASE_SHA256  /tmp/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama-bin
          SERVER="$(find /tmp/llama-bin -type f -name llama-server -perm -111 | head -1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"

      - name: Start frozen Base 9B inference server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          "$LLAMA_SERVER" \
            -m model/Qwen3.5-9B-Q4_K_M.gguf \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 16384 --threads 4 --parallel 1 \
            --jinja --reasoning auto --reasoning-format deepseek --temperature 0 \
            > runs/llama-server.log 2>&1 &
          echo $! > runs/llama-server.pid
          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Run thinking 0 vs 256 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_native_thinking_diagnostic.py \
            --model "$MODEL_ALIAS" \
            --openai-base-url http://127.0.0.1:8080 \
            --hf-token "$HF_TOKEN" \
            --work-root runs/native-thinking \
            --output runs/native-thinking-summary.json

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f runs/llama-server.pid ]; then
            kill "$(cat runs/llama-server.pid)" 2>/dev/null || true
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-native-thinking-diagnostic
          path: |
            runs/native-thinking
            runs/native-thinking-summary.json
            runs/llama-server.log
          if-no-files-found: warn
          retention-days: 14
