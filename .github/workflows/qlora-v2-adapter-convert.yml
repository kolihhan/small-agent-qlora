name: Convert Qwen3.5 9B QLoRA v2 adapter

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qlora-v2-adapter-convert.yml"

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "38067275216"
  LLAMA_CPP_COMMIT: aa94f2086147cd4bfbcff818ce998dffce5fcb39
  BASE_MODEL_ID: Qwen/Qwen3.5-9B

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait for training run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in {1..180}; do
            payload="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
            status="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$payload")"
            conclusion="$(python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion"))' <<<"$payload")"
            echo "training status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] || { echo "training run failed"; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo "training run did not finish in time" >&2
          exit 1

      - name: Download adapter artifact
        uses: actions/download-artifact@v4
        with:
          name: qwen35-9b-qlora-v2-zero-gpu
          path: runs/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validate training artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f runs/source/qwen35-9b-qlora-v2-adapter.zip
          test -f runs/source/training-meta.json
          mkdir -p runs/adapter
          unzip -q runs/source/qwen35-9b-qlora-v2-adapter.zip -d runs/adapter
          test -s runs/adapter/adapter_config.json
          test -s runs/adapter/adapter_model.safetensors
          test -s runs/adapter/run_config.json
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('runs/adapter/adapter_config.json').read_text())
          meta = json.loads(Path('runs/source/training-meta.json').read_text())
          print(json.dumps({
              'base_model_name_or_path': cfg.get('base_model_name_or_path'),
              'r': cfg.get('r'),
              'lora_alpha': cfg.get('lora_alpha'),
              'target_modules': cfg.get('target_modules'),
              'training_meta': meta,
          }, indent=2, sort_keys=True))
          if meta.get('cuda') is not True:
              raise SystemExit('training metadata does not confirm CUDA')
          if meta.get('max_steps') != 40:
              raise SystemExit(f"unexpected max_steps: {meta.get('max_steps')}")
          PY

      - name: Pin llama.cpp converter and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout "$LLAMA_CPP_COMMIT"
          python -m pip install --quiet -r /tmp/llama.cpp/requirements/requirements-convert_lora_to_gguf.txt

      - name: Convert PEFT adapter to GGUF
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/llama.cpp/convert_lora_to_gguf.py \
            --base-model-id "$BASE_MODEL_ID" \
            --outfile runs/qwen35-9b-qlora-v2-adapter.gguf \
            --outtype f16 \
            runs/adapter
          test -s runs/qwen35-9b-qlora-v2-adapter.gguf
          sha256sum runs/qwen35-9b-qlora-v2-adapter.gguf | tee runs/qwen35-9b-qlora-v2-adapter.sha256

      - name: Save conversion provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'source_training_run_id': os.environ['SOURCE_RUN_ID'],
              'llama_cpp_commit': os.environ['LLAMA_CPP_COMMIT'],
              'base_model_id': os.environ['BASE_MODEL_ID'],
              'adapter_gguf_bytes': Path('runs/qwen35-9b-qlora-v2-adapter.gguf').stat().st_size,
              'adapter_sha256': Path('runs/qwen35-9b-qlora-v2-adapter.sha256').read_text().split()[0],
          }
          Path('runs/adapter-conversion-meta.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload converted adapter
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-9b-qlora-v2-gguf
          path: |
            runs/qwen35-9b-qlora-v2-adapter.gguf
            runs/qwen35-9b-qlora-v2-adapter.sha256
            runs/adapter-conversion-meta.json
            runs/source/training-meta.json
          if-no-files-found: error
          retention-days: 30
