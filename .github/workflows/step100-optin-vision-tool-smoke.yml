name: PROOF Qwen Step100 local vision tool + mmproj (NON-GAIA smoke)
on:
  push:
    branches: [research/gaia-step100-optin-vision-tool-preflight-20261123]
    paths: [.github/workflows/step100-optin-vision-tool-smoke.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: step100-vision-mmproj-nongaia-smoke-20261123
  cancel-in-progress: true
env:
  BASE_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  BASE_SHA: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  MM_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/mmproj-F16.gguf?download=true
  MM_SHA: 2f7ce3652232b91c2220fad23f5b62d110f67e84bd5ed33a7d2bea82f8ee1d26
  LLM_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLM_SHA: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b

jobs:
  vision_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - name: Verify opt-in isolation and no network outside localhost
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]' pillow
          python -m pytest -q tests/test_view_image_optin.py
      - name: Fetch same pinned Step100 base Qwen and its original matching mmproj vision projector
        run: |
          set -euo pipefail
          mkdir -p model /tmp/llama-bin adapter
          curl -fL --retry 5 --retry-delay 3 "$BASE_URL" -o model/base.gguf
          echo "$BASE_SHA  model/base.gguf" | sha256sum -c -
          curl -fL --retry 5 --retry-delay 3 "$MM_URL" -o model/mmproj.gguf
          echo "$MM_SHA  model/mmproj.gguf" | sha256sum -c -
          curl -fL --retry 5 --retry-delay 3 "$LLM_URL" -o /tmp/llama.tar.gz
          echo "$LLM_SHA  /tmp/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama-bin
          SERVER=$(find /tmp/llama-bin -type f -name llama-server -perm -111 | head -n1)
          test -x "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "MATCHING_QWEN_MM_PROJECTION_SHA_VERIFIED"
      - name: Obtain unchanged audited BF16 continuous QLoRA Step100 GGUF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 44980055775
          name: gaia-v8-audited-gguf
          github-token: ${{ github.token }}
          path: adapter
      - name: Verify exact Step100 training continuity and adapter SHA
        run: |
          set -euo pipefail
          GGUF=$(find adapter -type f -name 'v8-qlora-adapter.gguf' -print -quit)
          MANIFEST=$(find adapter -type f -name 'gguf-conversion-manifest.json' -print -quit)
          test -s "$GGUF" && test -s "$MANIFEST"
          checksum=$(python -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["training_run_id"] == 44925307580 and m["training_steps"] == 100 and m["model"] == "Qwen/Qwen3.5-9B"; print(m["gguf_adapter_sha256"])' "$MANIFEST")
          test "$checksum" = "$(sha256sum "$GGUF" | cut -d' ' -f1)"
          echo "V8_GGUF=$GGUF" >> "$GITHUB_ENV"
      - name: Run real local image inference through paired Step100 + projector, no GAIA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke safe
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          for color, number in (("red", "7"), ("blue", "4")):
              img=Image.new("RGB",(512,320),color)
              draw=ImageDraw.Draw(img)
              font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",160)
              draw.text((190,65),number,fill="white",font=font)
              img.save(Path("smoke") / f"{color}.png")
          print("SYNTHETIC_ORIGINAL_NONGAIA_VISUAL_PROBES_READY")
          PY
          "$LLAMA_SERVER" -m model/base.gguf --mmproj model/mmproj.gguf \
            --lora "$V8_GGUF" --alias qwen3.5-9b \
            --host 127.0.0.1 --port 8080 --ctx-size 8192 --threads 4 \
            --parallel 1 --jinja --reasoning-budget 0 --temperature 0 \
            > /tmp/qwen-step100-mmproj-private.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null || {
            echo "VLM_SERVER_FAILED_MM_PROJECTION_LOAD"; exit 1;
          }
          python - <<'PY'
          import json
          from pathlib import Path
          from gaia_small_agent.tools.view_image import ViewImageTool
          tool=ViewImageTool(timeout_s=300)
          data={}
          for color,number in (("red","7"),("blue","4")):
              result=tool.run({"path":f"{color}.png"},Path("smoke"))
              data[color]={
                  "ok":result.ok,
                  "error_code":result.error_code,
                  "model_named_expected_color":color in result.content.casefold(),
                  "model_named_expected_number":number in result.content or ("seven" if number=="7" else "four") in result.content.casefold(),
                  "returned_chars":len(result.content),
              }
          payload={
              "protocol":"QWEN-STEP100-MM-PROJECTOR-VISION-NONGAIA-SMOKE-V1",
              "matched_model_base_and_step100":True,
              "projector_sha_verified":True,
              "tool_default_off":True,
              "no_gaia_content_or_answers":True,
              "results":data,
              "vision_backend_functional":all(x["ok"] for x in data.values()),
              "exact_synthetic_color_probe_pass":all(x["model_named_expected_color"] for x in data.values()),
              "exact_synthetic_number_probe_pass":all(x["model_named_expected_number"] for x in data.values()),
              "gaia_correctness_evaluated":False,
          }
          Path("safe/vision-smoke.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print("QWEN_STEP100_OPTIN_VISION_SMOKE",json.dumps(payload,sort_keys=True))
          if not payload["vision_backend_functional"]:
              raise SystemExit("VIEW_IMAGE_REAL_INFERENCE_UNAVAILABLE")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: QWEN-STEP100-VISION-MMPROJ-NONGAIA-SMOKE-ONLY
          path: safe/vision-smoke.json
          if-no-files-found: warn
          retention-days: 21
