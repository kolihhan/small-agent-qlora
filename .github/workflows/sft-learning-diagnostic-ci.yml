name: SFT learning diagnostic CI

on:
  push:
    branches:
      - experiment/sft-learning-diagnostic
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/sft-learning-diagnostic-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --quiet -e '.[dev,files,search]'
      - name: Run test suite
        run: python -m pytest -q
      - name: Audit v3 oracle observations against runtime wire format
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from collections import Counter, defaultdict
          import json
          from pathlib import Path

          from gaia_small_agent.agent.loop import MAX_TOOL_OBSERVATION_CHARS
          from gaia_small_agent.tools import default_tools
          from gaia_small_agent.training.oracle_policy_v3 import generate_oracle_policy_v3_dataset
          from gaia_small_agent.training.policy_eval import _FixtureSearchTool
          from gaia_small_agent.training.trajectories import _materialize_files

          paths = generate_oracle_policy_v3_dataset('runs/oracle-v3', seed='small-agent-policy-v3')
          report = {
              'schema_version': 'small-agent-oracle-runtime-protocol-audit/v1',
              'seed': 'small-agent-policy-v3',
              'splits': {},
          }

          for split, path in paths.items():
              rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
              total = matched = 0
              by_tool = defaultdict(Counter)
              by_capability = defaultdict(Counter)
              mismatch_kinds = Counter()

              for row in rows:
                  task_id = str(row['task_id'])
                  capability = str(row['capability'])
                  workspace = Path('runs/protocol-work') / split / task_id
                  workspace.mkdir(parents=True, exist_ok=True)
                  _materialize_files(row.get('eval_task') or {}, workspace)

                  tools = {tool.name: tool for tool in default_tools()}
                  fixtures = (row.get('eval_task') or {}).get('search_fixtures') or {}
                  tools['search'] = _FixtureSearchTool(fixtures)
                  messages = row['messages']
                  oracle_results = {
                      str(message.get('tool_call_id')): str(message.get('content') or '')
                      for message in messages
                      if isinstance(message, dict) and message.get('role') == 'tool'
                  }

                  for message in messages:
                      if not isinstance(message, dict) or message.get('role') != 'assistant':
                          continue
                      for call in message.get('tool_calls') or []:
                          function = call.get('function') or {}
                          name = str(function.get('name') or '')
                          arguments = function.get('arguments') or {}
                          if isinstance(arguments, str):
                              arguments = json.loads(arguments)
                          result = tools[name].run(arguments, workspace)
                          actual, _ = result.bounded_observation(MAX_TOOL_OBSERVATION_CHARS)
                          expected = oracle_results[str(call['id'])]
                          is_match = actual == expected
                          total += 1
                          matched += int(is_match)
                          by_tool[name]['total'] += 1
                          by_tool[name]['matched'] += int(is_match)
                          by_capability[capability]['total'] += 1
                          by_capability[capability]['matched'] += int(is_match)
                          if not is_match:
                              if expected.startswith('ERROR[') and actual.startswith('ToolError['):
                                  mismatch_kinds['error_prefix'] += 1
                              elif actual.startswith('ToolMeta:'):
                                  mismatch_kinds['runtime_metadata_prefix'] += 1
                              else:
                                  mismatch_kinds['content_shape'] += 1

              report['splits'][split] = {
                  'rows': len(rows),
                  'tool_observations': total,
                  'matched': matched,
                  'mismatched': total - matched,
                  'match_rate': matched / total if total else 1.0,
                  'by_tool': {key: dict(value) for key, value in sorted(by_tool.items())},
                  'by_capability': {key: dict(value) for key, value in sorted(by_capability.items())},
                  'mismatch_kinds': dict(sorted(mismatch_kinds.items())),
              }

          output = Path('runs/oracle-runtime-protocol-audit.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload protocol audit
        uses: actions/upload-artifact@v4
        with:
          name: sft-oracle-runtime-protocol-audit
          path: runs/oracle-runtime-protocol-audit.json
          if-no-files-found: error
          retention-days: 30
