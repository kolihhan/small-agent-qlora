name: SFT learning diagnostic CI

on:
  push:
    branches:
      - experiment/sft-learning-diagnostic
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/sft-learning-diagnostic-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --quiet -e '.[dev,files,search]'
      - name: Run test suite
        run: python -m pytest -q
