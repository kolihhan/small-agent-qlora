name: Next-action evaluator tests

on:
  push:
    branches:
      - experiment/heldout-next-action-eval
    paths:
      - "src/gaia_small_agent/training/next_action_eval.py"
      - "tests/test_next_action_eval.py"
      - ".github/workflows/next-action-eval-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --quiet -e '.[dev]'
      - run: python -m pytest -q tests/test_next_action_eval.py
