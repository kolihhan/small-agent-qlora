name: CPU Pilot Token Budget Diagnostic

on:
  push:
    branches:
      - experiment/cpu-pilot-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tokenizer dependencies
        run: python -m pip install -e ".[files]" "transformers>=5.15,<6" "jinja2>=3.1"
      - name: Measure frozen training examples
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from transformers import AutoTokenizer
          from gaia_small_agent.training.cpu_policy_pilot import MODEL_NAME, TRAIN_MAX_LENGTH, build_frozen_task_sets, build_oracle_training_data
          from gaia_small_agent.training.qlora import load_verified_rows, _render_turn_examples

          root = Path("runs/token-budget-diagnostic")
          train, _ = build_frozen_task_sets(root / "protocol")
          data = build_oracle_training_data(train, root / "train.jsonl", root / "oracle-work")
          rows = load_verified_rows(data)
          tokenizer = AutoTokenizer.from_pretrained(MODEL_NAME, trust_remote_code=True)
          examples = _render_turn_examples(tokenizer, rows)
          details = []
          for i, ex in enumerate(examples):
              prompt_tokens = len(tokenizer(ex["prompt"], add_special_tokens=False)["input_ids"])
              completion_tokens = len(tokenizer(ex["completion"], add_special_tokens=False)["input_ids"])
              details.append({"index": i, "prompt_tokens": prompt_tokens, "completion_tokens": completion_tokens})
          report = {
              "model": MODEL_NAME,
              "configured_max_length": TRAIN_MAX_LENGTH,
              "examples": len(details),
              "prompt_min": min(x["prompt_tokens"] for x in details),
              "prompt_max": max(x["prompt_tokens"] for x in details),
              "completion_min": min(x["completion_tokens"] for x in details),
              "completion_max": max(x["completion_tokens"] for x in details),
              "prompt_at_or_above_limit": sum(x["prompt_tokens"] >= TRAIN_MAX_LENGTH for x in details),
              "all_details": details,
          }
          print("CPU_PILOT_TOKEN_BUDGET_JSON=" + json.dumps(report, separators=(",", ":")))
          PY
