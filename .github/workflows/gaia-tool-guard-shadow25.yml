name: GAIA Shadow25 original Qwen9B vs tool-loop guard (CPU paired)
on:
  workflow_dispatch:
  push:
    branches: [fix/gaia-tool-call-loop-control-20261113]
    paths:
      - .github/GAIA_GUARD_SHADOW_START

permissions:
  contents: read
  actions: read

jobs:
  matched:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 320
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODEL: qwen3.5:9b-q4_K_M
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install GAIA and tool requirements
        run: |
          python -m pip install -e ".[dev,eval,search,files]"
          python -m pytest -q tests/test_tool_policy_guard.py tests/test_gaia_guard_shadow.py
      - name: Require actual GAIA dataset credential
        run: |
          test -n "$HF_TOKEN" || { echo "GAIA HF_TOKEN unavailable"; exit 42; }
      - name: Install CPU Ollama and exact Qwen 9B
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$MODEL"
      - name: Run same GAIA Shadow cases with old and guarded tool runtimes
        run: |
          set -euo pipefail
          python -m scripts.gaia_guard_shadow \
            --shard "${{ matrix.shard }}" \
            --model "$MODEL" \
            --output "gaia-guard-shard-${{ matrix.shard }}.json"
      - name: Upload only hashed task IDs and non-gated metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gaia-guard-shard-${{ matrix.shard }}
          path: gaia-guard-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: matched
    if: ${{ always() && needs.matched.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gaia-guard-shard-*
          path: shards
          merge-multiple: true
      - name: Aggregate actual paired GAIA Shadow25
        run: |
          python -m scripts.gaia_guard_shadow \
            --inputs shards/gaia-guard-shard-0.json shards/gaia-guard-shard-1.json shards/gaia-guard-shard-2.json shards/gaia-guard-shard-3.json \
            --output gaia-tool-guard-shadow25.json
          python - <<'PY'
          import json
          result=json.load(open("gaia-tool-guard-shadow25.json"))
          assert result["task_count"]==25
          print("PAIRED_SHADOW", json.dumps({k:v for k,v in result.items() if k!="rows"},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gaia-tool-guard-shadow25
          path: gaia-tool-guard-shadow25.json
          if-no-files-found: error
          retention-days: 30
