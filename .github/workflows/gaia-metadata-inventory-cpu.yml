name: Inventory pinned gated GAIA metadata paths (CPU only)
on:
  push:
    paths:
      - ".github/workflows/gaia-metadata-inventory-cpu.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face API client
        run: python -m pip install --quiet 'huggingface_hub>=0.30,<1'
      - name: List only dataset metadata paths and sizes
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python - <<'PY'
          import os,json
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          ref='682dd723ee1e1697e00360edccf2366dc8418dd9'
          files=api.list_repo_tree('gaia-benchmark/GAIA',repo_type='dataset',revision=ref,recursive=True)
          safe=[{'path':f.path,'size':getattr(f,'size',None)} for f in files if f.path.endswith(('.parquet','.jsonl','.json','.csv'))]
          print(json.dumps({'revision':ref,'count':len(safe),'metadata_paths':safe[:40]},indent=2))
          assert any('validation' in x['path'] for x in safe)
          assert any('test' in x['path'] for x in safe)
          PY
