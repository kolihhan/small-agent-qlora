name: Original Qwen v7 NEW 2Wiki32 identical-prefix terminal JSON fork
on:
  push:
    branches: [research/verified-prefix-fork-20261119]
    paths: [.github/workflows/physical-v7-2wiki32-final-json-fork.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_SHA: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  V7_SHA: 475f5fb59a553390a0dde9425d36b42ff85a0345bdd31b8465c22fd4d2bc02e2
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -e '.[eval,files,dev]'
          python -m pytest -q tests/test_eval_2wiki32_v7_same_prefix_terminal_json.py
          python -m compileall -q scripts/eval_2wiki32_v7_same_prefix_terminal_json.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 43712873154, github-token: "${{ github.token }}", name: 2wiki-original-source-cohort-frozen, path: old-linked}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 43862358318, github-token: "${{ github.token }}", name: source-2wiki-body8, path: old-novel}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44016763563, github-token: "${{ github.token }}", name: qwen9b-2wiki16-serializer-new-source-locked, path: old16}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44022276727, github-token: "${{ github.token }}", name: qwen9b-2wiki48-serializer-new-source-locked, path: old48}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44034337935, github-token: "${{ github.token }}", name: qwen9b-v7-factorial-new8-source-frozen, path: old8}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44477751745, github-token: "${{ github.token }}", name: v7-2wiki16-blind-source, path: old72}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44486630457, github-token: "${{ github.token }}", name: v7-next16-output-contract-blind, path: old88}
      - name: Freeze independent next 32 public identities/support article paths, no publisher gold inference
        run: |
          set -euo pipefail
          python -m scripts.eval_2wiki32_v7_same_prefix_terminal_json freeze \
            --prior-linked old-linked/2wiki-linked-frozen.json \
            --prior-novel old-novel/frozen.json \
            --prior16 old16/2wiki16-serializer-source-frozen.json \
            --prior48 old48/2wiki48-serializer-source-frozen.json \
            --prior8 old8/factorial-new8-source-frozen.json \
            --prior72 old72/blind.json \
            --prior88 old88/blind.json \
            --out blind.json --labels references.json
          python - <<'PY'
          import json
          s=json.load(open('blind.json')); g=json.load(open('references.json'))
          assert s['n']==32 and s['shards']==8 and s['previous_88_disjoint_task_and_support']
          assert s['source_sha']==g['source_sha']
          assert len({r['id'] for r in s['cases']})==32
          assert all('answer' not in r and 'support' not in r for r in s['cases'])
          print('NEW32_QWEN_V7_BLIND_FROZEN',s['source_sha'],flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: qwen-v7-2wiki32-jsonfork-blind, path: blind.json, if-no-files-found: error, retention-days: 30}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: qwen-v7-2wiki32-jsonfork-publisher-references, path: references.json, if-no-files-found: error, retention-days: 30}
  physical:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[eval,files]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qwen-v7-2wiki32-jsonfork-blind, path: frozen}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 43434228699, github-token: "${{ github.token }}", name: qlora-v7-converted-f16-gguf, path: adapter}
      - name: Pin identical original Qwen3.5-9B GGUF and v7 adapter SHAs
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 "$MODEL_URL" -o base.gguf
          curl -fsSL --retry 5 "$LLAMA_URL" -o llama.tar.gz
          echo "$MODEL_SHA  base.gguf" | sha256sum -c -
          echo "$LLAMA_SHA  llama.tar.gz" | sha256sum -c -
          echo "$V7_SHA  adapter/qlora-v7-adapter-f16.gguf" | sha256sum -c -
          mkdir llama
          tar -xzf llama.tar.gz -C llama
          server=$(find "$PWD/llama" -type f -name llama-server -print -quit)
          test -x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
      - name: One real upstream agent run; two different same-prefix final decoding calls ONLY when step12 reached
        env: {SHARD: "${{ matrix.shard }}"}
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" -m base.gguf --lora adapter/qlora-v7-adapter-f16.gguf \
            --alias qwen3.5-9b --host 127.0.0.1 --port 8080 \
            --ctx-size 16384 --threads 4 --parallel 1 --jinja --reasoning-budget 0 \
            --temperature 0 > "$RUNNER_TEMP/llama.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..180}; do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/health >/dev/null
          python -m scripts.eval_2wiki32_v7_same_prefix_terminal_json infer \
            --source frozen/blind.json --shard "$SHARD" \
            --work "work-$SHARD" --out "shard-$SHARD.json"
          python - <<'PY'
          import glob,json
          xs=glob.glob('shard-*.json'); assert len(xs)==1
          r=json.load(open(xs[0]))
          assert r['n']==4 and r['gold_not_loaded']
          assert r['status']=='GOLD_BLIND_ALL_ORIGINAL_AND_JSON_FINALS_SEALED'
          print('SEALED_IDENTICAL_PREFIX_ORIGINAL_JSON_FINAL',r['shard'],flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "v7-new32-jsonfork-pred-${{ matrix.shard }}", path: shard-*.json, if-no-files-found: warn, retention-days: 30}
  final:
    needs: physical
    if: always() && needs.physical.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[eval]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qwen-v7-2wiki32-jsonfork-blind, path: frozen}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "v7-new32-jsonfork-pred-*", merge-multiple: true, path: pred}
      - name: Retrieve publisher answers only AFTER all original and JSON final answers were sealed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qwen-v7-2wiki32-jsonfork-publisher-references, path: ref}
      - name: Paired exact scores, terminal rescue / regression and overhead
        run: |
          set -euo pipefail
          python -m scripts.eval_2wiki32_v7_same_prefix_terminal_json score \
            --source frozen/blind.json --labels ref/references.json \
            --parts pred/shard-0.json pred/shard-1.json pred/shard-2.json pred/shard-3.json \
                    pred/shard-4.json pred/shard-5.json pred/shard-6.json pred/shard-7.json \
            --out final-v7-jsonfork-32.json
          python - <<'PY'
          import json
          x=json.load(open('final-v7-jsonfork-32.json'))
          assert x['n']==32 and x['no_GAIA'] and x['no_QLoRA_training']
          assert x['promotion_allowed'] is False
          print('FINAL_V7_NEW32_IDENTICAL_PREFIX_JSON',json.dumps({k:v for k,v in x.items() if k!='cases'},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: qwen-v7-new32-identical-prefix-JSON-FINAL, path: final-v7-jsonfork-32.json, if-no-files-found: error, retention-days: 30}
