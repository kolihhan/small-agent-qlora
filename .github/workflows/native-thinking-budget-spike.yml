name: Native thinking budget spike

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/native-thinking-budget
    paths:
      - ".github/workflows/native-thinking-budget-spike.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA256: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_RELEASE_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_RELEASE_SHA256: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  MODEL_ALIAS: qwen3.5-9b
  TASK_ID: f918266a-b3e0-4914-865d-4faa564f1aef

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install evaluation dependencies
        run: python -m pip install --quiet -e '.[search,files,eval,dev]'
      - name: Verify GAIA credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_TOKEN_NOT_CONFIGURED"; exit 42; }
      - name: Verify protocol regression tests
        run: python -m pytest -q tests/test_reasoning_content_protocol.py
      - name: Download and verify frozen Base 9B + llama-server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model /tmp/llama-bin runs
          curl -fL --retry 5 --retry-delay 3 "$MODEL_URL" -o model/Qwen3.5-9B-Q4_K_M.gguf
          echo "$MODEL_SHA256  model/Qwen3.5-9B-Q4_K_M.gguf" | sha256sum -c -
          curl -fL --retry 5 --retry-delay 3 "$LLAMA_RELEASE_URL" -o /tmp/llama.tar.gz
          echo "$LLAMA_RELEASE_SHA256  /tmp/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama-bin
          SERVER="$(find /tmp/llama-bin -type f -name llama-server -perm -111 | head -1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
      - name: Run budget 0 arm
        shell: bash
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" \
            -m model/Qwen3.5-9B-Q4_K_M.gguf \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 16384 --threads 4 --parallel 1 \
            --jinja --reasoning on --reasoning-format deepseek --reasoning-budget 0 --temperature 0 \
            > runs/llama-budget0.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null
          python scripts/run_native_thinking_case.py \
            --model "$MODEL_ALIAS" \
            --openai-base-url http://127.0.0.1:8080 \
            --hf-token "$HF_TOKEN" \
            --task-id "$TASK_ID" \
            --reasoning-budget 0 \
            --work-root runs/native-thinking/budget0 \
            --output runs/native-thinking/budget0-summary.json
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Run budget 256 protocol probe and arm
        shell: bash
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" \
            -m model/Qwen3.5-9B-Q4_K_M.gguf \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 16384 --threads 4 --parallel 1 \
            --jinja --reasoning on --reasoning-format deepseek --reasoning-budget 256 --temperature 0 \
            > runs/llama-budget256.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from gaia_small_agent.model.openai_compat import OpenAICompatModel

          model = OpenAICompatModel(model="qwen3.5-9b", base_url="http://127.0.0.1:8080", max_new_tokens=512)
          tools = [{
              "type": "function",
              "function": {
                  "name": "echo",
                  "description": "Echo the supplied text.",
                  "parameters": {
                      "type": "object",
                      "properties": {"text": {"type": "string"}},
                      "required": ["text"],
                      "additionalProperties": False,
                  },
              },
          }]
          messages = [
              {"role": "system", "content": "Use the available tool when the user explicitly asks you to."},
              {"role": "user", "content": "Call the echo tool exactly once with text ping."},
          ]
          turn = model.complete(messages, tools)
          payload = {
              "reasoning_present": bool(turn.reasoning_content.strip()),
              "reasoning_chars": len(turn.reasoning_content),
              "tool_call_count": len(turn.tool_calls),
              "tool_names": [call.name for call in turn.tool_calls],
          }
          Path("runs/native-thinking").mkdir(parents=True, exist_ok=True)
          Path("runs/native-thinking/protocol-probe.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          if not payload["reasoning_present"]:
              raise SystemExit("native thinking probe returned no reasoning_content")
          if payload["tool_names"] != ["echo"]:
              raise SystemExit(f"native tool-call probe mismatch: {payload['tool_names']}")
          print(json.dumps(payload, indent=2))
          PY
          python scripts/run_native_thinking_case.py \
            --model "$MODEL_ALIAS" \
            --openai-base-url http://127.0.0.1:8080 \
            --hf-token "$HF_TOKEN" \
            --task-id "$TASK_ID" \
            --reasoning-budget 256 \
            --work-root runs/native-thinking/budget256 \
            --output runs/native-thinking/budget256-summary.json
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Build paired summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          old = json.loads(Path("runs/native-thinking/budget0-summary.json").read_text(encoding="utf-8"))
          new = json.loads(Path("runs/native-thinking/budget256-summary.json").read_text(encoding="utf-8"))
          probe = json.loads(Path("runs/native-thinking/protocol-probe.json").read_text(encoding="utf-8"))
          payload = {
              "schema_version": "native-thinking-budget-paired/v1",
              "task_id": old["task_id"],
              "model": "qwen3.5-9b Q4_K_M",
              "reasoning_format": "deepseek",
              "max_new_tokens": 512,
              "context_tokens": 16384,
              "max_steps": 12,
              "temperature": 0,
              "protocol_probe": probe,
              "budget0": old,
              "budget256": new,
              "delta_256_minus_0": {
                  "correct": int(new["correct"]) - int(old["correct"]),
                  "completed": int(new["completed"]) - int(old["completed"]),
                  "steps": new["steps"] - old["steps"],
                  "tool_calls": new["tool_calls"] - old["tool_calls"],
                  "tool_errors": new["tool_errors"] - old["tool_errors"],
                  "duplicate_calls_blocked": new["duplicate_calls_blocked"] - old["duplicate_calls_blocked"],
                  "latency_ms": new["latency_ms"] - old["latency_ms"],
              },
              "live_search_confound": bool(old["used_live_search"] or new["used_live_search"]),
          }
          out = Path("runs/native-thinking/paired-summary.json")
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - name: Upload bounded spike evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-thinking-budget-spike
          path: |
            runs/native-thinking
            runs/llama-budget0.log
            runs/llama-budget256.log
          if-no-files-found: error
          retention-days: 14
