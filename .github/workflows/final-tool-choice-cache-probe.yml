name: Final tool-choice cache probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - debug/qlora-clean-eval
    paths:
      - ".github/workflows/final-tool-choice-cache-probe.yml"
      - "src/gaia_small_agent/agent/loop.py"
      - "src/gaia_small_agent/model/openai_compat.py"
      - "tests/test_final_tool_choice_cache_regression.py"

permissions:
  contents: read

env:
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA256: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_RELEASE_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_RELEASE_SHA256: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  MODEL_ALIAS: qwen3.5-9b

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime
        run: python -m pip install --quiet -e '.[files,search]'

      - name: Download frozen base and llama-server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model /tmp/llama-bin runs/cache-probe
          curl -fL --retry 5 --retry-delay 3 "$MODEL_URL" -o model/Qwen3.5-9B-Q4_K_M.gguf
          echo "$MODEL_SHA256  model/Qwen3.5-9B-Q4_K_M.gguf" | sha256sum -c -
          curl -fL --retry 5 --retry-delay 3 "$LLAMA_RELEASE_URL" -o /tmp/llama.tar.gz
          echo "$LLAMA_RELEASE_SHA256  /tmp/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama-bin
          SERVER="$(find /tmp/llama-bin -type f -name llama-server -perm -111 | head -1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"

      - name: Run cache-preserving A/B probe
        shell: bash
        run: |
          set -euo pipefail
          run_mode() {
            mode="$1"
            port="$2"
            log="runs/cache-probe/${mode}.log"
            "$LLAMA_SERVER" \
              -m model/Qwen3.5-9B-Q4_K_M.gguf \
              --alias "$MODEL_ALIAS" \
              --host 127.0.0.1 --port "$port" \
              --ctx-size 16384 --threads 4 --parallel 1 \
              --jinja --reasoning-budget 0 --temperature 0 \
              > "$log" 2>&1 &
            pid=$!
            for i in {1..180}; do
              if curl -fsS "http://127.0.0.1:${port}/health" >/dev/null; then break; fi
              sleep 2
            done
            curl -fsS "http://127.0.0.1:${port}/health" >/dev/null
            MODE="$mode" PORT="$port" python - <<'PY'
          import json
          import os
          import time
          import requests
          from gaia_small_agent.agent.loop import SYSTEM_PROMPT
          from gaia_small_agent.tools import default_tools

          mode = os.environ["MODE"]
          port = os.environ["PORT"]
          url = f"http://127.0.0.1:{port}/v1/chat/completions"
          tools = [tool.definition() for tool in default_tools()]

          messages = [
              {"role": "system", "content": SYSTEM_PROMPT},
              {"role": "user", "content": "Use the accumulated tool evidence and answer concisely."},
          ]
          for i in range(1, 8):
              call_id = f"call-{i}"
              messages.append({
                  "role": "assistant",
                  "content": "",
                  "tool_calls": [{
                      "id": call_id,
                      "type": "function",
                      "function": {"name": "search", "arguments": {"query": f"synthetic query {i}"}},
                  }],
              })
              messages.append({
                  "role": "tool",
                  "tool_call_id": call_id,
                  "name": "search",
                  "content": (f"Synthetic evidence block {i}. " + ("x" * 1200)),
              })

          def post(payload):
              started = time.perf_counter()
              r = requests.post(url, json=payload, timeout=180)
              elapsed = time.perf_counter() - started
              r.raise_for_status()
              return elapsed, r.json()

          prime_payload = {
              "model": os.environ["MODEL_ALIAS"],
              "messages": messages,
              "tools": tools,
              "tool_choice": "auto",
              "temperature": 0,
              "max_tokens": 8,
          }
          prime_s, _ = post(prime_payload)

          final_messages = list(messages)
          final_messages.append({
              "role": "assistant",
              "content": "",
              "tool_calls": [{
                  "id": "call-8",
                  "type": "function",
                  "function": {"name": "python", "arguments": {"code": "print(519)"}},
              }],
          })
          final_messages.append({
              "role": "tool",
              "tool_call_id": "call-8",
              "name": "python",
              "content": "519",
          })
          final_payload = {
              "model": os.environ["MODEL_ALIAS"],
              "messages": final_messages,
              "temperature": 0,
              "max_tokens": 32,
          }
          if mode == "tool-choice-none":
              final_payload["tools"] = tools
              final_payload["tool_choice"] = "none"
          elif mode != "legacy-empty-tools":
              raise SystemExit(f"unknown mode: {mode}")

          final_s, final_data = post(final_payload)
          out = {
              "mode": mode,
              "prime_seconds": prime_s,
              "final_seconds": final_s,
              "final_message": final_data.get("choices", [{}])[0].get("message", {}),
          }
          with open(f"runs/cache-probe/{mode}.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          print(json.dumps(out, indent=2, ensure_ascii=False))
          PY
            kill "$pid" || true
            wait "$pid" || true
          }

          run_mode tool-choice-none 8080
          run_mode legacy-empty-tools 8081

      - name: Summarize cache selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = {"schema_version": "final-tool-choice-cache-probe/v1", "modes": {}}
          for mode in ("tool-choice-none", "legacy-empty-tools"):
              data = json.loads(Path(f"runs/cache-probe/{mode}.json").read_text(encoding="utf-8"))
              log = Path(f"runs/cache-probe/{mode}.log").read_text(encoding="utf-8", errors="replace")
              selections = [line.strip() for line in log.splitlines() if "selected slot by" in line]
              payload["modes"][mode] = {
                  "prime_seconds": data["prime_seconds"],
                  "final_seconds": data["final_seconds"],
                  "selection_lines": selections,
                  "final_selection": selections[-1] if selections else None,
                  "final_used_lcp": bool(selections and "LCP similarity" in selections[-1]),
                  "final_used_lru": bool(selections and "LRU" in selections[-1]),
              }
          payload["cache_preservation_confirmed"] = bool(
              payload["modes"]["tool-choice-none"]["final_used_lcp"]
              and payload["modes"]["legacy-empty-tools"]["final_used_lru"]
          )
          Path("runs/cache-probe/summary.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          if not payload["cache_preservation_confirmed"]:
              raise SystemExit("cache A/B did not confirm expected LCP-vs-LRU behavior")
          PY

      - name: Upload cache probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-tool-choice-cache-probe
          path: runs/cache-probe
          if-no-files-found: error
          retention-days: 14
