name: Source-only old AppWorld login HTTP status sharp bounds (NO QWEN)
on:
  push:
    branches: [research/offline-login-status-identifiability-20261120]
    paths: [.github/workflows/offline-appworld-login-http-identifiability.yml]
permissions:
  contents: read
  actions: read
jobs:
  historical_only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Synthetic offline identifiability tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_appworld_old_login_status_identifiability.py
      - name: Fetch immutable original Qwen SAFE scene1 JSON ONLY, no runner/task
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 44679395972
          github-token: ${{ github.token }}
          name: appworld-train-qwen-token-provenance-1
          path: historical_source
      - name: Offline recompute status/login possible assignments and unidentifiability
        run: |
          set -euo pipefail
          python -m scripts.appworld_old_login_status_identifiability \
            --source historical_source/qwen-appworld-train-token-provenance-1.json \
            --out historical-login-status-sharp-bounds.json
          python - <<'PY'
          import json
          d=json.load(open('historical-login-status-sharp-bounds.json'))
          assert d['post401_login_attempts_observed_in_private_runner']==8
          assert d['possible_login_HTTP_status_count_bounds']=={'401':[7,8],'422':[0,1]}
          assert d['exact_per_login_status_join_from_retained_artifact'] is False
          assert d['no_new_Qwen_calls'] and d['old_raw_trace_not_recoverable_from_this_artifact']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: APPWORLD-HISTORICAL-SCENE1-8-LOGIN-SHARP-401-422-BOUNDS-IDENTITY-LOST
          path: historical-login-status-sharp-bounds.json
          if-no-files-found: error
          retention-days: 60
