name: AppWorld TRAIN8 Supervisor credentials access bridge vs public API contract (NO QWEN)
# Corrected source-only counts + 2k model-visible docs budget and scene-profile deduplication.
# Fail-closed source and prefix tests corrected in head commit; do not count an incomplete workflow.
on:
  push:
    branches: [research/appworld-supervisor-credential-capability-gate-20261120]
    paths: [.github/workflows/appworld-train-supervisor-credential-capability.yml]
permissions:
  contents: read
  actions: read

jobs:
  train_source_lock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Contract tests no AppWorld protected content
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_appworld_supervisor_credential_capability.py
      - name: Install pinned upstream AppWorld and freeze TRAIN8 source IDs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs
          git lfs install
          mkdir -p "$RUNNER_TEMP/appworld"
          cd "$RUNNER_TEMP/appworld"
          git init -q
          git remote add origin https://github.com/StonyBrookNLP/appworld.git
          git fetch -q --depth 1 origin 42b5bcf3cd334fee33f0c37c02070a9f5807add5
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "42b5bcf3cd334fee33f0c37c02070a9f5807add5"
          git lfs pull
          python -m pip install -e .
          python -m pip install 'pydantic==2.12.5' 'fastapi==0.120.4'
          appworld install --repo
          appworld download data
          export APPWORLD_ROOT="$RUNNER_TEMP/appworld"
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import json
          from scripts.appworld_train_first_feedback_fork import task_roster,digest
          from appworld import load_task_ids
          picked=task_roster()
          assert len(picked)==8 and len({s.split('_',1)[0] for s in picked})==8
          print('APPWORLD_TRAIN_FIXED_8_SCENES_SOURCE_HASH_ONLY',digest(picked),
                'task_count_total',len(load_task_ids('train')))
          PY

      - name: CPU-only eight-scene Supervisor credential API capability census, NO LOGIN
        shell: bash
        run: |
          set -euo pipefail
          export APPWORLD_ROOT="$RUNNER_TEMP/appworld"
          cd "$GITHUB_WORKSPACE"
          python -m scripts.appworld_train_supervisor_credential_capability --out credential-capability-sourceonly.json
          python - <<'PY'
          import json
          d=json.load(open('credential-capability-sourceonly.json'))
          assert d['source_scenes']==8 and d['no_Qwen_calls'] and d['no_login_attempt']
          assert d['no_private_instruction_or_credential_data_exported']
          assert d['main_research_decision']=='BRIDGE_CAPABILITY_MISSING_BEFORE_AUTH_PLANNING'
          assert d['standard_credential_lookup_status_counts']=={
            'OFFICIAL_CREDENTIAL_LOOKUP_DOCUMENTED_BUT_BRIDGE_BLOCKED':8}
          assert d['can_all_user_account_credentials_be_obtained_legitimately']=='UNDETERMINED'
          assert all(r['safe']['public_supervisor_credential_APIs_both_documented']
                     and not r['safe']['both_credential_APIs_callable_via_current_bridge']
                     and r['safe']['model_docs_lists_supervisor_completion']
                     and not r['safe']['model_docs_lists_credential_APIs']
                     for r in d['original_scenes_safe_only'])
          print('SUPERVISOR_PUBLIC_CREDENTIAL_PATH_DENIED_BY_ORIGINAL_BRIDGE',
                d['standard_credential_lookup_status_counts'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: APPWORLD-TRAIN8-SUPERVISOR-CREDENTIAL-LOOKUP-BRIDGE-GATE-SOURCE-ONLY
          path: credential-capability-sourceonly.json
          if-no-files-found: error
          retention-days: 60
