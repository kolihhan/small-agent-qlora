name: Export complete-context real QLoRA 2048-token training candidates

on:
  workflow_dispatch:
  push:
    branches: [research/verified-teacher-trajectory-v0-20261112]
    paths: [.github/QLORA_REAL_2048_DATA_START]

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify source and 2048-token whole-trace protocol without GPU
        run: |
          python -m pip install -e ".[dev,eval,files]"
          python -m pip install 'transformers>=5.15,<6' 'jinja2>=3.1' 'sentencepiece>=0.2'
          python -m pytest -q tests/test_prepare_real_2048_data.py tests/test_audit_curated_tokenizer.py
      - name: Download only genuine successful multi-source strict curated data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43249410666
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: teacher-multisource-strict-curated
          path: runs/source
      - name: Build real GAIA validation protection (never train or export GAIA)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python - <<'PY'
          from gaia_small_agent.benchmark.gaia100 import load_validation
          from gaia_small_agent.training.protection import build_protected_question_hashes
          hashes=build_protected_question_hashes(
              load_validation(token=None),"runs/gaia-protected-hashes.json")
          assert len(hashes)>=100
          print("PROTECTED_GAIA_IDENTITIES",len(hashes))
          PY
      - name: Export only complete 2048-token tasks with final answer preserved
        run: |
          set -euo pipefail
          python -m scripts.prepare_real_2048_data \
            --input runs/source/multi-source-strict-curated.jsonl \
            --protected runs/gaia-protected-hashes.json \
            --model Qwen/Qwen3.5-9B \
            --min-tasks 30 --min-second-source 3 \
            --output runs/real-hotpot-2wiki-fullcontext2048.jsonl \
            --report runs/real-hotpot-2wiki-fullcontext2048-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runs/real-hotpot-2wiki-fullcontext2048-report.json")
          o=json.loads(p.read_text())
          assert o["schema"]=="real-multisource-full-task-2048-v1"
          assert o["retained_unique_tasks"]>=30
          assert o["source_counts"]["2wikimultihopqa-train"]>=3
          assert o["retained_final_answers"]==o["retained_unique_tasks"]
          assert o["require_full_prompt"] is True
          assert o["new_model_training_ran"] is False
          print("TRAINING_CANDIDATES_READY_NOT_TRAINED",o["retained_unique_tasks"],o["retained_native_actions"])
          PY
      - name: Archive trace-faithful real multi-source SFT candidates and audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-hotpot-2wiki-2048-untruncated
          path: |
            runs/real-hotpot-2wiki-fullcontext2048.jsonl
            runs/real-hotpot-2wiki-fullcontext2048-report.json
          if-no-files-found: error
          retention-days: 30
