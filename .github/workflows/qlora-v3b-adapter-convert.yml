name: Convert Qwen3.5 9B QLoRA v3B adapter

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qlora-v3b-adapter-convert.yml"

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "38152689194"
  SOURCE_ARTIFACT: "qwen35-9b-qlora-v3b-adapter"
  LLAMA_CPP_COMMIT: aa94f2086147cd4bfbcff818ce998dffce5fcb39
  BASE_MODEL_ID: Qwen/Qwen3.5-9B
  EXPERIMENT_COMMIT: ad8e72e9bdfdccda978e5538470b68fa08f4eccc

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Verify successful v3B training run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          status="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d["status"], d.get("conclusion"))' <<<"$payload")"
          echo "training $status"
          [ "$status" = "completed success" ] || { echo "verified v3B training run is not successful"; exit 1; }

      - name: Download verified v3B adapter artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: runs/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validate v3B training provenance
        shell: bash
        run: |
          set -euo pipefail
          test -f runs/source/qwen35-9b-qlora-v3b-adapter.zip
          test -f runs/source/training-meta.json
          mkdir -p runs/adapter
          unzip -q runs/source/qwen35-9b-qlora-v3b-adapter.zip -d runs/adapter
          test -s runs/adapter/adapter_config.json
          test -s runs/adapter/adapter_model.safetensors
          test -s runs/adapter/run_config.json
          test -s runs/adapter/training-exposure.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_cfg = json.loads(Path('runs/adapter/run_config.json').read_text())
          exposure = json.loads(Path('runs/adapter/training-exposure.json').read_text())
          meta = json.loads(Path('runs/source/training-meta.json').read_text())
          expected_caps = {
              'argument_grounding': 6,
              'duplicate_avoidance': 4,
              'evidence_to_final': 20,
              'failure_recovery': 8,
              'multi_step': 12,
              'no_tool_stop': 2,
              'strategy_switch': 6,
              'tool_selection': 6,
          }
          assert meta.get('ok') is True, meta
          assert meta.get('cuda') is True, meta
          assert meta.get('model') == 'Qwen/Qwen3.5-9B', meta
          assert meta.get('experiment_commit') == os.environ['EXPERIMENT_COMMIT'], meta
          assert meta.get('max_steps') == 64, meta
          assert meta.get('max_length') == 1024, meta
          assert meta.get('gradient_accumulation_steps') == 1, meta
          assert meta.get('training_examples') == 64, meta
          assert meta.get('selected_example_count') == 64, meta
          assert meta.get('action_type_counts') == {'final': 29, 'tool_call': 35}, meta
          assert meta.get('capability_counts') == expected_caps, meta
          assert meta.get('require_full_prompt') is True, meta
          assert run_cfg.get('training_examples') == 64, run_cfg
          assert run_cfg.get('max_length') == 1024, run_cfg
          assert run_cfg.get('require_full_prompt') is True, run_cfg
          assert run_cfg.get('exposure_profile') == 'v3b-diagnostic', run_cfg
          assert exposure.get('selection_sha256') == meta.get('selection_sha256'), (exposure, meta)
          print(json.dumps({'training_meta': meta, 'selection_sha256': exposure.get('selection_sha256')}, indent=2, sort_keys=True))
          PY

      - name: Pin llama.cpp converter and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout "$LLAMA_CPP_COMMIT"
          python -m pip install --quiet -r /tmp/llama.cpp/requirements/requirements-convert_lora_to_gguf.txt
          python -m pip install --quiet --upgrade 'transformers>=5.15,<6'
          python - <<'PY'
          from transformers import AutoConfig, __version__
          cfg = AutoConfig.from_pretrained('Qwen/Qwen3.5-9B')
          print('transformers', __version__, 'model_type', cfg.model_type)
          assert cfg.model_type == 'qwen3_5'
          PY

      - name: Convert PEFT adapter to GGUF
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/llama.cpp/convert_lora_to_gguf.py \
            --base-model-id "$BASE_MODEL_ID" \
            --outfile runs/qwen35-9b-qlora-v3b-adapter.gguf \
            --outtype f16 \
            runs/adapter
          test -s runs/qwen35-9b-qlora-v3b-adapter.gguf
          sha256sum runs/qwen35-9b-qlora-v3b-adapter.gguf | tee runs/qwen35-9b-qlora-v3b-adapter.sha256

      - name: Save conversion provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'source_training_run_id': os.environ['SOURCE_RUN_ID'],
              'source_artifact': os.environ['SOURCE_ARTIFACT'],
              'experiment_commit': os.environ['EXPERIMENT_COMMIT'],
              'training_steps': 64,
              'llama_cpp_commit': os.environ['LLAMA_CPP_COMMIT'],
              'base_model_id': os.environ['BASE_MODEL_ID'],
              'adapter_gguf_bytes': Path('runs/qwen35-9b-qlora-v3b-adapter.gguf').stat().st_size,
              'adapter_sha256': Path('runs/qwen35-9b-qlora-v3b-adapter.sha256').read_text().split()[0],
          }
          Path('runs/adapter-conversion-meta.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload converted v3B adapter
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-9b-qlora-v3b-gguf
          path: |
            runs/qwen35-9b-qlora-v3b-adapter.gguf
            runs/qwen35-9b-qlora-v3b-adapter.sha256
            runs/adapter-conversion-meta.json
            runs/source/training-meta.json
          if-no-files-found: error
          retention-days: 30
