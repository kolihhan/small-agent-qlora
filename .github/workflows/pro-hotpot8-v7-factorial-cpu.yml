name: PRO Hotpot8 cross-family Base-v7 x serializer physical (CPU)
on:
  pull_request:
    types: [opened, synchronize]
    branches: [experiment/gaia-protected-v7-factorial-2wiki8-20261117]
    paths:
      - scripts/eval_hotpot8_v7_factorial.py
      - tests/test_eval_hotpot8_v7_factorial.py
      - .github/workflows/pro-hotpot8-v7-factorial-cpu.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_SHA: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  V7_SHA: 475f5fb59a553390a0dde9425d36b42ff85a0345bdd31b8465c22fd4d2bc02e2
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m pip install -e '.[eval,dev,files]'
          python -m pytest -q tests/test_eval_hotpot8_v7_factorial.py
          python -m compileall -q scripts/eval_hotpot8_v7_factorial.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 44010234843
          github-token: ${{ github.token }}
          name: hotpot8-source-frozen-before-model
          path: prior-hotpot8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 44011715345
          github-token: ${{ github.token }}
          name: qwen9b-hotpot16-serializer-source-frozen
          path: prior-hotpot16
      - name: Freeze balanced Hotpot8 new bridge/comparison tasks, excluding old 8 and 16
        run: |
          set -euo pipefail
          python -m scripts.eval_hotpot8_v7_factorial --source-only \
            --prior8 prior-hotpot8/hotpot8-frozen.json \
            --prior16 prior-hotpot16/new-hotpot16-frozen.json \
            --output hotpot8-factorial-source.json
          python - <<'PY'
          import json
          x=json.load(open('hotpot8-factorial-source.json'))
          assert x['status']=='PREINFERENCE_FROZEN_PUBLIC_HOTPOT8'
          assert x['n']==8 and x['task_types']=={'bridge':4,'comparison':4}
          assert x['excluded_prior_task_ids']==24
          assert x['new_annotated_support_paths']==16
          print('HOTPOT8_SOURCE_FROZEN_BEFORE_MODEL',x['source_sha'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotpot8-v7-factorial-crossfamily-source-frozen
          path: hotpot8-factorial-source.json
          if-no-files-found: error
          retention-days: 30
  paired:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3]
        mode: [base,adapter]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[eval,files]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hotpot8-v7-factorial-crossfamily-source-frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 43434228699
          github-token: ${{ github.token }}
          name: qlora-v7-converted-f16-gguf
          path: adapters
      - name: Hash-pin same Base Qwen9B GGUF, original v7 adapter and llama runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 "$MODEL_URL" -o base.gguf
          curl -fsSL --retry 5 "$LLAMA_URL" -o llama.tar.gz
          echo "$MODEL_SHA  base.gguf" | sha256sum -c -
          echo "$LLAMA_SHA  llama.tar.gz" | sha256sum -c -
          echo "$V7_SHA  adapters/qlora-v7-adapter-f16.gguf" | sha256sum -c -
          mkdir -p llama
          tar -xzf llama.tar.gz -C llama
          server=$(find "$PWD/llama" -type f -name llama-server -print -quit)
          test -x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
      - name: Actual local article search/read Qwen9B with and without v7 LoRA
        env:
          SHARD: "${{ matrix.shard }}"
          MODE: "${{ matrix.mode }}"
        shell: bash
        run: |
          set -euo pipefail
          args=(-m base.gguf --alias qwen3.5-9b --host 127.0.0.1 --port 8080 --ctx-size 16384 --threads 4 --parallel 1 --jinja --reasoning-budget 0 --temperature 0)
          if [ "$MODE" = adapter ]; then args+=(--lora adapters/qlora-v7-adapter-f16.gguf); fi
          "$LLAMA_SERVER" "${args[@]}" > "$RUNNER_TEMP/hotpot8-$MODE-$SHARD.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..180}; do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/health >/dev/null
          python -m scripts.eval_hotpot8_v7_factorial \
            --frozen hotpot8-factorial-source.json --mode "$MODE" --shard "$SHARD" \
            --output "hotpot8-$MODE-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: "hotpot8-physical-${{ matrix.mode }}-${{ matrix.shard }}"
          path: hotpot8-*.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    if: always()
    needs: paired
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[eval,files]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hotpot8-physical-*
          path: shards
          merge-multiple: true
      - name: Strict complete 2x2 8-question pairs or reject
        run: |
          set -euo pipefail
          python -m scripts.eval_hotpot8_v7_factorial \
            --inputs shards/hotpot8-base-*.json shards/hotpot8-adapter-*.json \
            --output hotpot8-v7-factorial-complete.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hotpot8-v7-factorial-crossfamily-complete-only
          path: hotpot8-v7-factorial-complete.json
          if-no-files-found: warn
          retention-days: 30
