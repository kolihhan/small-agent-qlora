name: Inspect Nebius original OpenHands trace structural schema (no content)
on:
  push:
    branches: [experiment/openhands-executed-long-traces-20261115]
    paths: [.github/workflows/nebius-original-structural-schema.yml, scripts/inspect_nebius_original_message_shape.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[eval]'
      - name: Inspect only original message and tool structure, no raw content
        run: python -m scripts.inspect_nebius_original_message_shape
