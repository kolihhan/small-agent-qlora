name: PRO original 2Wiki TRAIN real-tool grounded long-trajectory candidate construction
on:
  push:
    branches: [experiment/2wiki-source-conditioned-trajectories-20261115]
    paths: [.github/workflows/2wiki-source-conditioned-candidates.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install source dataset read-only and project runtime
        run: |
          python -m pip install -e '.[eval,dev]'
      - name: Verify source-anchored real-tool action sequence and refuse ungrounded teacher labels
        run: |
          python -m pytest -q tests/test_build_2wiki_source_decisions.py
      - name: Physically inspect 5000 published original TRAIN tasks and export only nonoracle observed action candidates
        run: |
          python -m scripts.build_2wiki_source_decisions --limit 5000 --output 2wiki-evidence-candidate-trajectories.jsonl --report 2wiki-evidence-training-readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 2wiki-source-grounded-action-candidates
          path: 2wiki-evidence-training-readiness.json
          2wiki-evidence-candidate-trajectories.jsonl
          retention-days: 30
          if-no-files-found: warn
