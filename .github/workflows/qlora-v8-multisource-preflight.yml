name: Qwen9B v8 protected multisource + token-safe SFT preflight (CPU only)
on:
  workflow_dispatch:
  push:
    branches: [experiment/qlora-multihop-oracle-supervision-20261115]
    paths: [.github/workflows/qlora-v8-multisource-preflight.yml]
permissions:
  contents: read
  actions: read

jobs:
  v8-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check actual native training-action and source overlap contracts
        run: |
          python -m pip install -e '.[dev,eval,files]'
          python -m pytest -q tests/test_prepare_qlora_v8_multisource.py tests/test_curate_musique_annotation_teacher.py
      - name: Download pinned original v7 full-parent Qwen9B TRAIN and independent validation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43396613861
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: qlora-v7-unique-balanced-train-validation
          path: inputs/v7
      - name: Download verified independent FinQA TRAIN16
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43591485686
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: finqa-train16-curated-observed-real
          path: inputs/finqa16
      - name: Download verified independent FinQA fresh48
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43593788698
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: finqa-fresh48-curated-strict-no-reinference
          path: inputs/finqa48
      - name: Download source-verified MuSiQue human-annotation read-to-final paths and disjoint holdout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43616220620
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: qlora-multihop-oracle-training-source-only
          path: inputs/musique
      - name: Build GAIA-protected question fingerprints privately (not stored as public artifacts)
        run: |
          python - <<'PY'
          from gaia_small_agent.benchmark.gaia100 import load_validation
          from gaia_small_agent.training.protection import build_protected_question_hashes
          protected=build_protected_question_hashes(load_validation(token=None),'inputs/gaia-protected.json')
          assert len(protected)>=100, "GAIA protection incomplete"
          print('PROTECTED_GAIA_IDENTITIES',len(protected))
          PY
      - name: Assemble all Qwen9B sources and freeze one QLoRA v8 hypothesis
        run: |
          python -m scripts.prepare_qlora_v8_multisource \
            --base inputs/v7/qlora-v7-train.jsonl \
            --base-holdout inputs/v7/qlora-v7-heldout.jsonl \
            --finqa-first16 inputs/finqa16/finqa-train16-curated.jsonl \
            --finqa-fresh48 inputs/finqa48/finqa-fresh48-curated-strict.jsonl \
            --musique inputs/musique/musique-oracle-train64.jsonl \
            --musique-holdout inputs/musique/musique-oracle-holdout24.jsonl \
            --musique-report inputs/musique/musique-oracle-source-gate.json \
            --protected inputs/gaia-protected.json \
            --output qlora-v8-train.jsonl \
            --validation qlora-v8-holdout.jsonl \
            --report qlora-v8-audit.json
      - name: Verify no truncation using original Qwen3.5-9B chat template (CPU-only)
        run: |
          python -m pip install 'transformers>=5.15,<6' 'jinja2>=3.1' 'sentencepiece>=0.2'
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from transformers import AutoTokenizer
          from gaia_small_agent.training.qlora import (
              load_verified_rows,_render_turn_examples,_tokenize_completion_examples
          )
          report=json.loads(Path('qlora-v8-audit.json').read_text())
          assert report['train_parents']==304 and report['train_actions']==798, report
          assert report['validation_parents']==35 and report['validation_actions']==176, report
          assert report['annotation_oracle_training_actions']==192
          assert report['no_gaia_training'] and 0.32<=report['train_final_action_fraction']<=0.50
          t=AutoTokenizer.from_pretrained('Qwen/Qwen3.5-9B',trust_remote_code=True)
          for path,expected in (('qlora-v8-train.jsonl',798),('qlora-v8-holdout.jsonl',176)):
              rows=load_verified_rows(path,'inputs/gaia-protected.json')
              rendered=_render_turn_examples(t,rows)
              assert len(rendered)==expected,(path,len(rendered),expected)
              tokenized=_tokenize_completion_examples(t,rendered,max_length=4096,require_full_prompt=True)
              assert len(tokenized)==expected
              print('FULL_PROMPT_4096_SAFE',path,'count',len(tokenized),
                    'max_tokens',max(len(row['input_ids']) for row in tokenized))
          report['training_ready_no_gpu_yet']=True
          report['token_context_max']=4096
          Path('qlora-v8-audit.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
      - name: Export frozen training and validation, never GAIA protected hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qlora-v8-protected-source-balanced-token-checked
          path: |
            qlora-v8-train.jsonl
            qlora-v8-holdout.jsonl
            qlora-v8-audit.json
          if-no-files-found: warn
          retention-days: 30
