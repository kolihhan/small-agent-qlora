name: QLoRA v8 TRAIN signal coverage root-cause audit (CPU, no GAIA)
on:
  push:
    branches: [research/v8-train-action-generalization-audit-20261123]
    paths: [.github/workflows/v8-train-signal-coverage-cpu.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - name: Test source integrity and aggregate-only coverage behavior
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_audit_v8_training_signal_coverage.py
      - name: Retrieve EXACT verified original 798-action v8 SFT TRAIN and 176-action HOLDOUT
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 43619541894
          name: qlora-v8-protected-source-balanced-token-checked
          github-token: ${{ github.token }}
          path: input
      - name: Verify train bytes and training source; only write aggregate counts
        run: |
          set -euo pipefail
          sha256sum input/qlora-v8-train.jsonl
          python -m scripts.audit_v8_training_signal_coverage \
            --train input/qlora-v8-train.jsonl \
            --holdout input/qlora-v8-holdout.jsonl \
            --manifest input/qlora-v8-audit.json \
            --output safe/v8-training-signal-coverage-aggregate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V8-TRAIN-SIGNAL-COVERAGE-AGGREGATE-ONLY
          path: safe/v8-training-signal-coverage-aggregate.json
          if-no-files-found: error
          retention-days: 21
