name: v3D corrective token audit

on:
  push:
    branches:
      - experiment/heldout-next-action-eval
    paths:
      - .github/workflows/v3d-token-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_MODEL: Qwen/Qwen3.5-9B
      POLICY_SEED: small-agent-policy-v3
      V3B_EXPOSURE_SEED: qlora-v3b-exposure
      V3D_EXPOSURE_SEED: qlora-v3d-corrective
      HF_HUB_DISABLE_TELEMETRY: 1
      TOKENIZERS_PARALLELISM: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip

      - name: Install tokenizer audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'transformers>=5.15,<6'

      - name: Audit frozen v3D corrective example lengths
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from collections import Counter
          from pathlib import Path

          from transformers import AutoTokenizer

          from gaia_small_agent.training.exposure_v3d import (
              select_v3d_corrective_examples,
              summarize_v3d_selection,
          )
          from gaia_small_agent.training.oracle_policy_v3 import generate_oracle_policy_v3_dataset
          from gaia_small_agent.training.qlora import (
              _render_turn_examples,
              _select_diagnostic_exposure_examples,
              load_verified_rows,
          )

          root = Path('runs/v3d-token-audit')
          root.mkdir(parents=True, exist_ok=True)
          oracle = generate_oracle_policy_v3_dataset(root / 'oracle', seed=os.environ['POLICY_SEED'])
          tokenizer = AutoTokenizer.from_pretrained(os.environ['HF_MODEL'], trust_remote_code=True)
          rows = load_verified_rows(oracle['train'])
          examples = _render_turn_examples(tokenizer, rows)

          v3b = _select_diagnostic_exposure_examples(
              examples,
              count=64,
              seed=os.environ['V3B_EXPOSURE_SEED'],
          )
          v3b_task_ids = {str(x['metadata']['task_id']) for x in v3b}
          selected = select_v3d_corrective_examples(
              examples,
              seed=os.environ['V3D_EXPOSURE_SEED'],
              exclude_task_ids=v3b_task_ids,
          )
          summary = summarize_v3d_selection(selected)

          records = []
          for order, item in enumerate(selected, 1):
              prompt_tokens = len(tokenizer(item['prompt'], add_special_tokens=False)['input_ids'])
              completion_tokens = len(tokenizer(item['completion'], add_special_tokens=False)['input_ids'])
              total_tokens = prompt_tokens + completion_tokens
              records.append({
                  'training_order': order,
                  **item['metadata'],
                  'prompt_tokens': prompt_tokens,
                  'completion_tokens': completion_tokens,
                  'total_tokens': total_tokens,
              })

          lengths = sorted(r['total_tokens'] for r in records)
          n = len(lengths)
          percentile = lambda p: lengths[min(n - 1, int((n - 1) * p))]
          buckets = {
              '<=256': sum(x <= 256 for x in lengths),
              '257-384': sum(256 < x <= 384 for x in lengths),
              '385-512': sum(384 < x <= 512 for x in lengths),
              '513-640': sum(512 < x <= 640 for x in lengths),
              '641-768': sum(640 < x <= 768 for x in lengths),
              '769-1024': sum(768 < x <= 1024 for x in lengths),
              '>1024': sum(x > 1024 for x in lengths),
          }
          action_tokens = {}
          for action in ('tool_call', 'final'):
              vals = [r['total_tokens'] for r in records if r['action_type'] == action]
              action_tokens[action] = {
                  'count': len(vals),
                  'min': min(vals),
                  'median': sorted(vals)[len(vals)//2],
                  'max': max(vals),
                  'sum': sum(vals),
              }

          audit = {
              'schema_version': 'v3d-token-audit/v1',
              'model_tokenizer': os.environ['HF_MODEL'],
              'v3b_excluded_task_count': len(v3b_task_ids),
              'v3d_selection': summary,
              'token_length_summary': {
                  'count': n,
                  'min': lengths[0],
                  'p25': percentile(0.25),
                  'median': percentile(0.50),
                  'p75': percentile(0.75),
                  'max': lengths[-1],
                  'sum': sum(lengths),
                  'mean': sum(lengths) / n,
                  'buckets': buckets,
                  'by_action_type': action_tokens,
              },
              'examples_by_training_order': records,
              'examples_shortest_first': sorted(records, key=lambda r: (r['total_tokens'], r['example_id'])),
          }
          out = root / 'token-audit.json'
          out.write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(audit['token_length_summary'], indent=2, sort_keys=True))
          print('shortest examples:')
          for r in audit['examples_shortest_first'][:8]:
              print(json.dumps(r, sort_keys=True))
          print('longest examples:')
          for r in audit['examples_shortest_first'][-8:]:
              print(json.dumps(r, sort_keys=True))
          PY

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: v3d-token-audit
          path: runs/v3d-token-audit/token-audit.json
          if-no-files-found: error
          retention-days: 14
