name: ZeroGPU held-out next-action Base vs v3B

on:
  push:
    branches:
      - experiment/heldout-next-action-eval
    paths:
      - ".github/workflows/hf-zero-gpu-next-action-v3b.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_SPACE_ID: kolihhan/small-agent-qlora-v2-train
  SOURCE_RUN_ID: "38152689194"
  SOURCE_ARTIFACT: qwen35-9b-qlora-v3b-adapter
  MODEL_ID: Qwen/Qwen3.5-9B
  SAMPLE_COUNT: "64"
  SAMPLE_SEED: heldout-v3b-next-action-v1

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify evaluator and full suite
        run: |
          python -m pip install --quiet -e '.[dev,files]'
          python -m pytest -q tests/test_next_action_eval.py
          python -m pytest -q
      - name: Verify free ZeroGPU quota
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN_NOT_CONFIGURED"; exit 42; }
          python -m pip install --quiet 'huggingface_hub>=1.0' 'gradio_client>=2,<3'
          python - <<'PY'
          import json, os
          from huggingface_hub import HfApi
          q = HfApi(token=os.environ['HF_TOKEN']).get_zero_gpu_quota()
          print(json.dumps({'remaining': q.remaining, 'resets_at': q.resets_at.isoformat() if q.resets_at else None}, indent=2))
          if q.remaining < 300:
              raise SystemExit(f'Need at least 300 free ZeroGPU seconds; remaining={q.remaining}')
          PY
      - name: Download verified PEFT v3B adapter
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Build and deploy isolated evaluator Space
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/space-src /tmp/adapter
          mkdir -p /tmp/space-src /tmp/adapter
          unzip -q source/qwen35-9b-qlora-v3b-adapter.zip -d /tmp/adapter
          test -s /tmp/adapter/adapter_model.safetensors
          cp -R src/gaia_small_agent /tmp/space-src/gaia_small_agent
          cp -R /tmp/adapter /tmp/space-src/adapter
          cat > /tmp/space-src/requirements.txt <<'EOF'
          transformers>=5.15,<6
          peft>=0.20,<1
          bitsandbytes>=0.50.1,<1
          accelerate>=1.10,<2
          requests>=2.32
          jsonschema>=4.20
          pypdf>=5
          openpyxl>=3.1
          pandas>=2.2
          mcp>=2,<3
          ddgs>=9.16,<10
          huggingface_hub>=1.0
          gradio>=6,<7
          spaces
          EOF
          cat > /tmp/space-src/README.md <<'EOF'
          ---
          title: Small Agent Heldout Next Action Eval
          emoji: 🧪
          colorFrom: gray
          colorTo: blue
          sdk: gradio
          sdk_version: 6.0.1
          app_file: app.py
          pinned: false
          private: true
          hardware: zero-a10g
          ---
          Temporary private evaluator for held-out next-action Base vs v3B diagnostics.
          EOF
          cat > /tmp/space-src/app.py <<'PYAPP'
          from __future__ import annotations
          import gc, json, os, tempfile, time
          from pathlib import Path
          import gradio as gr
          import spaces
          import torch
          from huggingface_hub import snapshot_download
          from transformers import AutoTokenizer
          from gaia_small_agent.model.transformers_qwen import TransformersQwenModel
          from gaia_small_agent.training.next_action_eval import evaluate_next_actions
          from gaia_small_agent.training.oracle_policy_v3 import generate_oracle_policy_v3_dataset
          from gaia_small_agent.training.qlora import _render_turn_examples, _select_diagnostic_exposure_examples

          MODEL_ID = os.environ.get('MODEL_ID', 'Qwen/Qwen3.5-9B')
          SAMPLE_COUNT = int(os.environ.get('SAMPLE_COUNT', '64'))
          SAMPLE_SEED = os.environ.get('SAMPLE_SEED', 'heldout-v3b-next-action-v1')
          MODEL_PATH = snapshot_download(repo_id=MODEL_ID, token=os.environ.get('HF_TOKEN') or None)
          ADAPTER = '/home/user/app/adapter'

          def _release(model):
              del model
              gc.collect()
              if torch.cuda.is_available():
                  torch.cuda.empty_cache()

          @spaces.GPU(duration=300)
          def evaluate_pair():
              root = Path(tempfile.mkdtemp(prefix='heldout-next-action-'))
              paths = generate_oracle_policy_v3_dataset(root / 'oracle', seed='small-agent-policy-v3')
              tokenizer = AutoTokenizer.from_pretrained(MODEL_PATH, trust_remote_code=True)
              rows = [json.loads(line) for line in paths['test'].read_text(encoding='utf-8').splitlines() if line.strip()]
              turns = _render_turn_examples(tokenizer, rows)
              selected = _select_diagnostic_exposure_examples(turns, count=SAMPLE_COUNT, seed=SAMPLE_SEED)
              example_ids = {str(item['metadata']['example_id']) for item in selected}
              selected_meta = {
                  'sample_count': len(example_ids),
                  'seed': SAMPLE_SEED,
                  'capabilities': {},
                  'action_types': {},
              }
              for item in selected:
                  meta = item['metadata']
                  selected_meta['capabilities'][meta['capability']] = selected_meta['capabilities'].get(meta['capability'], 0) + 1
                  selected_meta['action_types'][meta['action_type']] = selected_meta['action_types'].get(meta['action_type'], 0) + 1

              started = time.time()
              base = TransformersQwenModel(model_name=MODEL_PATH, quantize_4bit=True, adapter=None, enable_thinking=False, max_new_tokens=128)
              base_summary = evaluate_next_actions(paths['test'], lambda: base, example_ids=example_ids)
              base_seconds = time.time() - started
              _release(base)

              tuned_start = time.time()
              tuned = TransformersQwenModel(model_name=MODEL_PATH, quantize_4bit=True, adapter=ADAPTER, enable_thinking=False, max_new_tokens=128)
              tuned_summary = evaluate_next_actions(paths['test'], lambda: tuned, example_ids=example_ids)
              tuned_seconds = time.time() - tuned_start
              _release(tuned)

              base_examples = {x['example_id']: x for x in base_summary['examples']}
              tuned_examples = {x['example_id']: x for x in tuned_summary['examples']}
              ids = sorted(example_ids)
              wrong_to_correct = sum((not base_examples[i]['correct']) and tuned_examples[i]['correct'] for i in ids)
              correct_to_wrong = sum(base_examples[i]['correct'] and (not tuned_examples[i]['correct']) for i in ids)
              return {
                  'schema_version': 'heldout-next-action-v3b/v1',
                  'model': MODEL_ID,
                  'inference_stack': 'Transformers NF4 + PEFT',
                  'thinking': False,
                  'max_new_tokens': 128,
                  'selection': selected_meta,
                  'base': base_summary,
                  'v3b': tuned_summary,
                  'paired': {'wrong_to_correct': wrong_to_correct, 'correct_to_wrong': correct_to_wrong, 'net_correct_change': wrong_to_correct - correct_to_wrong},
                  'timing_seconds': {'base': base_seconds, 'v3b': tuned_seconds},
              }

          with gr.Blocks() as demo:
              run = gr.Button('evaluate')
              out = gr.JSON()
              run.click(evaluate_pair, inputs=[], outputs=out, api_name='evaluate_pair')
          if __name__ == '__main__':
              demo.launch(show_error=True)
          PYAPP
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, SpaceHardware
          api = HfApi(token=os.environ['HF_TOKEN'])
          rid = os.environ['HF_SPACE_ID']
          api.upload_folder(folder_path='/tmp/space-src', repo_id=rid, repo_type='space', delete_patterns=['*.py','requirements.txt','gaia_small_agent/**','adapter/**'], commit_message='heldout next-action v3B evaluator')
          api.add_space_secret(repo_id=rid, key='HF_TOKEN', value=os.environ['HF_TOKEN'])
          for key in ('MODEL_ID','SAMPLE_COUNT','SAMPLE_SEED'):
              api.add_space_variable(repo_id=rid, key=key, value=os.environ[key])
          api.request_space_hardware(repo_id=rid, hardware=SpaceHardware.ZERO_A10G)
          try: api.restart_space(repo_id=rid)
          except Exception as exc: print('restart', exc)
          PY
      - name: Run paired held-out evaluation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from huggingface_hub import HfApi
          from gradio_client import Client
          rid = os.environ['HF_SPACE_ID']
          api = HfApi(token=os.environ['HF_TOKEN'])
          print(api.wait_for_space(repo_id=rid, timeout=1800))
          deadline = time.time() + 900
          last = None
          while time.time() < deadline:
              try:
                  client = Client(rid, token=os.environ['HF_TOKEN'], verbose=False)
                  client.view_api(print_info=False)
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(10)
          else:
              raise SystemExit(f'API not ready: {last}')
          result = client.predict(api_name='/evaluate_pair')
          with open('heldout-next-action-v3b.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, indent=2, sort_keys=True)
              f.write('\n')
          print(json.dumps({
              'selection': result['selection'],
              'base': {k: result['base'][k] for k in ('total','correct','accuracy','error_counts','by_capability','by_action_type')},
              'v3b': {k: result['v3b'][k] for k in ('total','correct','accuracy','error_counts','by_capability','by_action_type')},
              'paired': result['paired'],
              'timing_seconds': result['timing_seconds'],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: heldout-next-action-v3b
          path: heldout-next-action-v3b.json
          if-no-files-found: error
          retention-days: 30
