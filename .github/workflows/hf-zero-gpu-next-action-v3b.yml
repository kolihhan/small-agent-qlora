name: GitHub CPU held-out next-action recovery 0-6 thinking256

on:
  push:
    branches:
      - experiment/heldout-next-action-eval
    paths:
      - ".github/workflows/hf-zero-gpu-next-action-v3b.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "38156235327"
  SOURCE_ARTIFACT: qwen35-9b-qlora-v3b-gguf
  ADAPTER_SHA256: e7caec609a905d21e056b107519d78916d3ef79e7bdc70db916e40d801d2187d
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA256: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_RELEASE_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_RELEASE_SHA256: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  MODEL_ALIAS: qwen3.5-9b
  SAMPLE_COUNT: "64"
  SAMPLE_SEED: heldout-v3b-next-action-v1
  SHARD_COUNT: "8"

jobs:
  paired-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 6]
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused evaluation dependencies
        run: python -m pip install --quiet -e '.[dev]'

      - name: Verify next-action evaluator
        run: python -m pytest -q tests/test_next_action_eval.py tests/test_oracle_policy_v3.py tests/test_training_exposure_v3b.py

      - name: Freeze deterministic held-out shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p runs/oracle runs/selection
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          from gaia_small_agent.training.oracle_policy_v3 import generate_oracle_policy_v3_dataset
          from gaia_small_agent.training.qlora import _render_turn_examples, _select_diagnostic_exposure_examples

          class NativeShapeTokenizer:
              def apply_chat_template(self, messages, **kwargs):
                  def dump(value):
                      return json.dumps(value, sort_keys=True, separators=(",", ":"))
                  if kwargs.get("add_generation_prompt"):
                      return dump(messages) + "<assistant>"
                  if messages and messages[-1].get("role") == "assistant":
                      return dump(messages[:-1]) + "<assistant>" + dump(messages[-1])
                  return dump(messages)

          paths = generate_oracle_policy_v3_dataset(Path("runs/oracle"), seed="small-agent-policy-v3")
          rows = [json.loads(line) for line in paths["test"].read_text(encoding="utf-8").splitlines() if line.strip()]
          turns = _render_turn_examples(NativeShapeTokenizer(), rows)
          selected = _select_diagnostic_exposure_examples(
              turns,
              count=int(os.environ["SAMPLE_COUNT"]),
              seed=os.environ["SAMPLE_SEED"],
          )
          selected_ids = [str(item["metadata"]["example_id"]) for item in selected]
          if len(selected_ids) != len(set(selected_ids)):
              raise SystemExit("selected held-out example IDs are not unique")
          shard_index = int(os.environ["SHARD_INDEX"])
          shard_count = int(os.environ["SHARD_COUNT"])
          shard_ids = selected_ids[shard_index::shard_count]
          selected_meta = {
              "sample_count": len(selected_ids),
              "seed": os.environ["SAMPLE_SEED"],
              "capabilities": dict(Counter(str(item["metadata"]["capability"]) for item in selected)),
              "action_types": dict(Counter(str(item["metadata"]["action_type"]) for item in selected)),
              "shard_index": shard_index,
              "shard_count": shard_count,
              "shard_size": len(shard_ids),
              "example_ids": shard_ids,
          }
          Path("runs/selection/selected.json").write_text(json.dumps(selected_meta, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({k: v for k, v in selected_meta.items() if k != "example_ids"}, indent=2, sort_keys=True))
          PY

      - name: Download and verify frozen Base 9B and llama.cpp robustly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model /tmp/llama-bin matched-input
          touch model/Qwen3.5-9B-Q4_K_M.gguf
          ok=0
          for attempt in {1..12}; do
            echo "model download attempt $attempt"
            if curl --http1.1 -fL --retry 3 --retry-all-errors --retry-delay 2 -C - "$MODEL_URL" -o model/Qwen3.5-9B-Q4_K_M.gguf; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1
          echo "$MODEL_SHA256  model/Qwen3.5-9B-Q4_K_M.gguf" | sha256sum -c -
          curl --http1.1 -fL --retry 10 --retry-all-errors --retry-delay 2 "$LLAMA_RELEASE_URL" -o /tmp/llama.tar.gz
          echo "$LLAMA_RELEASE_SHA256  /tmp/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama-bin
          SERVER="$(find /tmp/llama-bin -type f -name llama-server -perm -111 | head -1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"

      - name: Download frozen v3B GGUF adapter
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: matched-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify adapter checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s matched-input/qwen35-9b-qlora-v3b-adapter.gguf
          echo "$ADAPTER_SHA256  matched-input/qwen35-9b-qlora-v3b-adapter.gguf" | sha256sum -c -

      - name: Run matched Base then v3B with thinking budget 256
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          shard="$SHARD_INDEX"
          mkdir -p "runs/results/shard-$shard"
          run_arm() {
            arm="$1"
            extra=()
            if [ "$arm" = "v3b" ]; then
              extra=(--lora matched-input/qwen35-9b-qlora-v3b-adapter.gguf)
            fi
            "$LLAMA_SERVER" \
              -m model/Qwen3.5-9B-Q4_K_M.gguf \
              "${extra[@]}" \
              --alias "$MODEL_ALIAS" \
              --host 127.0.0.1 --port 8080 \
              --ctx-size 16384 --threads 4 --parallel 1 \
              --jinja --reasoning on --reasoning-format deepseek --reasoning-budget 256 --temperature 0 \
              > "runs/results/shard-$shard/${arm}-server.log" 2>&1 &
            pid=$!
            cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
            trap cleanup RETURN
            for i in {1..180}; do
              if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:8080/health >/dev/null
            ARM="$arm" python - <<'PY'
          import json, os
          from pathlib import Path
          from gaia_small_agent.model.openai_compat import OpenAICompatModel
          from gaia_small_agent.training.next_action_eval import evaluate_next_actions

          selection = json.loads(Path("runs/selection/selected.json").read_text(encoding="utf-8"))
          model = OpenAICompatModel(
              model=os.environ["MODEL_ALIAS"],
              base_url="http://127.0.0.1:8080",
              timeout_s=240.0,
              max_new_tokens=512,
          )
          summary = evaluate_next_actions(
              "runs/oracle/test.jsonl",
              lambda: model,
              example_ids=set(selection["example_ids"]),
          )
          payload = {
              "schema_version": "heldout-next-action-shard/v1",
              "arm": os.environ["ARM"],
              "inference_stack": "llama.cpp + Qwen3.5-9B Q4_K_M + optional GGUF LoRA",
              "thinking": True,
              "reasoning_budget": 256,
              "max_new_tokens": 512,
              "selection": selection,
              "summary": summary,
          }
          out = Path(f"runs/results/shard-{selection['shard_index']}/{os.environ['ARM']}.json")
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"arm": os.environ["ARM"], "shard": selection["shard_index"], "correct": summary["correct"], "total": summary["total"], "accuracy": summary["accuracy"], "errors": summary["error_counts"]}, indent=2, sort_keys=True))
          PY
            cleanup
            trap - RETURN
            sleep 2
          }
          run_arm base
          run_arm v3b

      - name: Upload recovery shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: heldout-next-action-thinking256-shard-${{ matrix.shard }}
          path: |
            runs/results/shard-${{ matrix.shard }}/base.json
            runs/results/shard-${{ matrix.shard }}/v3b.json
            runs/selection/selected.json
          if-no-files-found: error
          retention-days: 30
