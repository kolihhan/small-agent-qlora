name: Original QLoRA v8 TRAIN depth vs GAIA100 CPU audit
on:
  push:
    branches: [research/agent-protocol-recovery-v1-20261122]
    paths:
      - scripts/audit_v8_train_gaia_depth_gap.py
      - tests/test_v8_train_gaia_depth_gap.py
      - .github/workflows/v8-train-gaia-depth-cpu.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -q -e '.[dev]'
          python -m pytest -q tests/test_v8_train_gaia_depth_gap.py
      - uses: actions/download-artifact@v4
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 43619541894
          github-token: ${{ github.token }}
          name: qlora-v8-protected-source-balanced-token-checked
          path: .train
      - uses: actions/download-artifact@v4
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 44980055775
          github-token: ${{ github.token }}
          pattern: gaia-v8-paired-shard-*
          path: .gaia
      - name: Replay original frozen data, report aggregates only
        run: |
          python scripts/audit_v8_train_gaia_depth_gap.py \
            --train .train/qlora-v8-train.jsonl \
            --gaia-root .gaia \
            --output .safe-report/v8-train-gaia-depth.json
      - uses: actions/upload-artifact@v4
        with:
          name: v8-train-gaia-depth-aggregates-only
          path: .safe-report/v8-train-gaia-depth.json
          if-no-files-found: error
          retention-days: 14
