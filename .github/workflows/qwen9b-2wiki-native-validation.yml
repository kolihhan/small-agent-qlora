name: Qwen9B native local search/read 2Wiki VALIDATION source-disjoint baseline

on:
  push:
    branches: [experiment/2wiki-nonoracle-search-read-paths-20261115]
    paths: [.github/workflows/qwen9b-2wiki-native-validation.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[eval,dev]'
      - name: Assert local search non-oracle and freeze independent published VALIDATION source
        run: |
          python -m pytest -q tests/test_eval_2wiki_native_agent.py tests/test_audit_2wiki_search_read_paths.py
          python -m scripts.eval_2wiki_native_agent --split validation --output 2wiki-validation-frozen.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 2wiki-validation-source-frozen
          path: 2wiki-validation-frozen.json
          if-no-files-found: error

  paired:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: 2wiki-validation-source-frozen
      - name: Run original Qwen with CPU Ollama
        run: |
          curl -fsSL --retry 3 'https://ollama.com/download/ollama-linux-amd64.tar.zst' | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/2wiki-ollama.log" 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Execute two original Qwen9B native search/read episodes
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m scripts.eval_2wiki_native_agent --cohort 2wiki-validation-frozen.json --shard "$SHARD" --output "2wiki-native-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 2wiki-native-${{ matrix.shard }}
          path: 2wiki-native-*.json
          if-no-files-found: error

  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 2wiki-native-*
          path: shards
          merge-multiple: true
      - run: python -m scripts.eval_2wiki_native_agent --inputs shards/2wiki-native-*.json --output 2wiki-qwen9b-native-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 2wiki-qwen9b-native-final
          path: 2wiki-qwen9b-native-final.json
          if-no-files-found: error
