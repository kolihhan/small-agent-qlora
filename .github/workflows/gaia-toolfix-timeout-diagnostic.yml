name: GAIA ToolFix paired timeout diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - qlora/gaia-9b-v2
    paths:
      - ".github/workflows/gaia-toolfix-timeout-diagnostic.yml"

permissions:
  contents: read
  actions: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  FROZEN_EVAL_COMMIT: "2fd2369a3b409fbeb14e023283ab4281fc6f14a7"
  TARGET_TASK_ID: "3f57289b-8c60-48be-bd80-01f8099ca449"
  DATASET_REVISION: "682dd723ee1e1697e00360edccf2366dc8418dd9"
  PROTOCOL_SEED: "gaia-local-v2"
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA256: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_RELEASE_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_RELEASE_SHA256: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  MODEL_ALIAS: qwen3.5-9b
  ADAPTER_RUN_ID: "38156235327"
  ADAPTER_ARTIFACT: qwen35-9b-qlora-v3b-gguf
  ADAPTER_SHA256: e7caec609a905d21e056b107519d78916d3ef79e7bdc70db916e40d801d2187d

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arm: [base, qlora-v3b]
    steps:
      - name: Checkout frozen ToolFix evaluator
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_EVAL_COMMIT }}

      - name: Install frozen evaluation dependencies
        run: python -m pip install --quiet -e '.[search,files,eval]'

      - name: Verify GAIA credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_TOKEN_NOT_CONFIGURED"; exit 42; }

      - name: Download and verify frozen base GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -fL --retry 5 --retry-delay 3 "$MODEL_URL" -o model/Qwen3.5-9B-Q4_K_M.gguf
          echo "$MODEL_SHA256  model/Qwen3.5-9B-Q4_K_M.gguf" | sha256sum -c -

      - name: Download and verify llama-server
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 "$LLAMA_RELEASE_URL" -o /tmp/llama.tar.gz
          echo "$LLAMA_RELEASE_SHA256  /tmp/llama.tar.gz" | sha256sum -c -
          mkdir -p /tmp/llama-bin
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama-bin
          SERVER="$(find /tmp/llama-bin -type f -name llama-server -perm -111 | head -1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"

      - name: Download frozen v3B adapter
        if: matrix.arm == 'qlora-v3b'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ADAPTER_ARTIFACT }}
          path: matched-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ADAPTER_RUN_ID }}

      - name: Verify frozen adapter
        if: matrix.arm == 'qlora-v3b'
        shell: bash
        run: |
          set -euo pipefail
          test -s matched-input/qwen35-9b-qlora-v3b-adapter.gguf
          echo "$ADAPTER_SHA256  matched-input/qwen35-9b-qlora-v3b-adapter.gguf" | sha256sum -c -

      - name: Start matched llama-server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "runs/timeout-diagnostic/${{ matrix.arm }}"
          EXTRA=()
          if [[ "${{ matrix.arm }}" == "qlora-v3b" ]]; then
            EXTRA=(--lora matched-input/qwen35-9b-qlora-v3b-adapter.gguf)
          fi
          "$LLAMA_SERVER" \
            -m model/Qwen3.5-9B-Q4_K_M.gguf \
            "${EXTRA[@]}" \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 16384 --threads 4 --parallel 1 \
            --jinja --reasoning-budget 0 --temperature 0 \
            > "runs/timeout-diagnostic/${{ matrix.arm }}/llama-server.log" 2>&1 &
          echo $! > "runs/timeout-diagnostic/${{ matrix.arm }}/llama-server.pid"
          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -200 "runs/timeout-diagnostic/${{ matrix.arm }}/llama-server.log" >&2
          exit 1

      - name: Run exact case with 600s model timeout
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from gaia_small_agent.agent.loop import AgentRuntime, MAX_TOOL_OBSERVATION_CHARS
          from gaia_small_agent.benchmark.gaia100 import GAIA_REVISION, LOCAL_PROTOCOL_SEED, load_validation, select_gaia_partition
          import gaia_small_agent.benchmark.runner as gaia_runner
          from gaia_small_agent.model.openai_compat import OpenAICompatModel
          from gaia_small_agent.tools import default_tools

          target = os.environ["TARGET_TASK_ID"]
          arm = os.environ["ARM"]
          dataset = load_validation("gaia-benchmark/GAIA", token=os.environ["HF_TOKEN"], revision=GAIA_REVISION)
          full = select_gaia_partition(dataset, partition="evaluation", seed=LOCAL_PROTOCOL_SEED)
          selected = [row for row in full if str(row["task_id"]) == target]
          if len(selected) != 1:
              raise SystemExit(f"expected exact target once, got {len(selected)}")

          def factory():
              return AgentRuntime(
                  OpenAICompatModel(
                      model=os.environ["MODEL_ALIAS"],
                      base_url="http://127.0.0.1:8080",
                      timeout_s=600.0,
                      max_new_tokens=512,
                  ),
                  default_tools(),
                  max_steps=12,
              )

          root = Path("runs/timeout-diagnostic") / arm / "eval"
          run_config = {
              "schema_version": "toolfix-timeout-diagnostic/v1",
              "arm": arm,
              "target_task_id": target,
              "model_timeout_s": 600.0,
              "frozen_eval_commit": os.environ["FROZEN_EVAL_COMMIT"],
              "backend": "openai_compat",
              "model": os.environ["MODEL_ALIAS"],
              "max_steps": 12,
              "max_new_tokens": 512,
              "thinking": False,
              "context_size": 16384,
              "tool_observation_max_chars": MAX_TOOL_OBSERVATION_CHARS,
              "dataset_revision": GAIA_REVISION,
              "seed": LOCAL_PROTOCOL_SEED,
          }
          original = gaia_runner.select_gaia_partition
          gaia_runner.select_gaia_partition = lambda rows, partition, seed: list(selected)
          try:
              summary = gaia_runner.run_gaia100(
                  dataset,
                  factory,
                  root,
                  seed=LOCAL_PROTOCOL_SEED,
                  dataset_revision=GAIA_REVISION,
                  run_config=run_config,
                  partition="evaluation",
              )
          finally:
              gaia_runner.select_gaia_partition = original

          row = json.loads((root / "results.jsonl").read_text(encoding="utf-8").strip())
          payload = {
              "arm": arm,
              "target_task_id": target,
              "model_timeout_s": 600.0,
              "correct": row["correct"],
              "completed": row["completed"],
              "stop_reason": row["stop_reason"],
              "steps": row["steps"],
              "tool_calls": row["tool_calls"],
              "tool_successes": row["tool_successes"],
              "tool_errors": row["tool_errors"],
              "duplicate_calls_blocked": row["duplicate_calls_blocked"],
              "latency_ms": row["latency_ms"],
              "model_answer": row["model_answer"],
              "trace": row["trace"],
              "summary": summary,
          }
          (Path("runs/timeout-diagnostic") / arm / "case.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({k: payload[k] for k in ("arm", "correct", "completed", "stop_reason", "steps", "tool_calls", "tool_errors", "latency_ms")}, indent=2))
          PY

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f "runs/timeout-diagnostic/${{ matrix.arm }}/llama-server.pid" ]; then
            kill "$(cat "runs/timeout-diagnostic/${{ matrix.arm }}/llama-server.pid")" || true
          fi

      - name: Upload arm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeout-diagnostic-${{ matrix.arm }}
          path: runs/timeout-diagnostic/${{ matrix.arm }}
          if-no-files-found: error
          retention-days: 14

  summarize:
    needs: diagnostic
    if: always() && needs.diagnostic.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download paired evidence
        uses: actions/download-artifact@v4
        with:
          pattern: timeout-diagnostic-*
          path: evidence

      - name: Build paired comparison
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cases = {}
          for p in Path("evidence").glob("**/case.json"):
              data = json.loads(p.read_text(encoding="utf-8"))
              cases[data["arm"]] = data
          if set(cases) != {"base", "qlora-v3b"}:
              raise SystemExit(f"missing paired arms: {sorted(cases)}")
          compact = {
              arm: {k: data[k] for k in (
                  "correct", "completed", "stop_reason", "steps", "tool_calls",
                  "tool_successes", "tool_errors", "duplicate_calls_blocked", "latency_ms", "model_answer"
              )}
              for arm, data in cases.items()
          }
          payload = {
              "schema_version": "toolfix-timeout-diagnostic/v1",
              "target_task_id": next(iter(cases.values()))["target_task_id"],
              "model_timeout_s": 600.0,
              "arms": compact,
          }
          Path("timeout-diagnostic-comparison.json").write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          PY

      - name: Upload paired comparison
        uses: actions/upload-artifact@v4
        with:
          name: timeout-diagnostic-comparison
          path: timeout-diagnostic-comparison.json
          if-no-files-found: error
          retention-days: 14
