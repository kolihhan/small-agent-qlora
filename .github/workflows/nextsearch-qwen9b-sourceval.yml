name: PRO pinned NextSearch independent VAL Qwen9B original source web tools baseline
on:
  push:
    branches: [experiment/nextsearch-gold-grounded-search-traces-20261115]
    paths: [.github/workflows/nextsearch-qwen9b-sourceval.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Source-only tool schema and task-disjoint cohort tests
        run: |
          python -m pip install -e '.[eval,search,dev]'
          python -m pytest -q tests/test_audit_nextsearch_apache_source.py tests/test_nextsearch_source_tools.py tests/test_eval_nextsearch_qwen_source_val.py
      - name: Freeze eight untrained task-disjoint Apache VAL questions and SHA
        env:
          HF_STREAM_SAFE_EXIT: '1'
        run: |
          python -m scripts.eval_nextsearch_qwen_source_val --output nextsearch-qwen9b-heldout-val-frozen.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nextsearch-pinned-independent-val-cohort
          path: nextsearch-qwen9b-heldout-val-frozen.json
          if-no-files-found: error

  shards:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[search]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nextsearch-pinned-independent-val-cohort
      - name: Start checksum-pinned original Qwen9B via free GitHub CPU
        run: |
          curl -fsSL --retry 3 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Genuine Qwen9B source-compatible live Search/Fetch episodes
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m scripts.eval_nextsearch_qwen_source_val \
            --cohort nextsearch-qwen9b-heldout-val-frozen.json \
            --shard "$SHARD" --output "nextsearch-qwen-val-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nextsearch-val-qwen-shard-${{ matrix.shard }}
          path: nextsearch-qwen-val-shard-*.json
          if-no-files-found: warn

  aggregate:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nextsearch-val-qwen-shard-*
          merge-multiple: true
          path: shards
      - name: Strict exact and tool recovery aggregate
        run: |
          python -m scripts.eval_nextsearch_qwen_source_val \
            --inputs shards/nextsearch-qwen-val-shard-0.json \
                     shards/nextsearch-qwen-val-shard-1.json \
                     shards/nextsearch-qwen-val-shard-2.json \
                     shards/nextsearch-qwen-val-shard-3.json \
            --output nextsearch-qwen9b-sourceval-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nextsearch-qwen9b-sourceval-full-native-baseline
          path: nextsearch-qwen9b-sourceval-final.json
          if-no-files-found: error
