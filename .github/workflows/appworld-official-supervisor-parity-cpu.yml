name: AppWorld TRAIN8 Supervisor parity READ-ONLY private response contract CPU (NO QWEN)
# Corrected source-only counts + 2k model-visible docs budget and scene-profile deduplication.
# Fail-closed source and prefix tests corrected in head commit; do not count an incomplete workflow.
on:
  push:
    branches: [research/appworld-official-supervisor-parity-cpu-20261120]
    paths: [.github/workflows/appworld-official-supervisor-parity-cpu.yml]
permissions:
  contents: read
  actions: read

jobs:
  train_source_lock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Contract tests no AppWorld protected content
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_appworld_tool_bridge.py tests/test_appworld_supervisor_credential_capability.py tests/test_appworld_official_supervisor_parity.py tests/test_appworld_official_supervisor_parity_private_response_cpu.py
      - name: Install pinned upstream AppWorld and freeze TRAIN8 source IDs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs
          git lfs install
          mkdir -p "$RUNNER_TEMP/appworld"
          cd "$RUNNER_TEMP/appworld"
          git init -q
          git remote add origin https://github.com/StonyBrookNLP/appworld.git
          git fetch -q --depth 1 origin 42b5bcf3cd334fee33f0c37c02070a9f5807add5
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "42b5bcf3cd334fee33f0c37c02070a9f5807add5"
          git lfs pull
          python -m pip install -e .
          python -m pip install 'pydantic==2.12.5' 'fastapi==0.120.4'
          appworld install --repo
          appworld download data
          export APPWORLD_ROOT="$RUNNER_TEMP/appworld"
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import json
          from scripts.appworld_train_first_feedback_fork import task_roster,digest
          from appworld import load_task_ids
          picked=task_roster()
          assert len(picked)==8 and len({s.split('_',1)[0] for s in picked})==8
          print('APPWORLD_TRAIN_FIXED_8_SCENES_SOURCE_HASH_ONLY',digest(picked),
                'task_count_total',len(load_task_ids('train')))
          PY

      - name: CPU-only eight-scene opt-in public Supervisor parity check, NO LOGIN
        shell: bash
        run: |
          set -euo pipefail
          export APPWORLD_ROOT="$RUNNER_TEMP/appworld"
          cd "$GITHUB_WORKSPACE"
          python -m scripts.appworld_train_official_supervisor_parity_cpu --out parity-sourceonly.json
          python - <<'PY'
          import json
          d=json.load(open('parity-sourceonly.json'))
          assert d['source_scenes']==8 and d['no_Qwen_or_login_or_real_credentials']
          assert d['parity_default_off'] and d['no_task_specific_instruction_or_values_exported']
          assert d['distinct_safe_public_contract_count_profiles']==1
          assert all(r['safe']['official_lookup_APIs_accessible_in_parity_count']==2
                     and r['safe']['official_lookup_APIs_accessible_in_default_count']==0
                     and r['safe']['original_Supervisor_completion_preserved']
                     and r['safe']['all_other_supervisor_public_APIs_denied']
                     and r['safe']['no_real_credential_lookup_or_login_executed']
                     and len(r['safe']['contract_checks_only'])==2
                     and all(c['model_can_discover_by_listing']
                             and c['model_can_read_public_parameter_contract']
                             and c['api_name_survives_2000_char_tool_budget']
                             and c['public_response_schema_documented']
                             and c['model_can_read_public_success_response_shape_in_2000_chars']
                             and c['public_response_examples_values_not_delivered']
                             for c in r['safe']['contract_checks_only'])
                     for r in d['source_only_safe_rows'])
          print('OFF_VS_ON_PARITY_SOURCE_ONLY',len(d['source_only_safe_rows']),
                'parity_enabled_two_lookups',True, 'model_loaded',False)
          PY
      - name: Protected simulator read-only Supervisor response contract and privacy check (NO LOGIN)
        shell: bash
        run: |
          set -euo pipefail
          export APPWORLD_ROOT="$RUNNER_TEMP/appworld"
          cd "$GITHUB_WORKSPACE"
          python -m scripts.appworld_official_supervisor_parity_private_response_cpu \
            --out supervisor-protected-response-contract-safe.json
          python - <<'PY'
          import json
          d=json.load(open("supervisor-protected-response-contract-safe.json"))
          assert d["source_scenes"]==8 and d["no_Qwen_calls"]
          assert d["all_lookups_success"] and d["no_task_or_credentials_or_hashes_exported"]
          assert all(r["safe"]["official_lookup_read_only_calls"]==2
                     and r["safe"]["no_app_login_or_supervisor_write_calls"]
                     and r["safe"]["no_raw_responses_tasks_account_data_secrets_or_hashes_exported"]
                     and all(x["raw_response_is_JSON_object_or_array"]
                             and x["top_level_matches_official_public_example_shape"]
                             and x["overlapping_official_public_fields_have_compatible_types"]
                             and x["public_response_shape_matches_docs_projection"]
                             for x in r["safe"]["private_response_contract_only"])
                     for r in d["safe_scenes"])
          print("PROTECTED_READ_ONLY_SUPERVISOR_RESPONSE_CONTRACT_TWO_APIS_PER_SCENE", 8)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: APPWORLD-TRAIN8-OFFICIAL-SUPERVISOR-PRIVATE-LOOKUP-RESPONSE-SHAPE-ONLY
          path: supervisor-protected-response-contract-safe.json
          if-no-files-found: error
          retention-days: 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: APPWORLD-TRAIN8-OFFICIAL-SUPERVISOR-PARITY-CONTROLS-CPU-NO-QWEN
          path: parity-sourceonly.json
          if-no-files-found: error
          retention-days: 60
