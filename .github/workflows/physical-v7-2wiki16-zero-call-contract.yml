name: Original v7 NEW 2Wiki16 zero-call output contract
on:
  push:
    branches: [research/verified-prefix-fork-20261119]
    paths:
      - .github/workflows/physical-v7-2wiki16-zero-call-contract.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_SHA: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  V7_SHA: 475f5fb59a553390a0dde9425d36b42ff85a0345bdd31b8465c22fd4d2bc02e2
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -e '.[eval,files,dev]'
          python -m pytest -q tests/test_eval_2wiki16_v7_zero_call_answer_contract.py
          python -m compileall -q scripts/eval_2wiki16_v7_zero_call_answer_contract.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 43712873154, github-token: "${{ github.token }}", name: 2wiki-original-source-cohort-frozen, path: old-linked}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 43862358318, github-token: "${{ github.token }}", name: source-2wiki-body8, path: old-novel}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44016763563, github-token: "${{ github.token }}", name: qwen9b-2wiki16-serializer-new-source-locked, path: old16}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44022276727, github-token: "${{ github.token }}", name: qwen9b-2wiki48-serializer-new-source-locked, path: old48}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44034337935, github-token: "${{ github.token }}", name: qwen9b-v7-factorial-new8-source-frozen, path: old8}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44477751745, github-token: "${{ github.token }}", name: v7-2wiki16-blind-source, path: prior-72-last16}
      - name: Freeze new questions 73-88 in same rank order, exclude previous 40 plus 72 and all support paths
        run: |
          set -euo pipefail
          python -m scripts.eval_2wiki16_v7_zero_call_answer_contract freeze \
            --prior-linked old-linked/2wiki-linked-frozen.json \
            --prior-novel old-novel/frozen.json \
            --prior16 old16/2wiki16-serializer-source-frozen.json \
            --prior48 old48/2wiki48-serializer-source-frozen.json \
            --prior8 old8/factorial-new8-source-frozen.json \
            --prior-blind prior-72-last16/blind.json \
            --out blind.json --labels reference.json
          python - <<'PY'
          import json
          src=json.load(open('blind.json')); refs=json.load(open('reference.json'))
          assert src['n']==16 and src['previous_72_and_original_40_excluded']
          assert len({r['id'] for r in src['cases']})==16
          assert src['source_sha']==refs['source_sha']
          assert all('answer' not in r and 'support' not in r for r in src['cases'])
          print('NEW16_ZERO_CALL_BLIND_SOURCE_FROZEN',src['source_sha'],flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: v7-next16-output-contract-blind, path: blind.json, if-no-files-found: error, retention-days: 30}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: v7-next16-output-contract-reference-NOT-for-model, path: reference.json, if-no-files-found: error, retention-days: 30}
  physical:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {shard: [0,1,2,3]}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[eval,files]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: v7-next16-output-contract-blind, path: blind}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 43434228699, github-token: "${{ github.token }}", name: qlora-v7-converted-f16-gguf, path: adapter}
      - name: Verify original base and pre-existing v7 GGUF exact SHA
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 "$MODEL_URL" -o base.gguf
          curl -fsSL --retry 5 "$LLAMA_URL" -o llama.tar.gz
          echo "$MODEL_SHA  base.gguf" | sha256sum -c -
          echo "$LLAMA_SHA  llama.tar.gz" | sha256sum -c -
          echo "$V7_SHA  adapter/qlora-v7-adapter-f16.gguf" | sha256sum -c -
          mkdir llama
          tar -xzf llama.tar.gz -C llama
          server=$(find "$PWD/llama" -type f -name llama-server -print -quit)
          test -x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
      - name: Physical same original v7 agent inference once per task, no publisher labels
        env: {SHARD: "${{ matrix.shard }}"}
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" -m base.gguf --lora adapter/qlora-v7-adapter-f16.gguf \
            --alias qwen3.5-9b --host 127.0.0.1 --port 8080 \
            --ctx-size 16384 --threads 4 --parallel 1 --jinja --reasoning-budget 0 \
            --temperature 0 > "$RUNNER_TEMP/llama.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..180}; do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/health >/dev/null
          python -m scripts.eval_2wiki16_v7_zero_call_answer_contract infer \
            --blind blind/blind.json --shard "$SHARD" --work "work-$SHARD" \
            --out "pred-$SHARD.json"
          python - <<'PY'
          import glob,json
          f=glob.glob('pred-*.json'); assert len(f)==1
          r=json.load(open(f[0]));assert r['n']==4 and r['no_reference_loaded']
          assert r['status']=='ORIGINAL_V7_PREDICTIONS_SEALED'
          print('SEALED_QWEN9B_SINGLE_RUN_ORIGINAL_V7',r['shard'],flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "v7-next16-physical-pred-${{ matrix.shard }}", path: pred-*.json, if-no-files-found: warn, retention-days: 30}
  final:
    needs: physical
    if: always() && needs.physical.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[eval]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "v7-next16-physical-pred-*", merge-multiple: true, path: preds}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: v7-next16-output-contract-blind, path: blind}
      - name: Only NOW fetch isolated publisher references
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: v7-next16-output-contract-reference-NOT-for-model, path: labels}
      - name: Score strict original versus old lastline and zero-extra-call caption
        run: |
          set -euo pipefail
          python -m scripts.eval_2wiki16_v7_zero_call_answer_contract score \
            --blind blind/blind.json --labels labels/reference.json \
            --parts preds/pred-0.json preds/pred-1.json preds/pred-2.json preds/pred-3.json \
            --out final-new16-v7-contract.json
          python - <<'PY'
          import json
          x=json.load(open('final-new16-v7-contract.json'))
          assert x['n']==16 and x['zero_extra_model_calls'] and x['not_GAIA']
          assert x['promotion_allowed'] is False
          print('V7_NEW16_ZERO_CALL_FORMAT_FINAL',json.dumps({k:v for k,v in x.items() if k!='cases'},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: v7-next16-zero-call-output-contract-FINAL, path: final-new16-v7-contract.json, if-no-files-found: error, retention-days: 30}
