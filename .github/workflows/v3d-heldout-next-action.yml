name: v3D frozen held-out next-action evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/heldout-next-action-eval
    paths:
      - ".github/workflows/v3d-heldout-next-action.yml"

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "38561069365"
  SOURCE_ARTIFACT: qwen35-9b-qlora-v3d-cpu-adapter
  BASE_MODEL_ID: Qwen/Qwen3.5-9B
  LLAMA_CPP_CONVERTER_COMMIT: aa94f2086147cd4bfbcff818ce998dffce5fcb39
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA256: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_RELEASE_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_RELEASE_SHA256: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  MODEL_ALIAS: qwen3.5-9b
  SAMPLE_COUNT: "64"
  SAMPLE_SEED: heldout-v3b-next-action-v1
  SHARD_COUNT: "8"

jobs:
  prepare-v3d:
    name: Validate and convert v3D adapter
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verify successful v3D training run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          status="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d["status"], d.get("conclusion"))' <<<"$payload")"
          echo "v3D training $status"
          [ "$status" = "completed success" ] || { echo "verified v3D training run is not successful"; exit 1; }

      - name: Download final v3D CPU checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: runs/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validate frozen v3D checkpoint provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/source/checkpoint/adapter/adapter_config.json
          test -s runs/source/checkpoint/adapter/adapter_model.safetensors
          test -s runs/source/checkpoint/state.json
          test -s runs/source/selection.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path('runs/source/checkpoint/state.json').read_text())
          selection = json.loads(Path('runs/source/selection.json').read_text())
          assert state['schema_version'] == 'v3d-cpu-continuation-state/v1', state
          assert state['cuda_available'] is False, state
          assert state['model'] == 'Qwen/Qwen3.5-9B', state
          assert state['batch_index'] == 3, state
          assert state['batch_count'] == 4, state
          assert state['optimizer_steps'] == 24, state
          assert len(state['completed_example_ids']) == 24, state
          assert len(set(state['completed_example_ids'])) == 24, state
          assert state['trainable_scope'] == 'layer-31 LoRA only', state
          assert state['learning_rate'] == 1e-4, state
          assert state['max_length'] == 1024, state
          assert state['selection_sha256'] == selection['selection_sha256'], (state, selection)
          print(json.dumps({
              'source_run_id': os.environ['SOURCE_RUN_ID'],
              'optimizer_steps': state['optimizer_steps'],
              'trainable_scope': state['trainable_scope'],
              'selection_sha256': state['selection_sha256'],
          }, indent=2, sort_keys=True))
          PY

      - name: Pin llama.cpp converter
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout "$LLAMA_CPP_CONVERTER_COMMIT"
          python -m pip install --quiet -r /tmp/llama.cpp/requirements/requirements-convert_lora_to_gguf.txt
          python -m pip install --quiet --upgrade 'transformers>=5.15,<6'
          python - <<'PY'
          from transformers import AutoConfig
          cfg = AutoConfig.from_pretrained('Qwen/Qwen3.5-9B')
          assert cfg.model_type == 'qwen3_5', cfg.model_type
          print('model_type', cfg.model_type)
          PY

      - name: Convert v3D PEFT adapter to GGUF
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/llama.cpp/convert_lora_to_gguf.py \
            --base-model-id "$BASE_MODEL_ID" \
            --outfile runs/qwen35-9b-qlora-v3d-adapter.gguf \
            --outtype f16 \
            runs/source/checkpoint/adapter
          test -s runs/qwen35-9b-qlora-v3d-adapter.gguf
          sha256sum runs/qwen35-9b-qlora-v3d-adapter.gguf | tee runs/qwen35-9b-qlora-v3d-adapter.sha256

      - name: Save conversion provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path('runs/source/checkpoint/state.json').read_text())
          payload = {
              'schema_version': 'v3d-adapter-conversion/v1',
              'source_training_run_id': os.environ['SOURCE_RUN_ID'],
              'source_artifact': os.environ['SOURCE_ARTIFACT'],
              'training_steps': state['optimizer_steps'],
              'trainable_scope': state['trainable_scope'],
              'selection_sha256': state['selection_sha256'],
              'llama_cpp_commit': os.environ['LLAMA_CPP_CONVERTER_COMMIT'],
              'base_model_id': os.environ['BASE_MODEL_ID'],
              'adapter_gguf_bytes': Path('runs/qwen35-9b-qlora-v3d-adapter.gguf').stat().st_size,
              'adapter_sha256': Path('runs/qwen35-9b-qlora-v3d-adapter.sha256').read_text().split()[0],
          }
          Path('runs/adapter-conversion-meta.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload converted v3D adapter
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-9b-qlora-v3d-gguf
          path: |
            runs/qwen35-9b-qlora-v3d-adapter.gguf
            runs/qwen35-9b-qlora-v3d-adapter.sha256
            runs/adapter-conversion-meta.json
            runs/source/checkpoint/state.json
            runs/source/selection.json
          if-no-files-found: error
          retention-days: 30

  heldout-v3d:
    name: heldout-v3d-shard (${{ matrix.shard }})
    needs: prepare-v3d
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused evaluator
        run: python -m pip install --quiet -e '.[dev]'

      - name: Freeze exact held-out shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mkdir -p runs/oracle runs/selection
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          from gaia_small_agent.training.oracle_policy_v3 import generate_oracle_policy_v3_dataset
          from gaia_small_agent.training.qlora import _render_turn_examples, _select_diagnostic_exposure_examples

          class NativeShapeTokenizer:
              def apply_chat_template(self, messages, **kwargs):
                  def dump(value):
                      return json.dumps(value, sort_keys=True, separators=(",", ":"))
                  if kwargs.get("add_generation_prompt"):
                      return dump(messages) + "<assistant>"
                  if messages and messages[-1].get("role") == "assistant":
                      return dump(messages[:-1]) + "<assistant>" + dump(messages[-1])
                  return dump(messages)

          paths = generate_oracle_policy_v3_dataset(Path('runs/oracle'), seed='small-agent-policy-v3')
          rows = [json.loads(line) for line in paths['test'].read_text(encoding='utf-8').splitlines() if line.strip()]
          turns = _render_turn_examples(NativeShapeTokenizer(), rows)
          selected = _select_diagnostic_exposure_examples(turns, count=int(os.environ['SAMPLE_COUNT']), seed=os.environ['SAMPLE_SEED'])
          selected_ids = [str(item['metadata']['example_id']) for item in selected]
          shard_index = int(os.environ['SHARD_INDEX'])
          shard_count = int(os.environ['SHARD_COUNT'])
          shard_ids = selected_ids[shard_index::shard_count]
          payload = {
              'sample_count': len(selected_ids),
              'seed': os.environ['SAMPLE_SEED'],
              'capabilities': dict(Counter(str(item['metadata']['capability']) for item in selected)),
              'action_types': dict(Counter(str(item['metadata']['action_type']) for item in selected)),
              'shard_index': shard_index,
              'shard_count': shard_count,
              'shard_size': len(shard_ids),
              'example_ids': shard_ids,
          }
          assert len(selected_ids) == 64, payload
          assert len(shard_ids) == 8, payload
          Path('runs/selection/selected.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Download and verify Q4 model and llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model /tmp/llama-bin
          touch model/Qwen3.5-9B-Q4_K_M.gguf
          ok=0
          for attempt in {1..12}; do
            if curl --http1.1 -fL --retry 3 --retry-all-errors --retry-delay 2 -C - "$MODEL_URL" -o model/Qwen3.5-9B-Q4_K_M.gguf; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1
          echo "$MODEL_SHA256  model/Qwen3.5-9B-Q4_K_M.gguf" | sha256sum -c -
          curl --http1.1 -fL --retry 10 --retry-all-errors --retry-delay 2 "$LLAMA_RELEASE_URL" -o /tmp/llama.tar.gz
          echo "$LLAMA_RELEASE_SHA256  /tmp/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama-bin
          SERVER="$(find /tmp/llama-bin -type f -name llama-server -perm -111 | head -1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"

      - name: Download converted v3D adapter
        uses: actions/download-artifact@v4
        with:
          name: qwen35-9b-qlora-v3d-gguf
          path: matched-input

      - name: Verify v3D GGUF checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s matched-input/qwen35-9b-qlora-v3d-adapter.gguf
          expected="$(awk '{print $1}' matched-input/qwen35-9b-qlora-v3d-adapter.sha256)"
          echo "$expected  matched-input/qwen35-9b-qlora-v3d-adapter.gguf" | sha256sum -c -

      - name: Run v3D held-out shard with frozen thinking256 protocol
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          shard="$SHARD_INDEX"
          mkdir -p "runs/results/shard-$shard"
          "$LLAMA_SERVER" \
            -m model/Qwen3.5-9B-Q4_K_M.gguf \
            --lora matched-input/qwen35-9b-qlora-v3d-adapter.gguf \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 16384 --threads 4 --parallel 1 \
            --jinja --reasoning on --reasoning-format deepseek --reasoning-budget 256 --temperature 0 \
            > "runs/results/shard-$shard/v3d-server.log" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          from gaia_small_agent.model.openai_compat import OpenAICompatModel
          from gaia_small_agent.training.next_action_eval import evaluate_next_actions

          selection = json.loads(Path('runs/selection/selected.json').read_text())
          model = OpenAICompatModel(
              model=os.environ['MODEL_ALIAS'],
              base_url='http://127.0.0.1:8080',
              timeout_s=240.0,
              max_new_tokens=512,
          )
          summary = evaluate_next_actions(
              'runs/oracle/test.jsonl',
              lambda: model,
              example_ids=set(selection['example_ids']),
          )
          payload = {
              'schema_version': 'heldout-next-action-v3d-shard/v1',
              'arm': 'v3d',
              'thinking': True,
              'reasoning_budget': 256,
              'temperature': 0,
              'max_new_tokens': 512,
              'selection': selection,
              'summary': summary,
          }
          out = Path(f"runs/results/shard-{selection['shard_index']}/v3d.json")
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'shard': selection['shard_index'], 'correct': summary['correct'], 'total': summary['total'], 'errors': summary['error_counts']}, indent=2, sort_keys=True))
          PY

      - name: Upload v3D held-out shard
        uses: actions/upload-artifact@v4
        with:
          name: heldout-v3d-thinking256-shard-${{ matrix.shard }}
          path: runs/results/shard-${{ matrix.shard }}/v3d.json
          if-no-files-found: error
          retention-days: 30

  summarize-v3d:
    name: Summarize v3D against frozen Base and v3B
    needs: heldout-v3d
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Download all v3D shards
        uses: actions/download-artifact@v4
        with:
          pattern: heldout-v3d-thinking256-shard-*
          path: merged/v3d
          merge-multiple: false
      - name: Reuse frozen Base/v3B shards from original run
        uses: actions/download-artifact@v4
        with:
          pattern: heldout-next-action-thinking256-shard-*
          path: merged/frozen-a
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "38423661192"
      - name: Reuse recovered Base/v3B shards 0 and 6
        uses: actions/download-artifact@v4
        with:
          pattern: heldout-next-action-thinking256-shard-*
          path: merged/frozen-b
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "38426519870"

      - name: Build paired frozen summary
        shell: bash
        run: |
          mkdir -p runs/summary
          python - <<'PY'
          import json, math
          from collections import Counter, defaultdict
          from pathlib import Path

          candidate_paths = sorted(Path('merged/v3d').rglob('v3d.json'))
          if len(candidate_paths) != 8:
              raise SystemExit(f'expected 8 v3D shard files, found {len(candidate_paths)}')
          candidate_examples = []
          for path in candidate_paths:
              payload = json.loads(path.read_text())
              candidate_examples.extend(payload['summary']['examples'])
          candidate_by_id = {item['example_id']: item for item in candidate_examples}

          base_paths = sorted(Path('merged/frozen-a').rglob('base.json')) + sorted(Path('merged/frozen-b').rglob('base.json'))
          v3b_paths = sorted(Path('merged/frozen-a').rglob('v3b.json')) + sorted(Path('merged/frozen-b').rglob('v3b.json'))
          if len(base_paths) != 8 or len(v3b_paths) != 8:
              raise SystemExit(f'expected 8 frozen Base/v3B shards, got {len(base_paths)}/{len(v3b_paths)}')
          base_examples, v3b_examples = [], []
          protocol = None
          for path in base_paths:
              payload = json.loads(path.read_text())
              base_examples.extend(payload['summary']['examples'])
              protocol = protocol or {
                  'base_model': 'Qwen3.5-9B Q4_K_M',
                  'runtime': 'llama.cpp',
                  'thinking': payload.get('thinking'),
                  'reasoning_budget': payload.get('reasoning_budget'),
                  'max_new_tokens': payload.get('max_new_tokens'),
                  'temperature': 0,
                  'sample_count': 64,
                  'sample_seed': 'heldout-v3b-next-action-v1',
                  'source_runs': [38423661192, 38426519870],
              }
          for path in v3b_paths:
              v3b_examples.extend(json.loads(path.read_text())['summary']['examples'])
          base_by_id = {item['example_id']: item for item in base_examples}
          v3b_by_id = {item['example_id']: item for item in v3b_examples}
          if len(candidate_by_id) != 64 or set(candidate_by_id) != set(base_by_id) or set(candidate_by_id) != set(v3b_by_id):
              raise SystemExit('v3D examples do not exactly match frozen Base/v3B examples')

          ref = {
              example_id: {
                  'capability': base_by_id[example_id]['capability'],
                  'action_type': base_by_id[example_id]['action_type'],
                  'base': base_by_id[example_id],
                  'v3b': v3b_by_id[example_id],
                  'v3d': candidate_by_id[example_id],
              }
              for example_id in base_by_id
          }

          def counts_for(arm):
              correct = 0
              action = defaultdict(lambda: {'total': 0, 'correct': 0})
              capability = defaultdict(lambda: {'total': 0, 'correct': 0})
              errors = Counter()
              for example_id, row in ref.items():
                  item = row[arm]
                  ok = bool(item['correct'])
                  correct += int(ok)
                  action_name = row['action_type']
                  cap = row['capability']
                  action[action_name]['total'] += 1
                  action[action_name]['correct'] += int(ok)
                  capability[cap]['total'] += 1
                  capability[cap]['correct'] += int(ok)
                  if item.get('error'):
                      errors[str(item['error'])] += 1
              return {
                  'correct': correct,
                  'total': 64,
                  'accuracy': correct * 100.0 / 64,
                  'by_action_type': dict(action),
                  'by_capability': dict(capability),
                  'error_counts': dict(errors),
              }

          def paired(left, right):
              left_only = right_only = both = neither = 0
              transitions = []
              for example_id, row in ref.items():
                  l, r = row[left], row[right]
                  lc, rc = bool(l['correct']), bool(r['correct'])
                  if lc and rc:
                      both += 1
                  elif lc:
                      left_only += 1
                  elif rc:
                      right_only += 1
                  else:
                      neither += 1
                  if lc != rc:
                      transitions.append({
                          'example_id': example_id,
                          'capability': row['capability'],
                          'action_type': row['action_type'],
                          left: {'correct': lc, 'error': l.get('error')},
                          right: {'correct': rc, 'error': r.get('error')},
                      })
              n = left_only + right_only
              if n:
                  k = min(left_only, right_only)
                  p = min(1.0, 2.0 * sum(math.comb(n, i) for i in range(k + 1)) / (2 ** n))
              else:
                  p = 1.0
              return {
                  f'{left}_only_wins': left_only,
                  f'{right}_only_wins': right_only,
                  'both_correct': both,
                  'both_wrong': neither,
                  'mcnemar_two_sided_exact_p': p,
                  'discordant_examples': transitions,
              }

          arms = {name: counts_for(name) for name in ('base', 'v3b', 'v3d')}
          recovery_correct = arms['v3d']['by_capability'].get('failure_recovery', {'correct': 0})['correct']
          final_correct = arms['v3d']['by_action_type'].get('final', {'correct': 0})['correct']
          same_strong_bar_as_v3c = arms['v3d']['correct'] >= 38 and recovery_correct >= 3 and final_correct >= 15
          result = {
              'schema_version': 'heldout-next-action-v3d-summary/v1',
              'protocol': protocol,
              'training': {
                  'source_run_id': 38561069365,
                  'corrective_examples': 24,
                  'trainable_scope': 'layer-31 LoRA only',
              },
              'arms': arms,
              'paired_v3d_vs_base': paired('v3d', 'base'),
              'paired_v3d_vs_v3b': paired('v3d', 'v3b'),
              'same_strong_bar_as_v3c_pass': same_strong_bar_as_v3c,
              'comparison_bar': {
                  'total_correct_at_least': 38,
                  'failure_recovery_correct_at_least': 3,
                  'final_correct_at_least': 15,
                  'note': 'Same fixed strong bar previously used for v3C; not invented after seeing v3D results.',
              },
          }
          Path('runs/summary/v3d-heldout-summary.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'base': arms['base'],
              'v3b': arms['v3b'],
              'v3d': arms['v3d'],
              'v3d_vs_base': result['paired_v3d_vs_base'],
              'v3d_vs_v3b': result['paired_v3d_vs_v3b'],
              'same_strong_bar_as_v3c_pass': same_strong_bar_as_v3c,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload paired v3D summary
        uses: actions/upload-artifact@v4
        with:
          name: heldout-v3d-thinking256-summary
          path: runs/summary/v3d-heldout-summary.json
          if-no-files-found: error
          retention-days: 30
