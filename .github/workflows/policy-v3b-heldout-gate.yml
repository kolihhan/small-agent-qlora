          from pathlib import Path
          from gaia_small_agent.training.oracle_policy_v3 import generate_oracle_policy_v3_dataset
          paths = generate_oracle_policy_v3_dataset('runs/oracle-v3', seed=os.environ['POLICY_SEED'])
          rows = [line for line in paths['test'].read_text(encoding='utf-8').splitlines() if line.strip()]
          shard = int(os.environ['SHARD_INDEX'])
          count = int(os.environ['SHARD_COUNT'])
          selected = [line for i, line in enumerate(rows) if i % count == shard]
          if len(rows) != 200 or len(selected) != 20:
              raise SystemExit(f'bad test partition rows={len(rows)} selected={len(selected)}')
          Path('runs/test-shard.jsonl').write_text('\n'.join(selected) + '\n', encoding='utf-8')
          print(f'test shard={shard} rows={len(selected)}')
          PY

      - name: Download and verify frozen base GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -fL --retry 5 --retry-delay 3 "$MODEL_URL" -o model/Qwen3.5-9B-Q4_K_M.gguf
          echo "$MODEL_SHA256  model/Qwen3.5-9B-Q4_K_M.gguf" | sha256sum -c -

      - name: Download and verify llama-server
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 "$LLAMA_RELEASE_URL" -o /tmp/llama.tar.gz
          echo "$LLAMA_RELEASE_SHA256  /tmp/llama.tar.gz" | sha256sum -c -
          mkdir -p /tmp/llama-bin
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama-bin
          SERVER="$(find /tmp/llama-bin -type f -name llama-server -perm -111 | head -1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"

      - name: Download frozen v3B adapter
        if: matrix.arm == 'qlora'
        uses: actions/download-artifact@v4
        with:
          name: matched-qwen35-9b-qlora-v3b
          path: matched-input

      - name: Start matched llama-server
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          args=(
            -m model/Qwen3.5-9B-Q4_K_M.gguf
            --alias "$MODEL_ALIAS"
            --host 127.0.0.1 --port 8080
            --ctx-size 4096 --threads 4 --parallel 1
            --jinja --reasoning-budget 0
            --temperature 0
          )
          if [ "$ARM" = qlora ]; then
            test -s matched-input/qwen35-9b-qlora-v3b-adapter.gguf
            args+=(--lora matched-input/qwen35-9b-qlora-v3b-adapter.gguf)
          fi
          "$LLAMA_SERVER" "${args[@]}" > /tmp/llama-server.log 2>&1 &
          echo $! > /tmp/llama-server.pid
          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -200 /tmp/llama-server.log >&2
          exit 1

      - name: Evaluate held-out test shard
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          small-agent eval-policy \
            --tasks runs/test-shard.jsonl \
            --work-root "runs/test-${ARM}-${SHARD_INDEX}-work" \
            --output "runs/test-${ARM}-${SHARD_INDEX}.json" \
            --backend openai_compat \
            --model "$MODEL_ALIAS" \
            --openai-base-url http://127.0.0.1:8080 \
            --max-steps 12 \
            --max-new-tokens 512
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(f"runs/test-{os.environ['ARM']}-{os.environ['SHARD_INDEX']}.json")
          data = json.loads(path.read_text())
          data['provenance'] = {
              'split': 'test',
              'arm': os.environ['ARM'],
              'shard_index': int(os.environ['SHARD_INDEX']),
              'shard_count': int(os.environ['SHARD_COUNT']),
              'model_sha256': os.environ['MODEL_SHA256'],
              'convert_run_id': os.environ['CONVERT_RUN_ID'],
          }
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/llama-server.pid ]; then kill "$(cat /tmp/llama-server.pid)" || true; fi

      - name: Upload test shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-v3b-test-${{ matrix.arm }}-${{ matrix.shard }}
          path: runs/test-${{ matrix.arm }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  test-aggregate:
    needs: test
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install --quiet -e .
      - name: Download test shard summaries
        uses: actions/download-artifact@v4
        with:
          pattern: policy-v3b-test-*
          path: runs/test
          merge-multiple: true
      - name: Aggregate Base and v3B test
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def aggregate(arm):
              paths = sorted(Path('runs/test').glob(f'test-{arm}-*.json'))
              if len(paths) != 10:
                  raise SystemExit(f'{arm}: expected 10 test shards, got {len(paths)}')
              rows = [json.loads(p.read_text()) for p in paths]
              total = sum(r['total'] for r in rows)
              if total != 200:
                  raise SystemExit(f'{arm}: expected 200 test tasks, got {total}')
              stops = Counter()
              by_capability = {}
              for row in rows:
                  stops.update(row.get('stop_reasons') or {})
                  for capability, metrics in (row.get('by_capability') or {}).items():
                      bucket = by_capability.setdefault(capability, {'total':0,'correct':0,'completed':0,'required_tools_satisfied':0})
                      for key in bucket:
                          bucket[key] += int(metrics.get(key, 0))
              correct = sum(r['correct'] for r in rows)
              completed = sum(r['completed'] for r in rows)
              return {
                  'schema_version': 'tool-policy-v3b-heldout/v1',
                  'split': 'test',
                  'arm': arm,
                  'total': total,
                  'correct': correct,
                  'completed': completed,
                  'exact_success_rate': correct * 100.0 / total,
                  'completion_rate': completed * 100.0 / total,
                  'required_tools_satisfied': sum(r['required_tools_satisfied'] for r in rows),
                  'tool_calls': sum(r['tool_calls'] for r in rows),
                  'tool_errors': sum(r['tool_errors'] for r in rows),
                  'duplicate_calls_blocked': sum(r['duplicate_calls_blocked'] for r in rows),
                  'stop_reasons': dict(stops),
                  'by_capability': by_capability,
              }

          for arm in ('base','qlora'):
              payload = aggregate(arm)
              Path(f'runs/test-{arm}.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
              print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - name: Apply preregistered test promotion gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from gaia_small_agent.training.policy_promotion import evaluate_policy_promotion
          base = json.loads(Path('runs/test-base.json').read_text())
          candidate = json.loads(Path('runs/test-qlora.json').read_text())
          verdict = evaluate_policy_promotion(base, candidate, min_exact_pp=float(os.environ['MIN_EXACT_PP']))
          Path('runs/test-verdict.json').write_text(json.dumps(verdict, indent=2, sort_keys=True) + '\n')
          print(json.dumps(verdict, indent=2, sort_keys=True))
          if not verdict['promote']:
              raise SystemExit(2)
          PY
      - name: Upload test gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-v3b-test-gate
          path: |
            runs/test-base.json
            runs/test-qlora.json
            runs/test-verdict.json
          if-no-files-found: warn
          retention-days: 30
