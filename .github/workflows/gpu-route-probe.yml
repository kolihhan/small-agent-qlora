name: GPU route probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gpu-route-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured credentials without exposing them
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          status = {
              "kaggle_username_key": bool(os.environ.get("KAGGLE_USERNAME") and os.environ.get("KAGGLE_KEY")),
              "kaggle_api_token": bool(os.environ.get("KAGGLE_API_TOKEN")),
              "hf_token": bool(os.environ.get("HF_TOKEN")),
          }
          print(json.dumps(status, indent=2))
          if not status["hf_token"]:
              raise SystemExit("HF_TOKEN unexpectedly missing")
          PY
