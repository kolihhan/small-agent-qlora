name: Complete Base GAIA v2 shard5 cases

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gaia-9b-final-matched-v2-base5cases.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  FROZEN_COMMIT: "9840da3067eafe203b34869e679ed9b7b2f4158c"
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA256: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_RELEASE_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_RELEASE_SHA256: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  MODEL_ALIAS: qwen3.5-9b

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        position: [5,25,45,65,85]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_COMMIT }}
      - name: Verify frozen evaluator commit
        run: test "$(git rev-parse HEAD)" = "$FROZEN_COMMIT"
      - name: Install frozen evaluator
        run: python -m pip install --quiet -e '.[search,files,eval]'
      - name: Download and verify same base GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -fL --retry 5 --retry-delay 3 "$MODEL_URL" -o model/Qwen3.5-9B-Q4_K_M.gguf
          echo "$MODEL_SHA256  model/Qwen3.5-9B-Q4_K_M.gguf" | sha256sum -c -
      - name: Download and verify same llama-server
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 "$LLAMA_RELEASE_URL" -o /tmp/llama.tar.gz
          echo "$LLAMA_RELEASE_SHA256  /tmp/llama.tar.gz" | sha256sum -c -
          mkdir -p /tmp/llama-bin
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama-bin
          SERVER="$(find /tmp/llama-bin -type f -name llama-server -perm -111 | head -1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
      - name: Start exact frozen Base inference protocol
        shell: bash
        env:
          POSITION: ${{ matrix.position }}
        run: |
          set -euo pipefail
          mkdir -p "runs/base/case-$POSITION"
          "$LLAMA_SERVER" -m model/Qwen3.5-9B-Q4_K_M.gguf --alias "$MODEL_ALIAS" --host 127.0.0.1 --port 8080 --ctx-size 4096 --threads 4 --parallel 1 --jinja --reasoning-budget 0 --temperature 0 > "runs/base/case-$POSITION/llama-server.log" 2>&1 &
          echo $! > "runs/base/case-$POSITION/llama-server.pid"
          for i in {1..180}; do curl -fsS http://127.0.0.1:8080/health >/dev/null && exit 0; sleep 2; done
          exit 1
      - name: API smoke test
        shell: bash
        run: |
          python - <<'PY'
          import requests
          r=requests.post('http://127.0.0.1:8080/v1/chat/completions',json={'model':'qwen3.5-9b','messages':[{'role':'user','content':'Reply with exactly READY.'}],'temperature':0,'max_tokens':32},timeout=180); r.raise_for_status()
          PY
      - name: Run one exact frozen Evaluation100 case with infra-only retries
        shell: bash
        env:
          POSITION: ${{ matrix.position }}
        run: |
          set -euo pipefail
          root="runs/base/case-$POSITION"
          for attempt in 1 2 3; do
            set +e
            python scripts/run_gaia_eval_shard.py --backend openai_compat --model "$MODEL_ALIAS" --openai-base-url http://127.0.0.1:8080 --hf-token "$HF_TOKEN" --shard-index "$POSITION" --shard-count 100 --work-root "$root" --output "$root/shard.json"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ -s "$root/results.jsonl" ]; then exit "$rc"; fi
            [ "$attempt" -lt 3 ] || exit "$rc"
            sleep $((15 * attempt))
          done
      - name: Stop server
        if: always()
        shell: bash
        env:
          POSITION: ${{ matrix.position }}
        run: |
          if [ -f "runs/base/case-$POSITION/llama-server.pid" ]; then kill "$(cat "runs/base/case-$POSITION/llama-server.pid")" || true; fi
      - name: Verify exactly one case
        if: success()
        shell: bash
        env:
          POSITION: ${{ matrix.position }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ['POSITION']; f=Path(f'runs/base/case-{p}/results.jsonl')
          rows=[json.loads(x) for x in f.read_text().splitlines() if x.strip()]
          assert len(rows)==1; print(rows[0]['task_id'], rows[0]['correct'], rows[0]['stop_reason'])
          PY
      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base5v2-gaia-base-case-${{ matrix.position }}
          path: runs/base/case-${{ matrix.position }}
          if-no-files-found: error
          retention-days: 30
