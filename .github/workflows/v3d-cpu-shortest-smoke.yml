name: v3D CPU shortest-step benchmark

on:
  push:
    branches:
      - experiment/heldout-next-action-eval
    paths:
      - .github/workflows/v3d-cpu-shortest-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HF_MODEL: Qwen/Qwen3.5-9B
  POLICY_SEED: small-agent-policy-v3
  V3B_EXPOSURE_SEED: qlora-v3b-exposure
  V3D_EXPOSURE_SEED: qlora-v3d-corrective
  MAX_LENGTH: '768'
  V3B_SOURCE_RUN_ID: '38152689194'
  V3B_SOURCE_ARTIFACT: qwen35-9b-qlora-v3b-adapter
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'
  MALLOC_ARENA_MAX: '2'

jobs:
  shortest-step:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU QLoRA stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -e '.[train,files]'

      - name: Verify CPU-only runner
        run: |
          set -euo pipefail
          free -h
          python - <<'PY'
          import json, os, torch
          torch.set_num_threads(min(4, os.cpu_count() or 1))
          payload = {
              'cuda_available': torch.cuda.is_available(),
              'cpu_count': os.cpu_count(),
              'torch_threads': torch.get_num_threads(),
              'torch': torch.__version__,
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          if torch.cuda.is_available():
              raise SystemExit('benchmark must remain GitHub CPU-only')
          PY

      - name: Download frozen v3B adapter
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V3B_SOURCE_ARTIFACT }}
          path: runs/v3b-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V3B_SOURCE_RUN_ID }}

      - name: Unpack v3B adapter
        run: |
          set -euo pipefail
          mkdir -p runs/v3d-cpu-short/v3b-adapter
          test -s runs/v3b-source/qwen35-9b-qlora-v3b-adapter.zip
          unzip -q runs/v3b-source/qwen35-9b-qlora-v3b-adapter.zip -d runs/v3d-cpu-short/v3b-adapter
          test -s runs/v3d-cpu-short/v3b-adapter/adapter_config.json
          test -s runs/v3d-cpu-short/v3b-adapter/adapter_model.safetensors

      - name: Run one shortest v3D corrective QLoRA step
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          from pathlib import Path

          import torch
          from peft import PeftModel, prepare_model_for_kbit_training
          from transformers import AutoModelForCausalLM, AutoTokenizer, BitsAndBytesConfig

          from gaia_small_agent.training.exposure_v3d import select_v3d_corrective_examples
          from gaia_small_agent.training.oracle_policy_v3 import generate_oracle_policy_v3_dataset
          from gaia_small_agent.training.qlora import (
              _render_turn_examples,
              _select_diagnostic_exposure_examples,
              _tokenize_completion_examples,
              load_verified_rows,
          )

          root = Path('runs/v3d-cpu-short')
          root.mkdir(parents=True, exist_ok=True)
          status_path = root / 'status.json'

          def write_status(**fields):
              payload = {
                  'schema_version': 'v3d-cpu-shortest-step/v1',
                  'backend': 'github-actions-cpu',
                  'model': os.environ['HF_MODEL'],
                  'cuda_available': torch.cuda.is_available(),
                  **fields,
              }
              status_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              print(json.dumps(payload, indent=2, sort_keys=True), flush=True)

          torch.set_num_threads(min(4, os.cpu_count() or 1))
          try:
              torch.set_num_interop_threads(1)
          except RuntimeError:
              pass

          write_status(stage='selecting_example')
          oracle = generate_oracle_policy_v3_dataset(root / 'oracle', seed=os.environ['POLICY_SEED'])
          tokenizer = AutoTokenizer.from_pretrained(os.environ['HF_MODEL'], trust_remote_code=True)
          rows = load_verified_rows(oracle['train'])
          all_examples = _render_turn_examples(tokenizer, rows)
          v3b = _select_diagnostic_exposure_examples(
              all_examples,
              count=64,
              seed=os.environ['V3B_EXPOSURE_SEED'],
          )
          v3b_tasks = {str(x['metadata']['task_id']) for x in v3b}
          v3d = select_v3d_corrective_examples(
              all_examples,
              seed=os.environ['V3D_EXPOSURE_SEED'],
              exclude_task_ids=v3b_tasks,
          )

          def total_tokens(item):
              p = len(tokenizer(item['prompt'], add_special_tokens=False)['input_ids'])
              c = len(tokenizer(item['completion'], add_special_tokens=False)['input_ids'])
              return p + c

          example = min(v3d, key=lambda x: (total_tokens(x), x['metadata']['example_id']))
          total = total_tokens(example)
          if total > int(os.environ['MAX_LENGTH']):
              raise SystemExit(f'shortest v3D example does not fit MAX_LENGTH: {total}')
          tokenized = _tokenize_completion_examples(
              tokenizer,
              [example],
              max_length=int(os.environ['MAX_LENGTH']),
              require_full_prompt=True,
          )[0]
          (root / 'selected-example.json').write_text(
              json.dumps({'metadata': example['metadata'], 'total_tokens': total}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          write_status(stage='loading_model', selected_example=example['metadata'], selected_example_tokens=total)

          bnb = BitsAndBytesConfig(
              load_in_4bit=True,
              bnb_4bit_quant_type='nf4',
              bnb_4bit_use_double_quant=True,
              bnb_4bit_compute_dtype=torch.bfloat16,
          )
          base = AutoModelForCausalLM.from_pretrained(
              os.environ['HF_MODEL'],
              quantization_config=bnb,
              device_map='auto',
              trust_remote_code=True,
          )
          base = prepare_model_for_kbit_training(base, use_gradient_checkpointing=False)
          model = PeftModel.from_pretrained(base, root / 'v3b-adapter', is_trainable=True)
          trainable = []
          trainable_count = 0
          for name, param in model.named_parameters():
              keep = 'lora_' in name and '.layers.31.' in name
              param.requires_grad = keep
              if keep:
                  trainable.append(param)
                  trainable_count += param.numel()
          if not trainable:
              raise SystemExit('no layer-31 LoRA parameters trainable')
          model.train()
          optimizer = torch.optim.AdamW(trainable, lr=1e-4)
          batch = {
              key: torch.tensor([value], dtype=torch.long)
              for key, value in tokenized.items()
          }

          write_status(
              stage='forward',
              selected_example=example['metadata'],
              selected_example_tokens=total,
              trainable_parameter_count=trainable_count,
          )
          t0 = time.perf_counter()
          outputs = model(**batch)
          forward_seconds = time.perf_counter() - t0
          loss = outputs.loss
          write_status(
              stage='backward',
              selected_example=example['metadata'],
              selected_example_tokens=total,
              trainable_parameter_count=trainable_count,
              forward_seconds=forward_seconds,
              loss=float(loss.detach().cpu()),
          )

          t1 = time.perf_counter()
          loss.backward()
          backward_seconds = time.perf_counter() - t1
          write_status(
              stage='optimizer',
              selected_example=example['metadata'],
              selected_example_tokens=total,
              trainable_parameter_count=trainable_count,
              forward_seconds=forward_seconds,
              backward_seconds=backward_seconds,
              loss=float(loss.detach().cpu()),
          )

          t2 = time.perf_counter()
          optimizer.step()
          optimizer.zero_grad(set_to_none=True)
          optimizer_seconds = time.perf_counter() - t2
          model.save_pretrained(root / 'adapter-step1')
          result = {
              'schema_version': 'v3d-cpu-shortest-step/v1',
              'success': True,
              'backend': 'github-actions-cpu',
              'model': os.environ['HF_MODEL'],
              'cuda_available': torch.cuda.is_available(),
              'selected_example': example['metadata'],
              'selected_example_tokens': total,
              'trainable_parameter_count': trainable_count,
              'trainable_scope': 'layer-31 LoRA only',
              'forward_seconds': forward_seconds,
              'backward_seconds': backward_seconds,
              'optimizer_seconds': optimizer_seconds,
              'step_seconds': forward_seconds + backward_seconds + optimizer_seconds,
              'loss': float(loss.detach().cpu()),
          }
          (root / 'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          write_status(stage='complete', **{k: v for k, v in result.items() if k not in {'schema_version', 'backend', 'model', 'cuda_available'}})
          PY

      - name: Verify benchmark result
        run: |
          set -euo pipefail
          test -s runs/v3d-cpu-short/result.json
          test -s runs/v3d-cpu-short/adapter-step1/adapter_config.json
          test -s runs/v3d-cpu-short/adapter-step1/adapter_model.safetensors
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('runs/v3d-cpu-short/result.json').read_text())
          assert result['success'] is True, result
          assert result['cuda_available'] is False, result
          assert result['selected_example_tokens'] <= 768, result
          assert result['step_seconds'] > 0, result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload shortest-step evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3d-cpu-shortest-step
          path: |
            runs/v3d-cpu-short/status.json
            runs/v3d-cpu-short/result.json
            runs/v3d-cpu-short/selected-example.json
            runs/v3d-cpu-short/adapter-step1/adapter_config.json
            runs/v3d-cpu-short/adapter-step1/adapter_model.safetensors
          if-no-files-found: warn
          retention-days: 14
