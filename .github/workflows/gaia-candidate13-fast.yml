name: GAIA candidate13 fast

on:
  push:
    paths:
      - ".github/GAIA_CANDIDATE13_TRIGGER"

permissions:
  contents: read

env:
  MODEL: qwen3.5:4b
  OLLAMA_URL: http://127.0.0.1:11434
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  candidate13:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify gated dataset credential
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN_NOT_CONFIGURED"
            exit 42
          fi

      - name: Install dependencies
        run: python -m pip install -e ".[eval,search,files]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr

      - name: Start Ollama and pull model
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "$OLLAMA_URL/api/tags" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$OLLAMA_URL/api/tags" >/dev/null
          ollama pull "$MODEL"

      - name: Run candidate first 13 Diagnostic25 cases
        run: |
          small-agent gaia-eval \
            --source gaia-benchmark/GAIA \
            --hf-token "$HF_TOKEN" \
            --partition diagnostic \
            --limit 13 \
            --backend ollama \
            --model "$MODEL" \
            --ollama-url "$OLLAMA_URL" \
            --max-steps 12 \
            --max-new-tokens 512 \
            --work-root runs/gaia-candidate13-fast \
            --protected-questions runs/gaia-protected-candidate-fast.json

      - name: Print sanitized summary
        if: always()
        run: |
          if [ -f runs/gaia-candidate13-fast/summary.json ]; then
            cat runs/gaia-candidate13-fast/summary.json
          else
            echo "NO_SUMMARY"
          fi

      - name: Upload sanitized summary only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaia-candidate13-fast-summary
          path: runs/gaia-candidate13-fast/summary.json
          if-no-files-found: warn
          retention-days: 14
