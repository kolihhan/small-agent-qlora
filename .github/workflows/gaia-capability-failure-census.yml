name: PROOF CPU GAIA100 modality capability failure census
on:
  push:
    branches: [research/gaia-capability-census-20261123]
    paths: [.github/workflows/gaia-capability-failure-census.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: gaia-capability-census-20261123
  cancel-in-progress: true
jobs:
  capability_census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - name: Test safe aggregate semantics
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_gaia_capability_census.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 44980055775
          pattern: gaia-v8-paired-shard-*
          github-token: ${{ github.token }}
          path: historical-private
      - name: Compare original frozen GAIA100 traces without exporting answers
        run: |
          python -m scripts.audit_gaia_capability_census \
            --root historical-private --output safe/capability-census.json
          test -s safe/capability-census.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GAIA100-CAPABILITY-CENSUS-SAFE
          path: safe/capability-census.json
          if-no-files-found: error
          retention-days: 21
