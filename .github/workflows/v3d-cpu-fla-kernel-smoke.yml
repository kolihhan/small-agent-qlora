name: v3D CPU FLA kernel smoke

on:
  push:
    branches:
      - experiment/heldout-next-action-eval
    paths:
      - .github/workflows/v3d-cpu-fla-kernel-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  cpu-kernel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU torch and FLA CPU extra
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'flash-linear-attention[cpu]'

      - name: Probe gated-delta CPU execution
        run: |
          set -euo pipefail
          mkdir -p runs/v3d-cpu-fla-smoke
          python - <<'PY'
          import json
          import os
          import time
          import traceback
          from pathlib import Path

          import torch
          import triton
          import fla
          from fla.ops.gated_delta_rule import chunk_gated_delta_rule

          torch.set_num_threads(min(4, os.cpu_count() or 1))
          result = {
              'schema_version': 'v3d-cpu-fla-kernel-smoke/v1',
              'cuda_available': torch.cuda.is_available(),
              'device': 'cpu',
              'torch': torch.__version__,
              'triton': getattr(triton, '__version__', 'unknown'),
              'fla': getattr(fla, '__version__', 'unknown'),
          }

          # Smallest legal chunk size. If FLA has a real CPU backend, this should
          # execute without loading Qwen3.5 or spending minutes on a full forward.
          B, T, H, K, V = 1, 16, 2, 8, 8
          q = torch.randn(B, T, H, K, dtype=torch.float32)
          k = torch.randn(B, T, H, K, dtype=torch.float32)
          v = torch.randn(B, T, H, V, dtype=torch.float32)
          g = torch.randn(B, T, H, dtype=torch.float32)
          beta = torch.sigmoid(torch.randn(B, T, H, dtype=torch.float32))

          t0 = time.perf_counter()
          try:
              out, state = chunk_gated_delta_rule(
                  q=q,
                  k=k,
                  v=v,
                  g=g,
                  beta=beta,
                  chunk_size=16,
              )
              result.update({
                  'success': True,
                  'elapsed_seconds': time.perf_counter() - t0,
                  'output_shape': list(out.shape),
              })
          except Exception as exc:
              result.update({
                  'success': False,
                  'elapsed_seconds': time.perf_counter() - t0,
                  'exception_type': type(exc).__name__,
                  'exception': str(exc),
                  'traceback': traceback.format_exc(),
              })

          path = Path('runs/v3d-cpu-fla-smoke/result.json')
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3d-cpu-fla-kernel-smoke
          path: runs/v3d-cpu-fla-smoke/result.json
          if-no-files-found: warn
          retention-days: 14
