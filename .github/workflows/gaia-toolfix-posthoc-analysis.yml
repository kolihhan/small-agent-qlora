name: GAIA ToolFix paired posthoc audit

on:
  workflow_dispatch:
  push:
    branches:
      - qlora/gaia-9b-v2
      - tool-runtime-v2/red-tests
    paths:
      - ".github/workflows/gaia-toolfix-posthoc-analysis.yml"

permissions:
  contents: read
  actions: read

env:
  BASE_RUN_ID: "38326300262"
  QLORA_RUN_ID: "38337206077"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Base ToolFix shards
        uses: actions/download-artifact@v4
        with:
          pattern: base-ctx16k-toolfix-gaia-shard-*
          path: evidence/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}

      - name: Download QLoRA ToolFix shards
        uses: actions/download-artifact@v4
        with:
          pattern: v3b-ctx16k-toolfix-gaia-shard-*
          path: evidence/qlora
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.QLORA_RUN_ID }}

      - name: Build paired audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from collections import Counter
          from pathlib import Path

          def load_rows(root):
              rows = []
              files = sorted(Path(root).glob('**/results.jsonl'))
              if len(files) != 20:
                  raise SystemExit(f'{root}: expected 20 results files, got {len(files)}')
              for path in files:
                  rows.extend(json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip())
              if len(rows) != 100 or len({r['task_id'] for r in rows}) != 100:
                  raise SystemExit(f'{root}: expected 100 unique rows, got {len(rows)}')
              return {r['task_id']: r for r in rows}

          def arm_summary(rows):
              values = list(rows.values())
              timeout_rows = [r for r in values if r['stop_reason'] == 'model_timeout']
              timeout_steps = Counter(int(r['steps']) for r in timeout_rows)
              timeout_after_success = 0
              timeout_after_any_tool = 0
              timeout_after_successful_python = 0
              for r in timeout_rows:
                  trace = r.get('trace') or []
                  before_error = []
                  for e in trace:
                      if e.get('kind') == 'model_error':
                          break
                      before_error.append(e)
                  results = [e for e in before_error if e.get('kind') == 'tool_result']
                  if results:
                      timeout_after_any_tool += 1
                  if results and bool(results[-1].get('data', {}).get('ok')):
                      timeout_after_success += 1
                  if results and results[-1].get('data', {}).get('name') == 'python' and bool(results[-1].get('data', {}).get('ok')):
                      timeout_after_successful_python += 1
              return {
                  'correct': sum(bool(r['correct']) for r in values),
                  'completed': sum(bool(r['completed']) for r in values),
                  'stop_reasons': dict(sorted(Counter(r['stop_reason'] for r in values).items())),
                  'timeout_steps': {str(k): v for k, v in sorted(timeout_steps.items())},
                  'timeouts_at_final_step_12': timeout_steps.get(12, 0),
                  'timeouts_at_steps_1_2': sum(v for k, v in timeout_steps.items() if k <= 2),
                  'timeouts_after_any_tool_result': timeout_after_any_tool,
                  'timeouts_immediately_after_successful_tool_result': timeout_after_success,
                  'timeouts_immediately_after_successful_python_result': timeout_after_successful_python,
                  'tool_calls': sum(int(r['tool_calls']) for r in values),
                  'tool_errors': sum(int(r['tool_errors']) for r in values),
                  'duplicates': sum(int(r['duplicate_calls_blocked']) for r in values),
                  'mean_steps': sum(int(r['steps']) for r in values) / len(values),
                  'mean_latency_ms': sum(float(r['latency_ms']) for r in values) / len(values),
              }

          def exact_mcnemar(b, c):
              n = b + c
              if n == 0:
                  return 1.0
              k = min(b, c)
              tail = sum(math.comb(n, i) for i in range(k + 1)) / (2 ** n)
              return min(1.0, 2 * tail)

          base = load_rows('evidence/base')
          qlora = load_rows('evidence/qlora')
          if set(base) != set(qlora):
              raise SystemExit('Base/QLoRA task sets differ')

          both_correct = both_wrong = base_only = qlora_only = changed_answer = 0
          stop_pairs = Counter()
          qlora_rescues = []
          base_rescues = []
          paired_timeout_flip = Counter()
          for tid in sorted(base):
              b, q = base[tid], qlora[tid]
              bc, qc = bool(b['correct']), bool(q['correct'])
              if bc and qc: both_correct += 1
              elif bc: base_only += 1; base_rescues.append(tid)
              elif qc: qlora_only += 1; qlora_rescues.append(tid)
              else: both_wrong += 1
              if str(b.get('model_answer', '')) != str(q.get('model_answer', '')):
                  changed_answer += 1
              stop_pairs[(b['stop_reason'], q['stop_reason'])] += 1
              paired_timeout_flip[(b['stop_reason'] == 'model_timeout', q['stop_reason'] == 'model_timeout')] += 1

          payload = {
              'schema_version': 'gaia-toolfix-posthoc/v1',
              'source_runs': {'base': int(__import__('os').environ['BASE_RUN_ID']), 'qlora-v3b': int(__import__('os').environ['QLORA_RUN_ID'])},
              'arms': {'base': arm_summary(base), 'qlora-v3b': arm_summary(qlora)},
              'paired': {
                  'both_correct': both_correct,
                  'both_wrong': both_wrong,
                  'base_only_correct': base_only,
                  'qlora_only_correct': qlora_only,
                  'changed_model_answer_count': changed_answer,
                  'mcnemar_exact_two_sided_p': exact_mcnemar(base_only, qlora_only),
                  'base_only_correct_task_ids': base_rescues,
                  'qlora_only_correct_task_ids': qlora_rescues,
                  'stop_reason_pairs': {f'{a} -> {b}': n for (a,b), n in sorted(stop_pairs.items())},
                  'timeout_pairing': {f'base_timeout={a},qlora_timeout={b}': n for (a,b), n in sorted(paired_timeout_flip.items())},
              },
          }
          Path('gaia-toolfix-posthoc.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload paired audit
        uses: actions/upload-artifact@v4
        with:
          name: gaia-toolfix-posthoc-audit
          path: gaia-toolfix-posthoc.json
          if-no-files-found: error
          retention-days: 30
