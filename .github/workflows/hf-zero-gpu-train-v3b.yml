name: ZeroGPU Qwen3.5 9B QLoRA v3B

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hf-zero-gpu-train-v3b.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_SPACE_ID: kolihhan/small-agent-qlora-v2-train
  EXPERIMENT_COMMIT: "ad8e72e9bdfdccda978e5538470b68fa08f4eccc"
  TRAIN_STEPS: "64"
  EXPOSURE_COUNT: "64"
  EXPOSURE_SEED: "qlora-v3b-exposure"
  EXPOSURE_PROFILE: "v3b-diagnostic"
  MAX_LENGTH: "1024"
  GRAD_ACC: "1"

jobs:
  validate:
    name: Validate frozen v3B contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,files]"
      - name: Verify frozen v3B contracts
        run: >-
          python -m pytest -q
          tests/test_oracle_policy_v3.py
          tests/test_training_exposure_v3b.py
          tests/test_qlora_completion_preserving_tokens.py
          tests/test_v3b_workflow_contract.py

  train:
    name: Train fixed 64-step v3B adapter
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Install clients and verify usable ZeroGPU quota
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_TOKEN_NOT_CONFIGURED"; exit 42; }
          python -m pip install --quiet 'huggingface_hub>=1.0' 'gradio_client>=2,<3'
          python - <<'PY'
          import json, os
          from huggingface_hub import HfApi
          q = HfApi(token=os.environ['HF_TOKEN']).get_zero_gpu_quota()
          payload = {
              'base': q.base,
              'remaining': q.remaining,
              'resets_at': q.resets_at.isoformat() if q.resets_at else None,
              'required_reservation_seconds': 293,
          }
          print(json.dumps(payload, indent=2))
          if q.remaining < 293:
              raise SystemExit(f"Need >=293 quota seconds for the 195s reservation, only {q.remaining} remain")
          PY

      - name: Deploy frozen v3B trainer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/project /tmp/space-src
          mkdir -p /tmp/project /tmp/space-src
          curl -fsSL "https://github.com/kolihhan/small-agent-qlora/archive/${EXPERIMENT_COMMIT}.tar.gz" -o /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C /tmp/project --strip-components=1
          cp -R /tmp/project/src/gaia_small_agent /tmp/space-src/gaia_small_agent

          cat > /tmp/space-src/requirements.txt <<'EOF'
          transformers>=5.15,<6
          peft>=0.20,<1
          trl>=1.10,<2
          bitsandbytes>=0.50.1,<1
          accelerate>=1.10,<2
          datasets>=4
          requests>=2.32
          huggingface_hub>=1.0
          gradio>=6,<7
          jinja2>=3.1
          EOF

          cat > /tmp/space-src/README.md <<'EOF'
          ---
          title: Small Agent QLoRA v3B Train
          emoji: 🧪
          colorFrom: gray
          colorTo: blue
          sdk: gradio
          sdk_version: 6.0.1
          app_file: app.py
          pinned: false
          private: true
          hardware: zero-a10g
          ---
          Temporary private trainer for the frozen Small Agent 9B QLoRA v3B learning probe.
          EOF

          cat > /tmp/space-src/app.py <<'PYAPP'
          from __future__ import annotations
          import json, os, shutil, time, traceback
          from pathlib import Path

          import gradio as gr
          import spaces
          import torch
          from huggingface_hub import snapshot_download
          from transformers import AutoTokenizer

          from gaia_small_agent.training.oracle_policy_v3 import generate_oracle_policy_v3_dataset
          from gaia_small_agent.training.qlora import (
              _build_training_exposure_report,
              _render_turn_examples,
              _select_diagnostic_exposure_examples,
              _tokenize_completion_examples,
              load_verified_rows,
              train_qlora,
          )

          MODEL = 'Qwen/Qwen3.5-9B'
          ROOT = Path('/tmp/qlora-v3b')
          MODEL_PATH = snapshot_download(repo_id=MODEL, token=os.environ.get('HF_TOKEN') or None)
          TOKENIZER = AutoTokenizer.from_pretrained(MODEL_PATH, trust_remote_code=True)
          EXPOSURE_COUNT = int(os.environ.get('EXPOSURE_COUNT', '64'))
          EXPOSURE_SEED = os.environ.get('EXPOSURE_SEED', 'qlora-v3b-exposure')
          EXPOSURE_PROFILE = os.environ.get('EXPOSURE_PROFILE', 'v3b-diagnostic')
          TRAIN_STEPS = int(os.environ.get('TRAIN_STEPS', '64'))
          MAX_LENGTH = int(os.environ.get('MAX_LENGTH', '1024'))
          GRAD_ACC = int(os.environ.get('GRAD_ACC', '1'))

          EXPECTED_CAPS = {
              'argument_grounding': 6,
              'duplicate_avoidance': 4,
              'evidence_to_final': 20,
              'failure_recovery': 8,
              'multi_step': 12,
              'no_tool_stop': 2,
              'strategy_switch': 6,
              'tool_selection': 6,
          }

          def build_data():
              if ROOT.exists():
                  shutil.rmtree(ROOT)
              ROOT.mkdir(parents=True)
              return generate_oracle_policy_v3_dataset(ROOT / 'oracle', seed='small-agent-policy-v3')

          def exposure_preflight():
              paths = build_data()
              rows = load_verified_rows(paths['train'])
              turns = _render_turn_examples(TOKENIZER, rows)
              selected = _select_diagnostic_exposure_examples(
                  turns,
                  count=EXPOSURE_COUNT,
                  seed=EXPOSURE_SEED,
              )
              report = _build_training_exposure_report(
                  selected,
                  seed=EXPOSURE_SEED,
                  source_example_count=len(turns),
              )
              lengths = []
              for item in selected:
                  prompt = len(TOKENIZER(item['prompt'], add_special_tokens=False)['input_ids'])
                  completion = len(TOKENIZER(item['completion'], add_special_tokens=False)['input_ids'])
                  lengths.append((prompt, completion, prompt + completion))
              tokenized = _tokenize_completion_examples(
                  TOKENIZER,
                  selected,
                  max_length=MAX_LENGTH,
                  require_full_prompt=True,
              )
              supervised = [sum(1 for x in row['labels'] if x != -100) for row in tokenized]
              report.update({
                  'verified_rows': len(rows),
                  'tokenized_examples': len(tokenized),
                  'minimum_safe_context': max(total for _, _, total in lengths),
                  'max_length': MAX_LENGTH,
                  'min_supervised_tokens': min(supervised),
                  'max_supervised_tokens': max(supervised),
                  'all_have_supervised_tokens': all(x > 0 for x in supervised),
                  'require_full_prompt': True,
                  'exposure_profile': EXPOSURE_PROFILE,
              })
              return report

          @spaces.GPU(duration=195)
          def train():
              try:
                  if TRAIN_STEPS != 64:
                      raise ValueError(f'TRAIN_STEPS must stay frozen at 64, got {TRAIN_STEPS}')
                  if EXPOSURE_COUNT != 64:
                      raise ValueError(f'EXPOSURE_COUNT must stay frozen at 64, got {EXPOSURE_COUNT}')
                  if EXPOSURE_PROFILE != 'v3b-diagnostic':
                      raise ValueError(f'EXPOSURE_PROFILE must stay v3b-diagnostic, got {EXPOSURE_PROFILE}')
                  if MAX_LENGTH != 1024:
                      raise ValueError(f'MAX_LENGTH must stay frozen at 1024, got {MAX_LENGTH}')
                  if GRAD_ACC != 1:
                      raise ValueError(f'GRAD_ACC must stay frozen at 1, got {GRAD_ACC}')

                  paths = build_data()
                  out = ROOT / 'adapter'
                  start = time.time()
                  train_qlora(
                      data_path=paths['train'],
                      output_dir=out,
                      model_name=MODEL_PATH,
                      max_length=int(os.environ['MAX_LENGTH']),
                      learning_rate=1e-4,
                      lora_r=16,
                      lora_alpha=32,
                      lora_dropout=0.05,
                      max_steps=TRAIN_STEPS,
                      save_steps=TRAIN_STEPS,
                      gradient_accumulation_steps=GRAD_ACC,
                      lora_target_modules='all-linear',
                      exposure_count=int(os.environ['EXPOSURE_COUNT']),
                      exposure_seed=os.environ['EXPOSURE_SEED'],
                      exposure_profile=os.environ['EXPOSURE_PROFILE'],
                      require_full_prompt=True,
                  )
                  elapsed = time.time() - start
                  required = [
                      out / 'adapter_config.json',
                      out / 'adapter_model.safetensors',
                      out / 'run_config.json',
                      out / 'training-exposure.json',
                  ]
                  missing = [str(path) for path in required if not path.is_file()]
                  if missing:
                      raise RuntimeError(f'missing adapter outputs: {missing}')

                  cfg = json.loads((out / 'run_config.json').read_text())
                  exposure = json.loads((out / 'training-exposure.json').read_text())
                  if cfg.get('training_examples') != 64 or cfg.get('source_training_examples') != 3600:
                      raise RuntimeError(f'unexpected training counts: {cfg}')
                  if cfg.get('max_length') != 1024 or cfg.get('require_full_prompt') is not True:
                      raise RuntimeError(f'full-context contract was not preserved: {cfg}')
                  if cfg.get('exposure_profile') != 'v3b-diagnostic':
                      raise RuntimeError(f'unexpected exposure profile: {cfg}')
                  if exposure.get('selected_example_count') != 64:
                      raise RuntimeError(f'unexpected exposure count: {exposure}')
                  if exposure.get('action_type_counts') != {'final': 29, 'tool_call': 35}:
                      raise RuntimeError(f'unexpected action distribution: {exposure}')
                  if exposure.get('capability_counts') != EXPECTED_CAPS:
                      raise RuntimeError(f'unexpected capability distribution: {exposure}')

                  archive = shutil.make_archive(str(ROOT / 'qwen35-9b-qlora-v3b-adapter'), 'zip', out)
                  meta = {
                      'ok': True,
                      'model': MODEL,
                      'experiment_commit': os.environ.get('EXPERIMENT_COMMIT'),
                      'max_steps': TRAIN_STEPS,
                      'max_length': MAX_LENGTH,
                      'gradient_accumulation_steps': GRAD_ACC,
                      'elapsed_seconds': elapsed,
                      'seconds_per_optimizer_step': elapsed / TRAIN_STEPS,
                      'cuda': torch.cuda.is_available(),
                      'device': torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
                      'vram_gib': round(torch.cuda.get_device_properties(0).total_memory / 1024**3, 2) if torch.cuda.is_available() else 0,
                      'adapter_bytes': (out / 'adapter_model.safetensors').stat().st_size,
                      'training_examples': cfg.get('training_examples'),
                      'source_training_examples': cfg.get('source_training_examples'),
                      'exposure_count': cfg.get('exposure_count'),
                      'exposure_seed': cfg.get('exposure_seed'),
                      'exposure_profile': cfg.get('exposure_profile'),
                      'selection_sha256': exposure.get('selection_sha256'),
                      'selected_example_count': exposure.get('selected_example_count'),
                      'action_type_counts': exposure.get('action_type_counts'),
                      'capability_counts': exposure.get('capability_counts'),
                      'truncation_policy': cfg.get('truncation_policy'),
                      'require_full_prompt': cfg.get('require_full_prompt'),
                  }
                  return archive, meta
              except Exception as exc:
                  return None, {
                      'ok': False,
                      'type': type(exc).__name__,
                      'error': str(exc),
                      'traceback': traceback.format_exc(),
                  }

          with gr.Blocks() as demo:
              pre = gr.Button('preflight')
              pre_out = gr.JSON()
              pre.click(exposure_preflight, inputs=[], outputs=pre_out, api_name='preflight')
              run = gr.Button('train')
              out_file, out_json = gr.File(), gr.JSON()
              run.click(train, inputs=[], outputs=[out_file, out_json], api_name='train')

          if __name__ == '__main__':
              demo.launch(show_error=True)
          PYAPP

          python - <<'PY'
          import os
          from huggingface_hub import HfApi, SpaceHardware
          api = HfApi(token=os.environ['HF_TOKEN'])
          rid = os.environ['HF_SPACE_ID']
          api.upload_folder(
              folder_path='/tmp/space-src',
              repo_id=rid,
              repo_type='space',
              delete_patterns=['*.py', 'requirements.txt', 'gaia_small_agent/**'],
              commit_message='train diagnostic QLoRA v3B',
          )
          api.add_space_secret(repo_id=rid, key='HF_TOKEN', value=os.environ['HF_TOKEN'])
          for key in ('EXPERIMENT_COMMIT', 'TRAIN_STEPS', 'EXPOSURE_COUNT', 'EXPOSURE_SEED', 'EXPOSURE_PROFILE', 'MAX_LENGTH', 'GRAD_ACC'):
              api.add_space_variable(repo_id=rid, key=key, value=os.environ[key])
          api.request_space_hardware(repo_id=rid, hardware=SpaceHardware.ZERO_A10G)
          try:
              api.restart_space(repo_id=rid)
          except Exception as exc:
              print(f'restart request: {exc}')
          PY

      - name: Wait for API and validate frozen exposure on CPU
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from huggingface_hub import HfApi
          from gradio_client import Client

          api = HfApi(token=os.environ['HF_TOKEN'])
          rid = os.environ['HF_SPACE_ID']
          runtime = api.wait_for_space(repo_id=rid, timeout=1800)
          print(runtime)
          deadline = time.time() + 900
          last = None
          while time.time() < deadline:
              try:
                  client = Client(rid, token=os.environ['HF_TOKEN'], verbose=False)
                  client.view_api(print_info=False)
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(10)
          else:
              raise SystemExit(f'API not ready: {last}')

          result = client.predict(api_name='/preflight')
          print(json.dumps(result, indent=2, sort_keys=True))
          expected_caps = {
              'argument_grounding': 6,
              'duplicate_avoidance': 4,
              'evidence_to_final': 20,
              'failure_recovery': 8,
              'multi_step': 12,
              'no_tool_stop': 2,
              'strategy_switch': 6,
              'tool_selection': 6,
          }
          if result.get('source_example_count') != 3600:
              raise SystemExit(result)
          if result.get('selected_example_count') != 64 or result.get('tokenized_examples') != 64:
              raise SystemExit(result)
          if result.get('action_type_counts') != {'final': 29, 'tool_call': 35}:
              raise SystemExit(result)
          if result.get('capability_counts') != expected_caps:
              raise SystemExit(result)
          if result.get('minimum_safe_context', 99999) > 1024:
              raise SystemExit(result)
          if result.get('max_length') != 1024 or result.get('require_full_prompt') is not True:
              raise SystemExit(result)
          if result.get('exposure_profile') != 'v3b-diagnostic':
              raise SystemExit(result)
          if not result.get('all_have_supervised_tokens'):
              raise SystemExit(result)
          PY

      - name: Train real 9B QLoRA v3B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/zero-gpu-v3b
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from gradio_client import Client

          client = Client(os.environ['HF_SPACE_ID'], token=os.environ['HF_TOKEN'], verbose=False)
          archive, meta = client.predict(api_name='/train')
          print(json.dumps(meta, indent=2, sort_keys=True))
          Path('runs/zero-gpu-v3b/training-meta.json').write_text(
              json.dumps(meta, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          if not meta.get('ok'):
              raise SystemExit('remote training failed')
          if meta.get('cuda') is not True:
              raise SystemExit('training did not run on CUDA')
          if meta.get('max_steps') != 64 or meta.get('gradient_accumulation_steps') != 1:
              raise SystemExit(f'unexpected training steps: {meta}')
          if meta.get('max_length') != 1024 or meta.get('require_full_prompt') is not True:
              raise SystemExit(f'unexpected context contract: {meta}')
          if meta.get('training_examples') != 64 or meta.get('source_training_examples') != 3600:
              raise SystemExit(f'unexpected training_examples: {meta}')
          if meta.get('selected_example_count') != 64:
              raise SystemExit(f'unexpected selected examples: {meta}')
          if meta.get('action_type_counts') != {'final': 29, 'tool_call': 35}:
              raise SystemExit(f'unexpected action counts: {meta}')
          if meta.get('exposure_profile') != 'v3b-diagnostic':
              raise SystemExit(f'unexpected exposure profile: {meta}')
          if not archive:
              raise SystemExit('adapter archive was not returned')
          shutil.copyfile(archive, 'runs/zero-gpu-v3b/qwen35-9b-qlora-v3b-adapter.zip')
          PY

      - name: Upload v3B adapter and training metadata
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-9b-qlora-v3b-adapter
          path: runs/zero-gpu-v3b/
          if-no-files-found: error

      - name: Return temporary trainer to CPU
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, SpaceHardware
          token = os.environ.get('HF_TOKEN')
          rid = os.environ.get('HF_SPACE_ID')
          if not token or not rid:
              raise SystemExit(0)
          try:
              HfApi(token=token).request_space_hardware(repo_id=rid, hardware=SpaceHardware.CPU_BASIC)
              print('temporary trainer returned to CPU_BASIC')
          except Exception as exc:
              print(f'cleanup request failed: {exc}')
          PY
