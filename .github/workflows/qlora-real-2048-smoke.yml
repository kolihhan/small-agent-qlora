name: QLoRA real 39-task 2048-token T4 memory-only smoke
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: T4 smoke only, NOT SFT
        required: true
        type: choice
        options: [T4]
        default: T4
permissions:
  contents: read
  actions: read
concurrency:
  group: colab-gpu-${{ github.repository }}
  cancel-in-progress: false

jobs:
  colab:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      COLAB_GPU: ${{ inputs.gpu || 'T4' }}
      COLAB_TOKEN: ${{ secrets.COLAB_TOKEN }}
      COLAB_CLI_TOKEN: ${{ secrets.COLAB_CLI_TOKEN }}
      GOOGLE_COLAB_TOKEN: ${{ secrets.GOOGLE_COLAB_TOKEN }}
      COLAB_ACCESS_TOKEN: ${{ secrets.COLAB_ACCESS_TOKEN }}
      COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
      COLAB_OAUTH_JSON: ${{ secrets.COLAB_OAUTH_JSON }}
      COLAB_AUTH_JSON: ${{ secrets.COLAB_AUTH_JSON }}
      COLAB_CREDENTIALS_JSON: ${{ secrets.COLAB_CREDENTIALS_JSON }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_COLAB_CREDENTIALS: ${{ secrets.GOOGLE_COLAB_CREDENTIALS }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Authenticate Colab with existing GitHub Secret (never reveal credentials)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'google-auth>=2.20' 'requests>=2.31'
          python - <<'PY'
          import json,os,pathlib
          import google.auth
          from google.auth.transport.requests import Request
          names=("COLAB_ADC_JSON","COLAB_OAUTH_JSON","COLAB_AUTH_JSON","COLAB_CREDENTIALS_JSON",
                 "GOOGLE_APPLICATION_CREDENTIALS_JSON","GOOGLE_CREDENTIALS_JSON","GOOGLE_COLAB_CREDENTIALS",
                 "COLAB_TOKEN","COLAB_CLI_TOKEN","GOOGLE_COLAB_TOKEN","COLAB_ACCESS_TOKEN")
          credentials=None
          for name in names:
              raw=os.environ.get(name,"").strip()
              if not raw: continue
              try: doc=json.loads(raw)
              except (ValueError,TypeError): continue
              if not isinstance(doc,dict): continue
              if doc.get("type")=="authorized_user" and all(doc.get(k) for k in ("client_id","client_secret","refresh_token")):
                  credentials=doc
                  break
              if doc.get("type")=="service_account" and all(doc.get(k) for k in ("private_key","client_email")):
                  credentials=doc
                  break
              if all(doc.get(k) for k in ("client_id","client_secret","refresh_token")):
                  credentials={**doc,"type":"authorized_user"}
                  break
          if credentials is None:
              raise RuntimeError("NO_ADC_COMPATIBLE_COLAB_SECRET: expected authorized_user or service_account JSON")
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"colab-adc.json"
          path.write_text(json.dumps(credentials),encoding="utf-8")
          path.chmod(0o600)
          scopes=["openid","https://www.googleapis.com/auth/userinfo.email",
                  "https://www.googleapis.com/auth/cloud-platform",
                  "https://www.googleapis.com/auth/colaboratory"]
          try:
              cred,_=google.auth.load_credentials_from_file(str(path),scopes=scopes)
              cred.refresh(Request())
              if not cred.valid: raise RuntimeError("refreshed credential invalid")
          except Exception as exc:
              lower=str(exc).lower()
              category=next((word for word in ("invalid_grant","invalid_scope","unauthorized_client",
                  "invalid_client","access_denied","insufficient_scope") if word in lower),"other")
              print("COLAB_AUTH_REJECTED",json.dumps({"reason":category,
                    "type":credentials.get("type"),"gpu_allocated":False}))
              raise SystemExit(41)
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("GOOGLE_APPLICATION_CREDENTIALS="+str(path)+"\n")
          print("COLAB_AUTH_SUCCEEDED_NO_GPU_YET")
          PY
      - name: Install official Google Colab CLI and verify API
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'google-colab-cli==0.8.0'
          timeout 110 colab --auth=adc usage
      - name: Wait for Colab account to release the SQL GPU session
        shell: bash
        run: |
          set -euo pipefail
          # A concurrently active SQL SFT job is already using this same
          # Google account. Reserve QLoRA for the NEXT free slot, not now.
          for attempt in {1..18}; do
            usage="$(timeout 70 colab --auth=adc usage)"
            active="$(printf '%s\n' "$usage" | awk '/^Active assignments:/ {print $3}')"
            if ! [[ "$active" =~ ^[0-9]+$ ]]; then
              echo "Unknown Colab active assignment count; refusing speculative allocation"
              exit 70
            fi
            echo "COLAB_SLOT_GATE attempt=$attempt/18 active_assignments=$active"
            if [ "$active" = "0" ]; then
              echo "COLAB_SLOT_AVAILABLE"
              exit 0
            fi
            if [ "$attempt" != "18" ]; then sleep 300; fi
          done
          echo "COLAB_SLOT_UNAVAILABLE: never start a competing 9B GPU job"
          exit 75
      - name: Ensure full-v4 and Shadow25 runs are terminal before adding GPU load
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 43253664558 43255550953; do
            status="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/kolihhan/small-agent-qlora/actions/runs/$run_id" \
              | python -c 'import sys,json; j=json.load(sys.stdin); print(j["status"])')"
            echo "PRIOR_RUN $run_id $status"
            test "$status" = "completed" || { echo "Cannot steal GPU ahead of original train/shadow"; exit 73; }
          done
      - name: Download immutable 39-task real training source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43269944513
          repository: kolihhan/small-agent-qlora
          github-token: ${{ github.token }}
          name: real-multisource-complete-2048-training-preflight
          path: runs/source
      - name: Verify protected, uncropped source and 2048-token metadata on runner
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,eval,files]"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("runs/source/real-multisource-2048-complete-tasks.jsonl")
          assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()=="79c22f0ef7bb6015eeb3997d11f302caf6fc77667d1494813a315ae41ceab676"
          r=json.loads(Path("runs/source/real-multisource-2048-summary.json").read_text())
          assert r["retained_complete_tasks"]==39 and r["retained_native_actions"]==154
          assert r["truncated_prompt_or_completion_count"]==0
          assert r["retained_source_counts"]=={"hotpotqa-distractor-train":35,"2wikimultihopqa-train":4}
          print("REAL_2048_SOURCE_SHA_VALIDATED",r["retained_jsonl_sha256"])
          PY
          test -n "$HF_TOKEN"
          python - <<'PY'
          from gaia_small_agent.benchmark.gaia100 import load_validation
          from gaia_small_agent.training.protection import build_protected_question_hashes
          protected=build_protected_question_hashes(
              load_validation(token=None),"runs/gaia-protected-hashes.json")
          assert len(protected)>=100
          print("SHADOW_DATA_NOT_TRAINED_ON",len(protected))
          PY
      - name: Run TWO optimizer steps only after successful GPU eligibility
        shell: bash
        run: |
          set -euo pipefail
          session="v4-real2048-$GITHUB_RUN_ID"
          cleanup() {
            colab --auth=adc rm -s "$session" "/content/gaia-protected-hashes.json" >/dev/null 2>&1 || true
            colab --auth=adc rm -s "$session" "/content/real-multisource-2048-complete-tasks.jsonl" >/dev/null 2>&1 || true
            colab --auth=adc stop -s "$session" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          colab --auth=adc new -s "$session" --gpu T4
          colab --auth=adc upload -s "$session" \
            runs/source/real-multisource-2048-complete-tasks.jsonl \
            /content/real-multisource-2048-complete-tasks.jsonl
          colab --auth=adc upload -s "$session" \
            runs/gaia-protected-hashes.json \
            /content/gaia-protected-hashes.json
          set +e
          timeout 7200 colab --auth=adc exec -s "$session" -f scripts/colab_real_2048_smoke_remote.py
          rc=$?
          set -e
          mkdir -p exported
          colab --auth=adc download -s "$session" \
            /content/real-2048-smoke-report.json \
            exported/real-2048-smoke-report.json || true
          if [ "$rc" -ne 0 ]; then echo "REAL_2048_SMOKE_FAILED exit=$rc"; exit "$rc"; fi
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("exported/real-2048-smoke-report.json").read_text())
          assert a["schema"]=="real-2048-qwen35-9b-t4-2step-feasibility-v1"
          assert a["dataset_tasks"]==39 and a["dataset_actions"]==154
          assert a["optimizer_steps"]==2 and a["max_length"]==2048
          assert a["adapter_bytes"]>1_000_000
          assert a["gaia_score"]=="UNMEASURED"
          print("REAL_2048_MEMORY_SUCCESS",{
              "gpu":a["gpu"],"optimizer_steps":a["optimizer_steps"],
              "context":a["max_length"],"adapter_bytes":a["adapter_bytes"]})
          PY
      - name: Archive only safe two-step memory proof, not personal GAIA data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-2048-T4-2step-memory-proof
          path: exported/real-2048-smoke-report.json
          if-no-files-found: warn
          retention-days: 30
