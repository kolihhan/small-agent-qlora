name: Fixed Qwen v7 2Wiki16 evidence prompt A/B
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  MODEL_URL: https://huggingface.co/twoody/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf?download=true
  MODEL_SHA: 8c4cc24f54473f3d4e080d4ec7fd2a40d0bbec0f94f3c807cd62694905357d54
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz
  LLAMA_SHA: 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
  V7_SHA: 475f5fb59a553390a0dde9425d36b42ff85a0345bdd31b8465c22fd4d2bc02e2
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: |
          python -m pip install -e '.[eval,files,dev]'
          python -m pytest -q tests/test_eval_2wiki16_v7_evidence_prompt_ab.py
          python -m compileall -q scripts/eval_2wiki16_v7_evidence_prompt_ab.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 43712873154, github-token: "${{ github.token }}", name: 2wiki-original-source-cohort-frozen, path: old-linked}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 43862358318, github-token: "${{ github.token }}", name: source-2wiki-body8, path: old-novel}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44016763563, github-token: "${{ github.token }}", name: qwen9b-2wiki16-serializer-new-source-locked, path: old16}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44022276727, github-token: "${{ github.token }}", name: qwen9b-2wiki48-serializer-new-source-locked, path: old48}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 44034337935, github-token: "${{ github.token }}", name: qwen9b-v7-factorial-new8-source-frozen, path: old8}
      - name: Freeze 16 new public cases, segregate gold labels before inference
        run: |
          set -euo pipefail
          python -m scripts.eval_2wiki16_v7_evidence_prompt_ab freeze \
            --prior-linked old-linked/2wiki-linked-frozen.json \
            --prior-novel old-novel/frozen.json \
            --prior16 old16/2wiki16-serializer-source-frozen.json \
            --prior48 old48/2wiki48-serializer-source-frozen.json \
            --prior8 old8/factorial-new8-source-frozen.json \
            --out blind.json --labels reference.json
          python - <<'PY'
          import json
          b=json.load(open('blind.json')); r=json.load(open('reference.json'))
          assert b['n']==16 and b['cases_sha256']==r['cases_sha256']
          assert len({c['id'] for c in b['cases']})==16
          assert all('answer' not in c and 'support' not in c for c in b['cases'])
          print('NEW_2WIKI16_FROZEN',b['cases_sha256'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: v7-2wiki16-blind-source, path: blind.json, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: v7-2wiki16-reference-NOT-for-model, path: reference.json, if-no-files-found: error}
  physical:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {shard: [0, 1, 2, 3]}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[eval,files]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: v7-2wiki16-blind-source, path: blinded}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {repository: kolihhan/small-agent-qlora, run-id: 43434228699, github-token: "${{ github.token }}", name: qlora-v7-converted-f16-gguf, path: adapter}
      - name: Verify exact base GGUF, original v7 LoRA and llama runtime
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 "$MODEL_URL" -o base.gguf
          curl -fsSL --retry 5 "$LLAMA_URL" -o llama.tar.gz
          echo "$MODEL_SHA  base.gguf" | sha256sum -c -
          echo "$LLAMA_SHA  llama.tar.gz" | sha256sum -c -
          echo "$V7_SHA  adapter/qlora-v7-adapter-f16.gguf" | sha256sum -c -
          mkdir -p llama
          tar -xzf llama.tar.gz -C llama
          server=$(find "$PWD/llama" -type f -name llama-server -print -quit)
          test -x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
      - name: Actual v7 original same-model two-arm 12-step tool loop, no reference file
        env: {SHARD: "${{ matrix.shard }}"}
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" -m base.gguf --lora adapter/qlora-v7-adapter-f16.gguf \
            --alias qwen3.5-9b --host 127.0.0.1 --port 8080 --ctx-size 16384 \
            --threads 4 --parallel 1 --jinja --reasoning-budget 0 --temperature 0 \
            > "$RUNNER_TEMP/llama.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..180}; do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/health >/dev/null
          python -m scripts.eval_2wiki16_v7_evidence_prompt_ab infer \
            --blind blinded/blind.json --shard "$SHARD" \
            --work "workspace-$SHARD" --out "paired-$SHARD.json"
          python - <<'PY'
          import glob,json
          files=glob.glob('paired-*.json'); assert len(files)==1
          x=json.load(open(files[0]))
          assert x['status']=='BOTH_REAL_V7_ARMS_SEALED_BEFORE_REFERENCE'
          assert x['n']==4 and x['no_reference_loaded']
          print('SEALED_V7_TWO_ARMS',x['shard'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "v7-2wiki16-physical-${{ matrix.shard }}", path: paired-*.json, if-no-files-found: warn}
  aggregate:
    needs: physical
    if: always() && needs.physical.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[eval]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "v7-2wiki16-physical-*", merge-multiple: true, path: predictions}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: v7-2wiki16-blind-source, path: blinded}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: v7-2wiki16-reference-NOT-for-model, path: labels}
      - name: Score only AFTER both-arm raw predictions were sealed
        run: |
          python -m scripts.eval_2wiki16_v7_evidence_prompt_ab score \
            --blind blinded/blind.json --labels labels/reference.json \
            --parts predictions/paired-0.json predictions/paired-1.json \
                    predictions/paired-2.json predictions/paired-3.json \
            --out final-v7-evidence.json
          python - <<'PY'
          import json
          x=json.load(open('final-v7-evidence.json'))
          assert x['n']==16 and x['no_GAIA_or_hidden'] and x['no_QLoRA_training']
          print('FINAL_V7_EVIDENCE_STATE',json.dumps({k:v for k,v in x.items() if k!='cases'},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: v7-2wiki16-evidence-AB-FINAL, path: final-v7-evidence.json, if-no-files-found: error}
