name: PRO Qwen9B source-independent Hotpot16 final serialization

on:
  push:
    branches: [experiment/qwen9b-hotpot-answer-serializer-new16-20261117]
    paths: [scripts/eval_hotpot_serializer_new16.py, tests/test_eval_hotpot_serializer_new16.py, .github/workflows/pro-hotpot16-serializer-qwen9b.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[eval,dev,files]'
      - run: python -m pytest -q tests/test_eval_hotpot_serializer_new16.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/small-agent-qlora
          run-id: 44010234843
          github-token: ${{ github.token }}
          name: hotpot8-source-frozen-before-model
          path: previous
      - run: python -m scripts.eval_hotpot_serializer_new16 --prior previous/hotpot8-frozen.json --output new-hotpot16-frozen.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen9b-hotpot16-serializer-source-frozen
          path: new-hotpot16-frozen.json
          if-no-files-found: error
          retention-days: 30

  paired:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[eval,files]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen9b-hotpot16-serializer-source-frozen
      - name: Start pinned original Qwen3.5-9B Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3.5:9b-q4_K_M
      - name: One original native answer, then same-Qwen-only formatter
        env:
          SHARD: ${{ matrix.shard }}
        run: python -m scripts.eval_hotpot_serializer_new16 --frozen new-hotpot16-frozen.json --shard "$SHARD" --output "serializer16-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen9b-hotpot16-serializer-shard-${{ matrix.shard }}
          path: serializer16-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: always()
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qwen9b-hotpot16-serializer-shard-*
          path: paired-shards
          merge-multiple: true
      - run: python -m scripts.eval_hotpot_serializer_new16 --inputs paired-shards/serializer16-shard-*.json --output hotpot16-serializer-complete.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen9b-hotpot16-serializer-full-only
          path: hotpot16-serializer-complete.json
          if-no-files-found: warn
          retention-days: 30
